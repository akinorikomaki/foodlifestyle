<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 48 48%27 fill=%27none%27 stroke-width=%275%27 stroke-linecap=%27round%27%3E%3Cpath d=%27M24 24c-6-10-18-8-18 0s12 10 18 0%27 stroke=%27%23D0336B%27/%3E%3Cpath d=%27M24 24c6 10 18 8 18 0s-12-10-18 0%27 stroke=%27%231E88C8%27/%3E%3C/svg%3E">
<title>システムの振る舞いカード｜食のシステム編</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5FB; --ink:#23263A; --ink-2:#4A4E66; --ink-3:#6B7088; --rule:#E2E4F0;
  --plus:#D0336B; --minus:#1E88C8; --prob:#C2412D; --probbg:#FFE9E5; --data:#E8790C; --databg:#FFF1DC;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background-color:#F6F5F0;background-image:linear-gradient(rgba(90,140,200,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(90,140,200,.10) 1px,transparent 1px);background-size:24px 24px;background-attachment:fixed;color:var(--ink);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;line-height:1.55}
.wrap{max-width:1600px;margin:0 auto;padding:28px 24px 48px}
header h1{margin:0;font-size:clamp(24px,3vw,34px);font-weight:800;letter-spacing:.02em;color:#1F2A44;line-height:1.2}
header p{margin:0;color:var(--ink-2);font-size:14.5px;max-width:46em}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 22px}
.btn{font:inherit;font-size:14px;font-weight:700;border:2px solid var(--rule);border-bottom-width:4px;background:#fff;color:var(--ink);
  border-radius:12px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:#B9BCD3}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:focus-visible,.card:focus-visible{outline:3px solid #1C6FD1;outline-offset:3px}
.bar .note{margin-left:auto;font-size:13px;color:#3B5683;font-weight:700}

.grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:var(--gap,22px)}
.card{zoom:var(--z,1);width:400px;justify-self:center}
.card{position:relative;aspect-ratio:1/1.48;cursor:pointer;border-radius:20px;outline:none}
.inner{position:absolute;inset:0}
.back{visibility:hidden}
.card.flipped .back{visibility:visible}
.card.flipped .front{visibility:hidden}
.face{position:absolute;inset:0;background:#fff;
  border:2px solid var(--rule);border-bottom-width:5px;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}

.card:hover .face{border-color:var(--c)}

/* 表 */
.front .top{background:var(--c);color:#fff;padding:20px 20px 16px;text-align:center}
.front .nm{font-size:27px;font-weight:800;letter-spacing:.04em;line-height:1.25}
.front .tag{font-size:14px;opacity:.92;margin-top:4px}
.front .en{font-size:12.5px;font-weight:700;opacity:.8;margin-top:2px}
.front .q{display:none;font-size:46px;font-weight:800;line-height:1.1}
.front .body{padding:14px 18px 0;flex:1;display:flex;flex-direction:column;gap:8px}
.lbl{font-size:12px;font-weight:800;color:var(--ink-3)}
.front .ttl{font-size:15.5px;font-weight:800;line-height:1.4}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-direction:column;gap:5px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{flex:none;width:18px;height:0;border-top:4px solid var(--sc);border-radius:2px}
.legend i.dash{border-top-style:dashed;border-top-width:3px}
.read{font-size:13px;color:var(--ink);background:#F7F7FC;border-radius:12px;padding:8px 11px;line-height:1.55}


.foot{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 12px;font-size:12px;color:var(--ink-3)}
.foot b{color:var(--c);font-size:13px}

/* 裏 */
.back .hd{padding:14px 18px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--rule)}
.back .hd b{font-size:18px;color:var(--c)}
.back .hd small{font-size:11.5px;color:var(--ink-3);font-weight:700}
.back .body{padding:10px 16px 0;flex:1;display:flex;flex-direction:column;gap:8px;overflow:auto}
.prob{font-size:13.5px;font-weight:800;color:var(--prob);background:var(--probbg);border-radius:10px;padding:6px 11px}
.cldbox{position:relative}
.cld{width:100%;height:auto;display:block;background:#FAFAFE;border-radius:12px}
.zoom{position:absolute;right:6px;bottom:6px;font:inherit;font-size:11.5px;font-weight:700;border:1.5px solid var(--rule);background:#fff;color:var(--ink-2);border-radius:8px;padding:2px 8px;cursor:pointer}
.zoom:hover{border-color:var(--c);color:var(--ink)}
dialog{border:none;border-radius:20px;padding:18px 20px;width:min(860px,94vw);color:var(--ink)}
dialog::backdrop{background:rgba(35,38,58,.55)}
dialog h2{margin:0 0 4px;font-size:20px}
dialog .prob{margin:6px 0 10px}
dialog .cld{background:#FAFAFE}
dialog .close{float:right}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink-3)}
.key em{font-style:normal;font-weight:800}
.story{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:3px}
.story li{counter-increment:s;font-size:13px;display:flex;gap:7px;align-items:baseline}
.story li::before{content:counter(s);flex:none;width:19px;height:19px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;transform:translateY(3px)}
.again{font-size:11.5px;color:var(--ink-3);font-weight:700;white-space:nowrap}
.hint{font-size:13px;background:#EEF8F4;color:#0F6F56;border-radius:10px;padding:7px 11px}
.hint b{margin-right:4px}
.src{font-size:11px;color:var(--ink-3);line-height:1.45}

/* あてっこモード：表の名前をかくす */
body.guess .front .nm,body.guess .front .tag,body.guess .front .en,body.guess .front .shape{display:none}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
body.guess .front .q{display:block}
body.guess .front .top{background:#3A3E57}

.front .top{position:relative;padding:22px 20px 16px 66px}
.ico{position:absolute;left:14px;top:14px;width:46px;height:46px;padding:5px;border-radius:14px;background:rgba(255,255,255,.18)}
.ico svg{width:100%;height:100%;display:block}
body.guess .ico{display:none}
.front .nm{font-size:29px}
.front .tag{font-size:15px;font-weight:700}
.front .ttl{font-size:20px;line-height:1.4;margin-top:2px}
.gbox{border:2px dashed var(--rule);border-radius:14px;padding:9px 10px 4px;display:flex;flex-direction:column;gap:6px}
.lg{display:flex;gap:8px;align-items:flex-start;font-size:15.5px;line-height:1.4}
.lg i{margin-top:10px}
.lg b{font-weight:800;color:var(--ink)}
.lg em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);background:#EEF0F7;border-radius:6px;padding:1px 6px;margin-left:6px}
.lg small{display:block;font-size:13px;color:var(--ink-3)}
.gsrc{font-size:12px;color:var(--ink-3);text-align:right;margin:-4px 0 2px}
.read{position:relative;font-size:14px;font-weight:500;background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:16px;padding:10px 13px;margin-top:6px}
.read::before{content:"";position:absolute;left:26px;top:-9px;border:9px solid transparent;border-top:0;border-bottom-color:color-mix(in srgb,var(--c) 10%,#fff)}
.foot{justify-content:center}
.pill{background:var(--c);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:6px 18px;border-bottom:3px solid rgba(0,0,0,.18)}
.prob{font-size:15px}
.story li{font-size:14px}
.hint{font-size:13.5px}
.hint b{display:block;margin:0 0 1px}

.sec{font-size:20px;font-weight:800;margin:30px 0 4px}
.secp{margin:0 0 14px;font-size:13.5px;color:var(--ink-2);max-width:46em}
.sec+.grid{margin-top:12px}
.where{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.place{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:2px 10px;border:2px solid}
.place.jp{color:#B3261E;background:#FFF0EE;border-color:#F3B8B0}
.place.world{color:#1C5FA8;background:#EDF4FD;border-color:#A9C8EE}
.placeinfo{font-size:12.5px;color:var(--ink-3)}
header .secp{margin-top:8px}
.stats{display:flex;flex-direction:column;gap:10px;padding:6px 2px 8px}
.st{display:flex;align-items:baseline;gap:10px}
.st b{flex:none;min-width:5.2em;font-size:24px;font-weight:800;line-height:1.1}
.st span{font-size:13px;color:var(--ink-2);line-height:1.4}
.hint{display:flex;flex-direction:column;gap:2px;padding:7px 8px}
.hint>b{font-size:12.5px;margin-bottom:2px}
.lev{display:grid;grid-template-columns:118px minmax(0,1fr);gap:6px;align-items:baseline;border-radius:7px;padding:2px 5px}
.lev .ln{font-size:10.5px;white-space:nowrap;font-weight:800;color:#0F6F56;line-height:1.3}
.lev .ln small{display:block;font-size:10px;font-weight:700;color:#4E8C77}
.lev .ln em{display:block;font-style:normal;font-size:10px;color:#fff;background:#0F6F56;border-radius:999px;padding:0 6px;width:max-content;margin-top:1px}
.lev .lt{font-size:12.5px;color:var(--ink);line-height:1.4}
.lev.key{background:#fff;box-shadow:inset 0 0 0 2px #9ED9C4}
.story li{font-size:13px}
dialog .read{font-size:14px;margin-top:12px}
dialog .read::before{display:none}
.gsrc a,.src a{color:#1C5FA8;text-decoration:underline;text-underline-offset:2px}
.gsrc a:hover,.src a:hover{color:#0B3D75}
.gsrc{text-align:left}
.shape{display:flex;align-items:center;gap:8px;background:#F7F7FC;border-radius:12px;padding:5px 10px;min-width:0}
.shape .sl{font-size:11.5px;font-weight:800;color:var(--ink-2);line-height:1.35}
.shape .sl small{display:block;font-size:11px;font-weight:700;color:var(--ink-3);margin-top:2px}
.shape svg{width:96px;height:auto;flex:none}
header h1{margin-bottom:0}
body.en .front .nm{font-size:23px;line-height:1.2}
body.en .front .ttl{font-size:18px}

body.en .lev{display:block;padding:2px 5px}
body.en .lev .ln{display:block;white-space:normal}
body.en .lev .ln small{display:inline;margin-left:6px}
body.en .story li{font-size:12.5px}
body.en .lev .lt{font-size:12px}

.grip{position:absolute;right:10px;bottom:10px;z-index:5;font-size:11.5px;font-weight:800;color:var(--ink-3);
  background:#fff;border:1.5px solid var(--rule);border-radius:999px;padding:3px 9px;cursor:grab;touch-action:none;user-select:none}
.grip:hover{color:var(--ink);border-color:#B9BCD3}
.card.dragging{position:fixed;z-index:100;pointer-events:none;transform:rotate(2deg) scale(1.02);filter:drop-shadow(0 18px 30px rgba(35,38,58,.28))}
.ph{border:3px dashed #B9BCD3;border-radius:20px;background:rgba(255,255,255,.5)}
body.is-dragging{user-select:none;cursor:grabbing}
body.is-dragging .card{cursor:grabbing}
.zoomctl{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.7);border-radius:14px;padding:3px 6px}
.zoomctl #cols{font-size:13px;font-weight:800;color:#173A73;min-width:3em;text-align:center}
.zoomctl .btn{padding:5px 10px}
.btn:disabled{opacity:.4;cursor:default}
#lang{margin-left:0}
.card .face{box-shadow:0 8px 0 -3px rgba(23,58,115,.10)}

.drawer{position:fixed;top:0;right:0;bottom:0;z-index:50;width:min(400px,92vw);overflow:auto;background:rgba(255,255,255,.96);
  backdrop-filter:blur(6px);box-shadow:-12px 0 30px rgba(23,58,115,.18);padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px));
  border-left:4px solid #A9C8EE;animation:slidein .25s ease-out}
.drawer[hidden]{display:none}
@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.dhd{display:flex;justify-content:space-between;align-items:center}
.dhd b{font-size:19px;color:#173A73}
.drawer p{margin:2px 0 0;font-size:13px;font-weight:700;color:#3B5683}
@media (min-width:1100px){body.drawer-open .wrap{margin-right:400px}}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.tcard{font:inherit;color:var(--ink);text-align:center;background:#fff;border:2px solid var(--rule);border-bottom-width:4px;border-radius:16px;
  padding:12px 10px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .15s,border-color .15s}
.tcard:hover{transform:translateY(-2px);border-color:var(--c)}
.tcard.on{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.tcard b{font-size:16px;font-weight:800;line-height:1.3}
.tcard .tg{font-size:12px;color:var(--ink-3);min-height:2.6em;line-height:1.3}
.tcard svg{width:100%;max-width:210px;height:auto;margin-top:auto}
.tcard .te{font-size:12.5px;font-weight:800;color:var(--c)}
.tcard .tn{font-size:11px;font-weight:700;color:var(--ink-3);background:#F1F3F9;border-radius:999px;padding:1px 9px;margin-top:3px}
.card{transition:opacity .2s,filter .2s}
.card.dim{opacity:.22;filter:grayscale(.7)}
.card.hit .face{outline:4px solid var(--c);outline-offset:3px}
/* ===== はがき比率（1:1.48）に収める ===== */
.front .top{padding:14px 18px 12px 66px}
.front .nm{font-size:25px}
.front .tag{font-size:13.5px;margin-top:2px}
.front .en{font-size:11.5px}
.front .body{padding:10px 16px 0;gap:6px;overflow:hidden}
.front .ttl{font-size:18px;line-height:1.35}
.gbox{padding:7px 9px 3px;gap:4px}
.lg{font-size:14.5px}
.lg small{font-size:12px}
.foot{padding:8px 14px 12px;gap:10px;justify-content:space-between}
.back .hd{padding:11px 70px 7px 16px}
.back .hd b{font-size:17px}
.back .body{padding:8px 14px 10px;gap:6px}
.prob{font-size:13.5px;padding:5px 10px}
.key{font-size:10.5px;gap:2px 10px}
.story li{font-size:12.5px;line-height:1.4}
.hint{padding:6px 8px}
.lev .lt{font-size:12px;line-height:1.35}
.grip{top:10px;right:10px;bottom:auto;background:rgba(255,255,255,.92)}
body.en .front .nm{font-size:21px}
body.en .front .ttl{font-size:16px}
body.en .lg{font-size:13px}
body.en .story li{font-size:11px;line-height:1.3}
body.en .lev .lt{font-size:10.8px;line-height:1.3}
body.en .lev .ln{font-size:10px}
body.en .prob{font-size:12.5px}
.grip{padding:2px 8px;font-size:14px;line-height:1.2}
.front .top{padding-right:46px}
.back .hd{padding-right:48px}
.card .cld{max-height:205px}
body.en .card .cld{max-height:178px}
dialog .cld{width:100%;max-height:68vh;height:auto}
.cldbox{display:flex;justify-content:center;background:#FAFAFE;border-radius:12px}
.cldbox .cld{width:auto;max-width:100%}
.back .body{gap:5px}
.hint>b{font-size:11.5px}
.lev{grid-template-columns:112px minmax(0,1fr)!important;padding:1px 4px}
.lev .ln{font-size:10px}
.lev .ln small{font-size:9px}

/* ===== カードにマウスを当てたとき ===== */
.card{transition:transform .25s ease,opacity .2s,filter .2s}
.card:not(.dragging):hover,.card:not(.dragging):focus-visible{transform:scale(1.045);z-index:4}
.card:not(.dragging):hover .face{box-shadow:0 22px 36px -10px rgba(23,58,115,.35);border-color:var(--c)}
.card.dragging{transform:rotate(2deg) scale(1.02)}

/* ===== 上のボタン（アイコンつき） ===== */
.btn.ib{display:inline-flex;align-items:center;gap:7px}
.btn[hidden]{display:none!important}
.btn.ib svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.sq{padding:6px 8px}
/* ===== 案A：図鑑・フィールドノート風 ===== */
.brand{display:flex;align-items:center;gap:16px}
.brand .logo{width:48px;height:48px;flex:none}
.brand .eyebrow{display:block;font-size:12px;font-weight:800;letter-spacing:.22em;color:#5F6478}
.bar{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;margin:20px 0 24px;padding:4px;background:#fff;border:1.5px solid #E4E1D6;border-radius:14px;box-shadow:0 2px 0 rgba(31,42,68,.04)}
.bar .btn{height:40px;border:none;border-radius:10px;background:transparent;color:#1F2A44;padding:0 13px;font-size:13.5px}
.bar .btn.sq{width:40px;padding:0;justify-content:center}
.bar .btn:hover{background:#F1EFE7;border:none}
.bar .btn[aria-pressed="true"],.bar .btn[aria-expanded="true"]{background:#1F2A44;color:#fff}
.bar .btn:active{transform:translateY(1px)}
.bar .btn:disabled{opacity:.35;background:transparent}
.bar .sep{width:1px;height:26px;background:#DAD8CF;margin:0 4px}
.zoomctl{background:transparent!important;padding:0!important;gap:2px!important}
.zoomctl #cols{color:#1F2A44!important;min-width:2.8em}
.helpw{position:relative;display:inline-flex}
.brand .logo{width:54px;height:54px}
@media (max-width:640px){.bar{display:flex;flex-wrap:nowrap;justify-content:space-between;gap:0}.bar .btn.sq,.bar .btn.ib{width:36px!important}.zoomctl #cols{min-width:2.2em!important;font-size:12px!important}.bar .sep{display:none}
  .bar .btn .bl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .bar .btn.ib{width:40px;padding:0;justify-content:center}.brand .logo{width:42px;height:42px}}

.helppop[hidden]{display:none}
.drawer{border-left-color:#E4E1D6!important;background:rgba(255,255,255,.97)!important}
.dhd b{color:#1F2A44!important}
.drawer p{color:#5F6478!important}
body.en .ebj{display:none}
@media (max-width:640px){.ebj{display:none}}
.hyp{font-size:11px;font-weight:800;color:#8A4B00;background:#FFF1DC;border:1.5px solid #F2C27E;border-radius:999px;padding:1px 8px}
.cnote{font-size:11px;line-height:1.45;color:#8A4B00;background:#FFF7EA;border-radius:8px;padding:4px 8px}
.cnote b{margin-right:4px}
.thq{font-size:34px;font-weight:800;color:var(--c);width:96px;text-align:center;line-height:1}
.prob.tq{background:#EEF0F7;color:#2F3A5C}
.cands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.cand{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px dashed color-mix(in srgb,var(--c) 45%,#fff);border-radius:12px;padding:5px 4px}
.cand svg{width:92px;height:auto}.cand b{font-size:12px;color:var(--c)}
.others{margin:0;padding-left:18px;font-size:12.5px;line-height:1.5}
.drawbox{border:2px dashed #B9BCD3;border-radius:12px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.drawbox b{font-size:13px;color:#2F3A5C}.drawbox span{font-size:11px;color:var(--ink-3)}
body.en .others{font-size:11.5px}
body.en .drawbox{min-height:42px}
body.en .cand svg{width:76px}
body.en .cand{padding:3px 4px}
button.cand{font:inherit;background:#fff;cursor:pointer;transition:transform .15s,background .15s}

    const f=pts[0],l=pts[pts.length-1],T=(x,y,v,an)=>`<text x="${x}" y="${y}" font-size="14" font-weight="800" fill="#23263A" stroke="#fff" stroke-width="3" paint-order="stroke" text-anchor="${an}">${v}</text>`;
    g+=`<circle cx="${f[0]}" cy="${f[1]}" r="3.6" fill="#23263A"/><circle cx="${l[0]}" cy="${l[1]}" r="3.6" fill="#23263A"/>`;
    const off=card.shared?(i?-10:19):-10;const pu=s.pu||'';const fN=v=>s.dp!=null?Number(v).toFixed(s.dp):Math.abs(v)>=10000?new Intl.NumberFormat(LANG==='en'?'en':'ja',{notation:'compact',maximumFractionDigits:1}).format(v):v;g+=(s.h.length<=3&&f[0]-x0>40?T(f[0]-6,f[1]+off,fN(f[3])+pu,'end'):T(f[0]+6,f[1]+off,fN(f[3])+pu,'start'))+T(l[0],l[1]+off,fN(l[3])+pu,'middle');
    if(ss.length===1&&pts.length>3){const mid=pts.slice(1,-1);const mx=mid.reduce((p,q)=>q[3]>p[3]?q:p),mn=mid.reduce((p,q)=>q[3]<p[3]?q:p);
      [mx,mn].forEach((q,k)=>{const lo=k===1,rg=(b-a)*.12,ex=lo?(q[3]<Math.min(f[3],l[3])-rg):(q[3]>Math.max(f[3],l[3])+rg);if(!ex)return;
        g+=`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="#23263A"/>`+T(q[0],q[1]+(lo?19:-10),fN(q[3])+pu+(LANG==='en'?' ('+yl(q[2])+')':'（'+yl(q[2])+'）'),'middle');});}

// 因果ループ図（tet_tool の archSVG を、食の言葉で描けるようにしたもの）
function cldSVG(card){
  const def0=ARCH[card.id],def={...def0,L:(card.L||def0.L).map((l,i)=>card.loops&&card.loops[i]?[card.loops[i],...l.slice(1)]:l)},U='m'+(++N),pos={...def0.roles,...(card.pos||{})},BX={},FS=12.5,LH=14;
  const lines=k=>(card.names[k]||k).split('\n');
  Object.keys(pos).forEach(k=>{const ls=lines(k);const w=Math.max(56,Math.max(...ls.map(x=>tw(x,FS)))+16);const pp=card.pr.includes(k)?5:0;BX[k]=[w/2+pp,(ls.length===2?21:14)+pp];});
  const exitP=(k,tx,ty)=>{const[x,y]=pos[k],[hw,hh]=BX[k],dx=tx-x,dy=ty-y;if(!dx&&!dy)return[x,y];const sc=Math.min((hw+4)/Math.abs(dx||1e-9),(hh+4)/Math.abs(dy||1e-9));return[x+dx*sc,y+dy*sc];};
  const loopsOf=(a,b)=>def.L.filter(l=>{const n=l[3];const i=n.indexOf(a);return i>=0&&n[(i+1)%n.length]===b;});
  const mutual=(a,b)=>def.e.some(q=>q[0]===b&&q[1]===a);
  let g='';
  def.e.forEach(([a,b,p0,dly])=>{const p=(card.signs&&card.signs[a+'>'+b])||p0;const[x1,y1]=pos[a],[x2,y2]=pos[b],mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;let cx,cy;const lp=loopsOf(a,b);
    if(mutual(a,b)){cx=mx+dy*.3;cy=my-dx*.3;}
    else if(lp.length===1&&lp[0][3].length>2){const ns=lp[0][3],lx=ns.reduce((t,k)=>t+pos[k][0],0)/ns.length,ly=ns.reduce((t,k)=>t+pos[k][1],0)/ns.length;let vx=mx-lx,vy=my-ly;const l=Math.hypot(vx,vy)||1;cx=mx+vx/l*L*.22;cy=my+vy/l*L*.22;}
    else{cx=mx+dy*.08;cy=my-dx*.08;}
    const[sx,sy]=exitP(a,cx,cy),[ex,ey]=exitP(b,cx,cy),col=p==='+'?'#D0336B':'#1E88C8';
    g+=`<path d="M${sx},${sy} Q${cx},${cy} ${ex},${ey}" fill="none" stroke="${col}" stroke-width="1.8" marker-end="url(#${U}${p==='+'?'p':'n'})"/>`;
    const t=.78,qx=(1-t)**2*sx+2*(1-t)*t*cx+t*t*ex,qy=(1-t)**2*sy+2*(1-t)*t*cy+t*t*ey,tx=2*(1-t)*(cx-sx)+2*t*(ex-cx),ty=2*(1-t)*(cy-sy)+2*t*(ey-cy),tl=Math.hypot(tx,ty)||1;
    let nx=ty/tl,ny=-tx/tl;const ox=cx-(sx+ex)/2,oy=cy-(sy+ey)/2;if(nx*ox+ny*oy<0){nx=-nx;ny=-ny;}
    g+=`<text x="${qx+nx*9}" y="${qy+ny*9+4}" font-size="13" font-weight="800" fill="${col}" text-anchor="middle">${p==='+'?'+':'−'}</text>`;
    if(dly){const hx=.25*sx+.5*cx+.25*ex,hy=.25*sy+.5*cy+.25*ey;g+=`<text x="${hx}" y="${hy+4}" font-size="12" font-weight="700" text-anchor="middle" fill="#555">∥</text>`;}});
  def.L.forEach(([k,x,y])=>{const c=k==='R'?'#D0336B':'#1E88C8';g+=`<circle cx="${x}" cy="${y}" r="11" fill="#fff" stroke="${c}" stroke-width="1.5"/><text x="${x}" y="${y+4.5}" font-size="12" font-weight="800" text-anchor="middle" fill="${c}">${k}</text>`;});
  Object.keys(pos).forEach(k=>{const[x,y]=pos[k],m=lines(k),isP=card.pr.includes(k),isD=card.data.includes(k),hw=BX[k][0]-(isP?5:0),hh=BX[k][1]-(isP?5:0);
    if(isP)g+=`<rect x="${x-hw-5}" y="${y-hh-5}" width="${hw*2+10}" height="${hh*2+10}" rx="11" fill="#FFE9E5" stroke="#E5533D" stroke-width="2"/><text x="${x-hw-3}" y="${y-hh-9}" font-size="10.5" font-weight="800" fill="#C2412D">${card.focus?u('focusTag'):u('probTag')}</text>`;
    g+=`<rect x="${x-hw}" y="${y-hh}" width="${hw*2}" height="${hh*2}" rx="8" fill="${isD?'#FFF1DC':'#fff'}" stroke="${isD?'#E8790C':'#D9DBEA'}" stroke-width="1.3"/>`;
    m.forEach((ln,i)=>g+=`<text x="${x}" y="${y+(i-(m.length-1)/2)*LH+4.5}" font-size="${FS}" font-weight="700" text-anchor="middle" fill="${isD?'#9A4E00':'#23263A'}">${esc(ln)}</text>`);});
  let x0=-34,y0=-16,x1=364,y1=224;
  Object.keys(pos).forEach(k=>{const[x,y]=pos[k],[hw,hh]=BX[k];x0=Math.min(x0,x-hw-16);x1=Math.max(x1,x+hw+16);y0=Math.min(y0,y-hh-20);y1=Math.max(y1,y+hh+16);});
  def.L.forEach(([k,x,y])=>{x0=Math.min(x0,x-16);x1=Math.max(x1,x+16);});
  return `<svg class="cld" viewBox="${x0} ${y0} ${x1-x0} ${y1-y0}" role="img" aria-label="${esc(card.nm)}${u('loopAria')}"><defs>
   <marker id="${U}p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#D0336B"/></marker>
   <marker id="${U}n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1E88C8"/></marker></defs>${g}</svg>`;
}

// 魚の絵（10グループのうち、とりすぎの分を赤くぬる）
function pictBox(c){
  const P=c.pict,h=D[P.k].h,val=y=>(h.find(p=>p[0]===y)||[0,0])[1];
  const W=330,rowH=38,H=P.years.length*rowH+6,x0=52,fw=22;let g='',defs='';
  const fish=(x,y,id,frac)=>{const d=`M${x},${y} c6,-9 16,-9 20,0 c-4,9 -14,9 -20,0z M${x+20},${y} l6,-6 v12z`;
    defs+=`<clipPath id="${id}"><rect x="${x-1}" y="${y-10}" width="${28*frac}" height="20"/></clipPath>`;
    return `<path d="${d}" fill="#DCE6F2"/><path class="fr" d="${d}" fill="#E5533D" clip-path="url(#${id})"/><circle cx="${x+5}" cy="${y-1.5}" r="1.4" fill="#23263A"/>`;};
  P.years.forEach((y,r)=>{const v=val(y)/10,yy=18+r*rowH;
    g+=`<text x="0" y="${yy+4}" font-size="13" font-weight="800" fill="#4A4E66">${y}${u('yr')}</text>`;
    for(let n=0;n<10;n++){const fr=Math.max(0,Math.min(1,v-n));g+=fish(x0+n*fw+2,yy,'f'+(++N),fr);}
    g+=`<text x="${W}" y="${yy+4}" font-size="14" font-weight="800" text-anchor="end" fill="#C2412D">${(()=>{const n=Math.floor(v),fr=v-n,ex=Math.abs(fr)<.02,ab=ex?'':u('about');if(LANG==='en')return ab+(fr>=.8?n+1:fr>=.4?n+.5:n)+' / 10';return ab+(fr>=.8?(n+1)+'つ':fr>=.4?n+'つ半':n+'つ');})()}</text>`;});

// 10年ごとの棒グラフ（年あたりの伸び率を「100kgが10年で何kg増えたか」に直す）
function barBox(c){
  const B=c.bars,h=D[B.k].h.map(([y,r])=>[y,Math.round((Math.pow(1+r/100,10)-1)*100)]);
  const W=320,H=180,x0=4,x1=W-4,y0=H-26,yT=26,mx=Math.max(...h.map(p=>p[1])),bw=(x1-x0)/h.length;let g='';
  h.forEach(([y,v],i)=>{const bh=(y0-yT)*v/mx,x=x0+i*bw+bw*.18,w=bw*.64,last=i===h.length-1,top=v===mx;
    g+=`<rect class="bar" x="${x}" y="${y0-bh}" width="${w}" height="${Math.max(bh,1.5)}" rx="5" fill="${c.c}" opacity="${last||top?1:.45}"/>`;
    g+=`<text x="${x+w/2}" y="${y0-bh-6}" font-size="14" font-weight="800" text-anchor="middle" fill="#23263A">+${v}kg</text>`;
    g+=`<text x="${x+w/2}" y="${H-8}" font-size="11" text-anchor="middle" fill="#6B7088">${y}${u('dec')}</text>`;});
  g+=`<path d="M${x0},${y0}H${x1}" stroke="#23263A" stroke-opacity=".3" stroke-width="1.5"/>`;
  return {svg:`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.ttl)}">${g}</svg>`,
    leg:`<div class="lg"><div><b>${esc(B.name)}</b><small>${esc(B.what)}</small></div></div>`,src:[D[B.k].src]};
}

// 始めと終わりの2点を結ぶグラフ（論文の本文にある値だけを使う）
function pairBox(c){
  const P=c.pairs,n=P.items.length,W=320,H=150,pw=W/n;let g='';const F=(v,u)=>u==='%'?v.toFixed(1):String(v);
  P.items.forEach((it,i)=>{
    const x0=i*pw+16,x1=(i+1)*pw-16,yT=44,y0=H-30,vals=[it.a[1],it.b[1]].concat(it.goal!=null?[it.goal]:[]);
    let lo=Math.min(...vals),hi=Math.max(...vals),pd=(hi-lo)*.25||1;lo-=pd;hi+=pd;const Y=v=>y0-(y0-yT)*(v-lo)/(hi-lo);
    const up=it.b[1]>it.a[1],col=up?'#D0336B':'#1E88C8';
    g+=`<text x="${(x0+x1)/2}" y="14" font-size="12.5" font-weight="800" text-anchor="middle" fill="#23263A">${esc(it.nm)} <tspan fill="${col}">${up?'↑':'↓'}</tspan></text>
      <text x="${(x0+x1)/2}" y="28" font-size="10" text-anchor="middle" fill="#6B7088">${esc(it.sub)}</text>`;
    if(it.goal!=null){g+=`<path d="M${x0-6},${Y(it.goal)}H${x1+6}" stroke="#E8790C" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${x1+6}" y="${Y(it.goal)-4}" font-size="9.5" text-anchor="end" fill="#B35A00" font-weight="700">${LANG==='en'?'target':'目標'} ${it.goal}${it.u}</text>`;}
    g+=`<path class="dl" d="M${x0},${Y(it.a[1])}L${x1},${Y(it.b[1])}" stroke="${col}" stroke-width="5" stroke-linecap="round" fill="none"/>
      <circle cx="${x0}" cy="${Y(it.a[1])}" r="4" fill="#23263A"/><circle cx="${x1}" cy="${Y(it.b[1])}" r="4" fill="#23263A"/>
      <text x="${x0}" y="${Y(it.a[1])+(up?18:-9)}" font-size="13" font-weight="800" text-anchor="middle" fill="#23263A" stroke="#fff" stroke-width="3" paint-order="stroke">${F(it.a[1],it.u)}</text>
      <text x="${x1}" y="${Y(it.b[1])+(up?-9:18)}" font-size="13" font-weight="800" text-anchor="middle" fill="${col}" stroke="#fff" stroke-width="3" paint-order="stroke">${F(it.b[1],it.u)}</text>
      <text x="${x0}" y="${H-12}" font-size="10" text-anchor="middle" fill="#6B7088">${it.a[0]}</text>
      <text x="${x1}" y="${H-12}" font-size="10" text-anchor="middle" fill="#6B7088">${it.b[0]}</text>

    if(i)g+=`<path d="M${i*pw},36V${H-26}" stroke="#E2E4F0" stroke-width="1.5"/>`;
  });
  return {svg:`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.ttl)}">${g}</svg>`,
    leg:`<div class="lg"><div><small>${esc(P.what)}</small></div></div>`,src:[c.src]};
}

 en:{btn:'📘 Pattern guide',t:'Pattern guide',n:'Tap a pattern to highlight its cards',ng:'No highlighting in guess mode',good:'Good',bad:'Bad',time:'time →',cnt:'Data cards: ',mai:'',none:'No data cards yet',

function typeSVG(T){
  const W=200,H=112,x0=34,x1=W-10,yT=12,y0=H-28,X=t=>x0+(x1-x0)*t,Y=v=>yT+(y0-yT)*(1-v);
  const curve=P=>{let d=`M${X(P[0][0])},${Y(P[0][1])}`;for(let i=1;i<P.length;i++){const[a,b]=P[i-1],[c,e]=P[i],mx=(a+c)/2;d+=` C${X(mx)},${Y(b)} ${X(mx)},${Y(e)} ${X(c)},${Y(e)}`;}return d;};
  const lines=TYP[T.id];let g=`<path d="M${x0},${yT-4}V${y0}H${x1+4}" fill="none" stroke="#23263A" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="2 4"/>
   <text x="${x0-5}" y="${yT+4}" font-size="10" text-anchor="end" fill="#6B7088" font-weight="700">${tt('good')}</text>
   <text x="${x0-5}" y="${y0}" font-size="10" text-anchor="end" fill="#6B7088" font-weight="700">${tt('bad')}</text>
   <text x="${x1+4}" y="${H-10}" font-size="10" text-anchor="end" fill="#6B7088">${tt('time')}</text>`;
  lines.forEach((P,i)=>{const col=i?`color-mix(in srgb, ${T.c} 45%, #B9A0A8)`:T.c;
    g+=`<path d="${curve(P)}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round"/>`;
    const f=P[0],l=P[P.length-1];g+=`<circle cx="${X(f[0])}" cy="${Y(f[1])}" r="3.5" fill="#23263A"/><circle cx="${X(l[0])}" cy="${Y(l[1])}" r="3.5" fill="#23263A"/>`;});
  if(T.id==='escalation')g+=`<text x="${x0+6}" y="${yT+2}" font-size="9.5" fill="#6B7088">${tt('esc')}</text>`;
  if(T.id==='success'){const P=lines[0],Q=lines[1];g+=`<text x="${X(1)-4}" y="${Y(P[P.length-1][1])-7}" font-size="9.5" text-anchor="end" fill="#6B7088">${tt('win')}</text><text x="${X(1)-4}" y="${Y(Q[Q.length-1][1])-7}" font-size="9.5" text-anchor="end" fill="#6B7088">${tt('lose')}</text>`;}
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true">${g}</svg>`;
}

const BASE_W=400;           // カードのもとの幅

function layout(){
  const g=document.getElementById('grid');if(!g)return;
  const W=g.clientWidth,auto=Math.max(1,Math.min(6,Math.floor((W+22)/350)));
  const maxC=Math.max(1,Math.min(8,Math.floor((W+10)/170)));

  const gap=c>=5?14:c===4?18:22,z=Math.min(2,((W-gap*(c-1))/c)/BASE_W);
  g.style.setProperty('--cols',c);g.style.setProperty('--gap',gap+'px');g.style.setProperty('--z',z.toFixed(4));
  ZOOM=z;CUR=c;

let justDragged=false,drag=null;
const grid=document.getElementById('grid');
grid.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.card');if(!el||e.button!==0)return;
  if(e.target.closest('a,button'))return;
  if(e.pointerType!=='mouse'&&!e.target.closest('.grip'))return;

});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const {el}=drag;
  if(!drag.on){
    if(Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<8)return;
    const r=el.getBoundingClientRect();
    drag.on=true;drag.z=ZOOM;drag.dx=e.clientX-r.left;drag.dy=e.clientY-r.top;
    drag.ph=document.createElement('div');drag.ph.className='ph';drag.ph.style.height=r.height+'px';
    el.parentNode.insertBefore(drag.ph,el);
    const z=drag.z;Object.assign(el.style,{width:r.width/z+'px',height:r.height/z+'px',left:r.left/z+'px',top:r.top/z+'px'});
    el.classList.add('dragging');document.body.classList.add('is-dragging');
  }
  e.preventDefault();
  el.style.left=(e.clientX-drag.dx)/drag.z+'px';el.style.top=(e.clientY-drag.dy)/drag.z+'px';
  if(e.clientY<70)window.scrollBy(0,-14);else if(e.clientY>innerHeight-70)window.scrollBy(0,14);
  const t=document.elementsFromPoint(e.clientX,e.clientY).find(n=>n.classList&&n.classList.contains('card')&&n!==el);
  if(t){const r=t.getBoundingClientRect(),after=e.clientX>r.left+r.width/2;
    t.parentNode.insertBefore(drag.ph,after?t.nextSibling:t);}
},{passive:false});
const endDrag=e=>{
  if(!drag||(e&&e.pointerId!==drag.id))return;
  const d=drag;drag=null;if(!d.on)return;
  d.ph.replaceWith(d.el);d.el.classList.remove('dragging');document.body.classList.remove('is-dragging');
  ['width','height','left','top'].forEach(k=>d.el.style[k]='');
  {const shown=[...grid.querySelectorAll('.card')].map(c=>+c.dataset.ix),rest=ORDER.filter(i=>!shown.includes(i));ORDER.splice(0,ORDER.length,...shown,...rest);}
  justDragged=true;setTimeout(()=>justDragged=false,60);
};

  fr.querySelectorAll('.chart circle').forEach((c,i)=>{c.style.transformBox='fill-box';c.style.transformOrigin='center';
    c.animate([{transform:'scale(0)'},{transform:'scale(1.6)',offset:.7},{transform:'scale(1)'}],{duration:400,delay:450+i*20,easing:'ease-out',fill:'backwards'});});
  fr.querySelectorAll('rect.bar').forEach((r,i)=>{r.style.transformBox='fill-box';r.style.transformOrigin='bottom';
    r.animate([{transform:'scaleY(0)'},{transform:'scaleY(1)'}],{duration:600,delay:i*90,easing:'cubic-bezier(.3,1.4,.5,1)',fill:'backwards'});});
  fr.querySelectorAll('path.fr').forEach((p,i)=>{p.animate([{transform:'translateX(0)'},{transform:'translateX(-3px)'},{transform:'translateX(2px)'},{transform:'translateX(0)'}],{duration:700,delay:i*40,easing:'ease-in-out'});});
}

function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');const sep=(t.split('\n')[0].match(/\t/g)||[]).length>(t.split('\n')[0].match(/,/g)||[]).length?'\t':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true;else if(ch===sep){row.push(f);f='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=ch;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
// 表を「系列 → [年,値]」に直す。OWIDの形（Entity, Code, Year, 値…）と、横長の形（年, 系列1, 系列2…）に対応
function toSeries(rows){
  if(rows.length<3)return null;
  const H=rows[0].map(x=>x.trim()),lo=H.map(x=>x.toLowerCase());
  const ei=lo.indexOf('entity'),yi=lo.findIndex(x=>x==='year'||x==='年'||x==='年度'||x==='date');
  const num=v=>{const n=parseFloat(String(v).replace(/[, ]/g,''));return isFinite(n)?n:null;};
  if(ei>=0&&yi>=0){
    const vcols=H.map((h,i)=>i).filter(i=>i!==ei&&i!==yi&&lo[i]!=='code'&&rows.slice(1).some(r=>num(r[i])!=null));
    if(!vcols.length)return null;
    const byCol={};vcols.forEach(ci=>{const m={};rows.slice(1).forEach(r=>{const y=num(r[yi]),v=num(r[ci]);if(y==null||v==null)return;(m[r[ei]]=m[r[ei]]||[]).push([y,v]);});byCol[H[ci]]=m;});
    return {kind:'owid',cols:vcols.map(i=>H[i]),byCol};
  }
  const y0=yi>=0?yi:0;
  const vcols=H.map((h,i)=>i).filter(i=>i!==y0&&rows.slice(1).some(r=>num(r[i])!=null));
  if(!vcols.length||!rows.slice(1).some(r=>num(String(r[y0]).slice(0,4))!=null))return null;
  const m={};vcols.forEach(ci=>{m[H[ci]||('series '+ci)]=rows.slice(1).map(r=>[num(String(r[y0]).slice(0,4)),num(r[ci])]).filter(p=>p[0]!=null&&p[1]!=null);});
  return {kind:'wide',cols:['value'],byCol:{value:m}};
}
// --- 形から候補を出す（AIなしでも動く） ---
function shapeCandidates(series,betterLow){
  const norm=h=>{const v=h.map(p=>p[1]*(betterLow?-1:1)),a=Math.min(...v),b=Math.max(...v),r=(b-a)||1;return v.map(x=>(x-a)/r);};
  const y=norm(series[0].h),n=y.length,first=y[0],last=y[n-1],mid=y[Math.floor(n/2)];
  const inner=y.slice(1,-1),mx=Math.max(...inner),mn=Math.min(...inner),imx=y.indexOf(mx);
  let sgn=0,flips=0;for(let i=1;i<n;i++){const d=Math.sign(y[i]-y[i-1]);if(d&&sgn&&d!==sgn)flips++;if(d)sgn=d;}
  const osc=flips/Math.max(1,n-2),trend=last-first,early=Math.abs(mid-first),late=Math.abs(last-mid);
  const tail=y.slice(Math.floor(n*.8)),tailDrop=Math.max(...y.slice(0,Math.floor(n*.8)))-Math.min(...tail);
  const S={};
  S.drift=Math.max(0,-trend)*(1-osc)*(mx<=Math.max(first,.6)?1:.5);
  S.limits=trend>0?Math.max(0,trend)*(early/(early+late+1e-6))*(1-osc):0;
  S.under=Math.max(0,mx-Math.max(first,last))*(last>first?1.1:.7)*(imx>n*.25&&imx<n*.9?1:.4);
  S.fixes=Math.max(0,mx-Math.max(first,last))*(last<first?1.2:.4);
  S.burden=osc*(trend<=0.05?1:.5)*.9;
  S.commons=(imx>n*.5?1:.3)*Math.max(0,tailDrop-.35)*(trend<.2?1:.5)*1.3;
  if(series[1]){const z=norm(series[1].h),m=Math.min(y.length,z.length);
    const g0=Math.abs(y[0]-z[0]),g1=Math.abs(y[m-1]-z[m-1]);
    const raw=(i,s)=>s.h[i]?s.h[i][1]:null;const gr0=Math.abs(raw(0,series[0])-raw(0,series[1])),gr1=Math.abs(raw(series[0].h.length-1,series[0])-raw(series[1].h.length-1,series[1]));
    S.success=Math.max(0,(gr1-gr0)/(Math.max(gr0,gr1)||1))*1.2;
    let cross=0;for(let i=1;i<m;i++)if(Math.sign(y[i]-z[i])!==Math.sign(y[i-1]-z[i-1]))cross++;
    S.escalation=(cross>=2?.45:0)+(cross>=2&&Math.sign(y[m-1]-y[0])===Math.sign(z[m-1]-z[0])?.1:0);
  }
  const list=Object.entries(S).filter(([k,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k])=>k);
  (trend>=0?['limits','under','fixes','burden']:['drift','fixes','burden','commons']).forEach(k=>{if(list.length<2&&!list.includes(k))list.push(k);});
  return list.slice(0,3);
}

async function aiCandidates(series,meta){

  const data=series.map(s=>({name:s.name,points:s.h.filter((p,i,a)=>a.length<=40||i%Math.ceil(a.length/40)===0||i===a.length-1)}));
  const prompt=`You help researchers read time-series data with system archetypes (system dynamics).
Data (JSON): ${JSON.stringify({variable:meta.vname,unit:meta.unit,betterWhen:meta.betterLow?'lower':'higher',source:meta.src,series:data})}
Archetypes and the role keys you must use for each: ${JSON.stringify(roles)}
Archetype ids: fixes (Fixes that fail), burden (Shifting the burden), drift (Drifting goals), limits (Limits to success), under (Growth and underinvestment), escalation, commons (Tragedy of the commons), success (Success to the successful).
Task: propose 2 or 3 different archetypes whose typical behavior-over-time matches this data, as hypotheses for discussion.

- Variable names must be neutral quantities (amount, number, share, level, strength). Never put direction or change words (increase, decrease, more, less, rise, fall, shortage, 増える, 減る, ふやす, 減らす, 不足, 値上がり) in variable names; direction is shown by arrows.
- Each variable name at most 14 characters; you may use "\\n" once to break it into two lines.
- The plotted variable is this role for each type: ${JSON.stringify(DR)}; name it after the data.
- "why" explains which feature of the data shape fits the archetype (one sentence). Do not claim causation; this is a hypothesis.
- "story" is 4 short steps around the loop. "lev" gives one short hint each for top-down (policy, regulation), bottom-up (word of mouth, awareness of people around), affordability (financial room, money sense).
Return only JSON: {"candidates":[{"type":"...","why":"...","prob":"...","names":{"<role key>":"..."},"story":["","","",""],"lev":{"t":"","b":"","a":""}}]}`;
  try{
    const r=await SAMPLE.json(prompt,{modelTier:'default'});
    const c=(r&&r.candidates||[]).filter(x=>ARCH[x.type]&&x.names).slice(0,3).map(x=>{
      const g=genericCand(x.type,meta.vname,series[1]?series[1].name:'B');
      const names={};Object.keys(ARCH[x.type].roles).forEach(k=>names[k]=String(x.names[k]||g.names[k]).slice(0,40));

    return c.length?c:null;
  }catch(e){return null;}
}

    <div class="mkrow"><button class="btn" type="button" id="mkRead">${mk('read')}</button></div>
    <label class="mkl">${mk('owid')}<span class="mkrow"><input id="mkUrl" type="url" placeholder="https://ourworldindata.org/grapher/..."><button class="btn" type="button" id="mkUrlGo">${mk('owidGo')}</button></span></label>
    <p class="mkmsg" id="mkMsg1" role="status"></p>
    <div id="mkPick"></div>
  </section>
  <section class="mks" id="mkS2" hidden><h3>${mk('s2')}</h3>
    <div class="mkrow"><button class="btn mkpri" type="button" id="mkAi">${mk('aiGo')}</button></div>
    <p class="mkmsg" id="mkMsg2" role="status"></p>
  </section>
  <section class="mks" id="mkS3" hidden><h3>${mk('s3')}</h3><p class="mknote">${mk('one')}</p>
    <label class="mkl">${mk('ttl')}<input id="mkTtl"></label>
    <div id="mkCands"></div>
    <div class="mkrow"><button class="btn mkpri" type="button" id="mkMake">${mk('make')}</button></div><p class="mkmsg" id="mkMsg3" role="status"></p>
  </section>`;
  const $=id=>document.getElementById(id);
  const readText=t=>{const p=toSeries(parseCSV(t));if(!p){$('mkMsg1').textContent=mk('noData');return;}MKS.parsed=p;$('mkMsg1').textContent='';showPick();};
  $('mkFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>readText(String(r.result));r.readAsText(f);});
  $('mkRead').addEventListener('click',()=>readText($('mkPaste').value));
  $('mkUrlGo').addEventListener('click',async()=>{
    let url=$('mkUrl').value.trim();if(!url)return;
    try{const U=new URL(url);if(!/ourworldindata\.org$/.test(U.hostname))throw 0;
      if(U.pathname.startsWith('/grapher/')){U.pathname=U.pathname.replace(/\/$/,'')+'.csv';U.searchParams.set('csvType','filtered');U.searchParams.set('useColumnShortNames','false');}
      else throw 0;
      const r=await fetch(U.toString());if(!r.ok)throw 0;readText(await r.text());
    }catch(e){$('mkMsg1').textContent=mk('owidNg');}
  });
  $('mkAi').addEventListener('click',()=>makeCands(true));
  $('mkMake').addEventListener('click',makeCard);
  d.showModal();
}
function showPick(){
  const P=MKS.parsed,$=id=>document.getElementById(id);
  const col=P.cols[0],ents=Object.keys(P.byCol[col]);
  $('mkPick').innerHTML=`${P.cols.length>1?`<label class="mkl">${mk('col')}<select id="mkCol">${P.cols.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label>`:''}
   <fieldset class="mkents"><legend>${mk('pick')}</legend><div id="mkEnts"></div></fieldset>
   <div class="mkgrid"><label class="mkl">${mk('vname')}<input id="mkV" value="${esc(P.kind==='owid'?col:'')}"></label><label class="mkl">${mk('unit')}<input id="mkU"></label>
   <label class="mkl">${mk('src')}<input id="mkSrc" value="${P.kind==='owid'?'Our World in Data':''}"></label><label class="mkl">${mk('srcU')}<input id="mkSrcU" type="url" value="${esc(document.getElementById('mkUrl').value.trim())}"></label></div>
   <div class="mkrow"><span>${mk('dir')}</span><label><input type="radio" name="mkDir" value="g" checked> ${mk('good')}</label><label><input type="radio" name="mkDir" value="b"> ${mk('bad')}</label></div>
   <div id="mkPrev"></div>`;
  const drawEnts=()=>{const c=$('mkCol')?$('mkCol').value:col,E=Object.keys(P.byCol[c]);
    $('mkEnts').innerHTML=E.slice(0,300).map((e,i)=>`<label class="mkchip"><input type="checkbox" value="${esc(e)}" ${i===0||/world/i.test(e)&&i<5?'checked':''}> ${esc(e)}</label>`).join('');
    const boxes=[...$('mkEnts').querySelectorAll('input')];let chk=boxes.filter(b=>b.checked);if(chk.length>2)chk.slice(2).forEach(b=>b.checked=false);
    boxes.forEach(b=>b.addEventListener('change',()=>{const on=boxes.filter(x=>x.checked);if(on.length>2)b.checked=false;prev();}));prev();};
  const prev=()=>{const s=curSeries();$('mkS2').hidden=!s.length;if(!s.length){$('mkPrev').innerHTML='';return;}
    const tmp={c:'#1F2A44',ttl:'',series:s.map((x,i)=>({k:'__p'+i})),shared:s.length>1?1:0};s.forEach((x,i)=>D['__p'+i]={hi:LANG==='en'?'More':'多い',lo:LANG==='en'?'Less':'少ない',name:x.name,u:'',what:'',src:'',h:x.h});
    $('mkPrev').innerHTML=dataSVG(tmp).svg;};
  if($('mkCol'))$('mkCol').addEventListener('change',drawEnts);
  drawEnts();
}
function curSeries(){const P=MKS.parsed,$=id=>document.getElementById(id);if(!P)return [];const c=$('mkCol')?$('mkCol').value:P.cols[0];
  return [...$('mkEnts').querySelectorAll('input:checked')].map(b=>({name:b.value,h:(P.byCol[c][b.value]||[]).slice().sort((a,b)=>a[0]-b[0])})).filter(s=>s.h.length>=4);}
function meta(){const $=id=>document.getElementById(id);const s=curSeries();
  return {vname:$('mkV').value.trim()||(s[0]&&s[0].name)||'X',unit:$('mkU').value.trim(),src:$('mkSrc').value.trim(),srcU:$('mkSrcU').value.trim(),betterLow:document.querySelector('input[name=mkDir]:checked').value==='b',series:s};}
async function makeCands(useAI){
  const $=id=>document.getElementById(id),m=meta();if(!m.series.length)return;
  $('mkMsg2').textContent=useAI?mk('aiWait'):'';$('mkAi').disabled=true;
  let c=useAI?await aiCandidates(m.series,m):null;
  if(!c){if(useAI)$('mkMsg2').textContent=mk('aiNg');else $('mkMsg2').textContent='';
    const Y=m.series[1]?m.series[1].name:'B';c=shapeCandidates(m.series,m.betterLow).map(id=>genericCand(id,m.vname,Y));}
  else $('mkMsg2').textContent='';
  $('mkAi').disabled=false;
  MKS.cands=c;$('mkS3').hidden=false;
  if(!$('mkTtl').value)$('mkTtl').value=m.vname+(LANG==='en'?': which pattern?':'：どの型？');
  $('mkCands').innerHTML=c.map((x,i)=>{const T=TYPES.find(t=>t.id===x.type);return `<div class="mkcand" style="--c:${T.c}" data-i="${i}">
    <label class="mkhd"><input type="checkbox" class="mkSel" ${i===0?'checked':''}> <b>${esc(T[LANG][0])}</b><span>${mk('sel')}</span></label>
    <div class="mkwhy"><b>${mk('why')}</b>${esc(x.why)}</div>
    <div class="mkprev">${typSVG(x.type,T.c,m.betterLow)}<div class="mkcld"></div></div>
    <label class="mkl">${mk('probL')}<input class="mkProb" value="${esc(x.prob)}"></label>
    <fieldset class="mkvars"><legend>${mk('vars')}</legend>${Object.keys(ARCH[x.type].roles).map(k=>`<label class="mkl sm">${esc(/\{X\}|\{Y\}/.test(GEN[LANG][x.type][k])?mk('plotted'):GEN[LANG][x.type][k].replace(/\n/g,''))}<input data-k="${k}" value="${esc(x.names[k]).replace(/\n/g,'\\n')}"></label>`).join('')}</fieldset>
    <label class="mkl">${mk('story')}<textarea class="mkStory" rows="4">${esc(x.story.join('\n'))}</textarea></label>
    <fieldset class="mkvars"><legend>${mk('lev')}</legend>${[['t',u('levT')[0]],['b',u('levB')[0]],['a',u('levA')[0]]].map(([k,nm])=>`<label class="mkl sm">${nm}<input data-l="${k}" value="${esc(x.lev[k])}"></label>`).join('')}</fieldset>
  </div>`;}).join('');
  const redraw=box=>{const i=+box.dataset.i,x=readCand(box,i);box.querySelector('.mkcld').innerHTML=cldSVG({id:x.type,nm:'',names:x.names,pr:[DR[x.type]],data:[DR[x.type]]});};
  document.querySelectorAll('.mkcand').forEach(b=>{redraw(b);b.querySelectorAll('.mkvars input[data-k]').forEach(inp=>inp.addEventListener('input',()=>redraw(b)));});
}
function readCand(box,i){const x=MKS.cands[i];const names={};box.querySelectorAll('input[data-k]').forEach(inp=>names[inp.dataset.k]=inp.value.replace(/\\n/g,'\n').trim()||x.names[inp.dataset.k]);
  const lev={};box.querySelectorAll('input[data-l]').forEach(inp=>lev[inp.dataset.l]=inp.value.trim());
  return {type:x.type,why:x.why,prob:box.querySelector('.mkProb').value.trim()||x.prob,names,story:box.querySelector('.mkStory').value.split('\n').map(s=>s.trim()).filter(Boolean).slice(0,5),lev};}
function makeCard(){
  const $=id=>document.getElementById(id),m=meta();
  const sel=[...document.querySelectorAll('.mkcand')].filter(b=>b.querySelector('.mkSel').checked).map(b=>readCand(b,+b.dataset.i));
  if(!sel.length){$('mkMsg3').textContent=mk('need');return;}
  const rec={ed:EDITION==='urban'?'urban':'food',uid:Date.now().toString(36)+Math.random().toString(36).slice(2,6),ttl:$('mkTtl').value.trim()||m.vname,vname:m.vname,unit:m.unit,src:m.src,srcU:m.srcU,betterLow:m.betterLow,
    series:m.series.map(s=>({name:s.name,h:s.h})),cands:sel};
  USER.push(rec);saveUser(USER);
  const ix=registerUser(rec);ORDER.push(ix);ORIG_ORDER.push(ix);
  render();renderTypes();applyFilter();document.getElementById('mkdlg').close();
  const el=document.querySelector(`#grid .card[data-ix="${ix}"]`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
}

// ===== 作ったカードごと、HTMLファイルに保存する =====
let DL=null;(async()=>{try{if(window.claude&&window.claude.use)DL=await window.claude.use('downloads');}catch(e){DL=null;}})();
async function exportHTML(){
  const root=document.documentElement.cloneNode(true);
  root.querySelectorAll('script').forEach(sc=>{if(sc.id!=='app')sc.remove();});
  const app=root.querySelector('script#app');
  app.textContent=app.textContent.replace(/const SEED=[\s\S]*?\/\*SEED\*\//,'const SEED='+JSON.stringify(USER).replace(/</g,'\\u003c')+'/*SEED*/');
  ['grid','tgrid','mkc','dlgc'].forEach(id=>{const e=root.querySelector('#'+id);if(e)e.innerHTML='';});
  root.querySelectorAll('dialog').forEach(d=>d.removeAttribute('open'));
  const dr=root.querySelector('#drawer');if(dr)dr.setAttribute('hidden','');const hp=root.querySelector('#helpPop');if(hp)hp.setAttribute('hidden','');
  root.querySelector('body').removeAttribute('class');root.querySelectorAll('[aria-pressed="true"]').forEach(b=>b.setAttribute('aria-pressed','false'));
  root.setAttribute('lang','ja');
  ['mkBtn','saveBtn'].forEach(id=>{const b=root.querySelector('#'+id);if(b)b.setAttribute('hidden','');});
  const html='<!DOCTYPE html>\n'+root.outerHTML;
  const d=new Date(),fn=`system_behavior_cards_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.html`;
  if(DL){try{await DL.save({filename:fn,data:html});}catch(e){if(e&&e.code!=='declined')alert(mk('saveNg'));}return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=fn;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
document.getElementById('saveBtn').addEventListener('click',exportHTML);
document.getElementById('mkBtn').addEventListener('click',openMaker);
document.getElementById('mkx').addEventListener('click',()=>document.getElementById('mkdlg').close());

applyLang();
document.getElementById('lang').addEventListener('click',()=>{LANG=LANG==='en'?'ja':'en';applyLang();});
document.getElementById('dlgx').addEventListener('click',()=>document.getElementById('dlg').close());
document.getElementById('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close();});
document.getElementById('guess').addEventListener('click',e=>{const on=document.body.classList.toggle('guess');e.currentTarget.setAttribute('aria-pressed',on);renderTypes();applyFilter();});
document.getElementById('reset').addEventListener('click',()=>{Object.keys(PICK).forEach(k=>delete PICK[k]);ORDER.splice(0,ORDER.length,...ORIG_ORDER);FILTER=null;render();renderTypes();applyFilter();});
</script>
