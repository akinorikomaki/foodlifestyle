<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>価格感度：生鮮野菜 消費者物価指数（CPI）と可処分所得</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #4a4a4a;
            color: white;
            padding: 20px;
            margin: -30px -30px 30px -30px;
            border-radius: 8px 8px 0 0;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 1px;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 16px;
            margin: 20px 0;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .save-load-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            padding: 10px 20px;
            border: 2px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #f0f0f0;
        }
        .save-btn {
            padding: 10px 20px;
            border: 2px solid #70AD47;
            background: white;
            color: #70AD47;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .save-btn:hover {
            background: #70AD47;
            color: white;
        }
        .load-btn {
            padding: 10px 20px;
            border: 2px solid #5B9BD5;
            background: white;
            color: #5B9BD5;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .load-btn:hover {
            background: #5B9BD5;
            color: white;
        }
        .reset-btn {
            padding: 10px 20px;
            border: 2px solid #ED7D31;
            background: white;
            color: #ED7D31;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .reset-btn:hover {
            background: #ED7D31;
            color: white;
        }
        .file-input {
            display: none;
        }
        .instructions {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        #chart {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .line-historical {
            fill: none;
            stroke: #999999;
            stroke-width: 3;
        }
        .line-forecast {
            fill: none;
            stroke: #999999;
            stroke-width: 3;
            stroke-dasharray: 8, 4;
        }
        .dot-historical {
            fill: #999999;
            stroke: white;
            stroke-width: 2;
        }
        .draggable-point {
            fill: #999999;
            stroke: white;
            stroke-width: 3;
            cursor: move;
        }
        .draggable-point:hover {
            r: 8;
            stroke-width: 4;
        }
        .data-label {
            font-size: 13px;
            font-weight: normal;
            fill: #666;
            text-anchor: middle;
        }
        .axis {
            font-size: 12px;
        }
        .grid line {
            stroke: #e0e0e0;
            stroke-opacity: 0.7;
            shape-rendering: crispEdges;
        }
        .grid path {
            stroke-width: 0;
        }
        .tooltip {
            position: absolute;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            font-size: 13px;
        }
        .message {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-size: 14px;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .legend-note {
            text-align: center;
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>価格感度：生鮮野菜 消費者物価指数（CPI）と可処分所得</h1>
        </div>
        
        <div class="subtitle">
            Price Sensitivity指数（2019=100）
        </div>
        
        <div class="instructions">
            2025年以降の予測ポイントをドラッグして将来の推移を描いてください
        </div>
        
        <div class="controls">
            <div class="save-load-controls">
                <button class="save-btn" id="save-btn">📥 データを保存</button>
                <button class="load-btn" id="load-btn">📤 データを読み込み</button>
                <input type="file" id="file-input" class="file-input" accept=".json,.txt">
                <button class="reset-btn" id="reset-btn">リセット</button>
            </div>
        </div>

        <div id="message-container"></div>
        
        <div id="chart"></div>
        <div class="tooltip"></div>
        
        <div class="legend-note">
            —— Price Sensitivity指数（2019=100）
        </div>
    </div>

    <script>
        // 履歴データ（2019〜2024）
        const historicalData = [
            {year: 2019, value: 100},
            {year: 2020, value: 100.4},
            {year: 2021, value: 119.6},
            {year: 2022, value: 114.6},
            {year: 2023, value: 99.6},
            {year: 2024, value: 88.1}
        ];

        // 予測データの初期値を生成（2025年以降）
        function generateInitialForecast() {
            const lastValue = historicalData[historicalData.length - 1].value;
            const years = [];
            for (let i = 2025; i <= 2040; i++) {
                years.push({
                    year: i,
                    value: Math.max(0, lastValue + (i - 2024) * (-1.5)) // 緩やかな減少傾向
                });
            }
            return years;
        }

        let forecastData = generateInitialForecast();

        // グラフの設定
        const margin = {top: 20, right: 50, bottom: 60, left: 70};
        const width = 1200 - margin.left - margin.right;
        const height = 500 - margin.top - margin.bottom;

        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // スケールの設定
        const xScale = d3.scaleLinear()
            .domain([2019, 2040])
            .range([0, width]);

        const yScale = d3.scaleLinear()
            .domain([0, 140])
            .range([height, 0]);

        // グリッド線
        svg.append("g")
            .attr("class", "grid")
            .attr("transform", `translate(0,${height})`)
            .call(d3.axisBottom(xScale)
                .tickSize(-height)
                .tickFormat("")
                .ticks(21));

        svg.append("g")
            .attr("class", "grid")
            .call(d3.axisLeft(yScale)
                .tickSize(-width)
                .tickFormat("")
                .ticks(7));

        // X軸
        svg.append("g")
            .attr("class", "axis")
            .attr("transform", `translate(0,${height})`)
            .call(d3.axisBottom(xScale)
                .tickFormat(d3.format("d"))
                .ticks(21));

        // Y軸
        svg.append("g")
            .attr("class", "axis")
            .call(d3.axisLeft(yScale).ticks(7));

        // 線のジェネレーター
        const line = d3.line()
            .x(d => xScale(d.year))
            .y(d => yScale(d.value));

        // 履歴データの描画
        const historicalGroup = svg.append("g").attr("class", "historical-group");

        historicalGroup.append("path")
            .datum(historicalData)
            .attr("class", "line-historical")
            .attr("d", line);

        historicalGroup.selectAll(".dot-historical")
            .data(historicalData)
            .enter()
            .append("circle")
            .attr("class", "dot-historical")
            .attr("cx", d => xScale(d.year))
            .attr("cy", d => yScale(d.value))
            .attr("r", 5);

        // データラベル（履歴データ）
        historicalGroup.selectAll(".data-label")
            .data(historicalData)
            .enter()
            .append("text")
            .attr("class", "data-label")
            .attr("x", d => xScale(d.year))
            .attr("y", d => yScale(d.value) - 12)
            .text(d => d.value);

        // 予測線の描画グループ
        const forecastGroup = svg.append("g").attr("class", "forecast-group");

        // 予測線を更新する関数
        function updateForecastLines() {
            forecastGroup.selectAll("*").remove();

            // 履歴データの最後のポイントと予測データを結合
            const lastHistorical = historicalData[historicalData.length - 1];
            const combinedData = [lastHistorical, ...forecastData];

            // 予測線
            forecastGroup.append("path")
                .datum(combinedData)
                .attr("class", "line-forecast")
                .attr("d", line);

            // ドラッグ機能
            let startY = 0;
            let hasMoved = false;
            const drag = d3.drag()
                .on("start", function(event, d) {
                    const coords = d3.pointer(event, svg.node());
                    startY = coords[1];
                    hasMoved = false;
                    // ドラッグ中のスクロールを防止
                    d3.select("body").style("overflow", "hidden");
                })
                .on("drag", function(event, d) {
                    // SVG要素に対する正確な座標を取得
                    const coords = d3.pointer(event, svg.node());
                    const mouseY = coords[1];
                    
                    // 5ピクセル以上動いた場合のみドラッグとみなす
                    if (Math.abs(mouseY - startY) > 5) {
                        hasMoved = true;
                    }
                    
                    if (hasMoved) {
                        // Y座標を0からheightの範囲内に制限
                        const newY = Math.max(0, Math.min(height, mouseY));
                        const newValue = yScale.invert(newY);
                        d.value = Math.max(0, Math.min(140, newValue));
                        
                        d3.select(this)
                            .attr("cy", yScale(d.value));
                        
                        // ラベルも更新
                        d3.select(this.nextSibling)
                            .attr("y", yScale(d.value) - 12)
                            .text(d.value.toFixed(1));
                        
                        updateForecastLines();
                    }
                })
                .on("end", function(event, d) {
                    startY = 0;
                    hasMoved = false;
                    // スクロールを再度有効化
                    d3.select("body").style("overflow", "auto");
                });

            // ドラッグ可能なポイント
            forecastData.forEach((d, i) => {
                const pointGroup = forecastGroup.append("g");
                
                pointGroup.append("circle")
                    .datum(d)
                    .attr("class", "draggable-point")
                    .attr("cx", xScale(d.year))
                    .attr("cy", yScale(d.value))
                    .attr("r", 6)
                    .call(drag)
                    .on("mouseover", function(event, d) {
                        d3.select(".tooltip")
                            .style("opacity", 1)
                            .html(`${d.year}年<br>指数: ${d.value.toFixed(1)}<br>(ドラッグして調整)`)
                            .style("left", (event.pageX + 10) + "px")
                            .style("top", (event.pageY - 28) + "px");
                    })
                    .on("mouseout", function() {
                        d3.select(".tooltip").style("opacity", 0);
                    });

                // データラベル（予測データ）
                pointGroup.append("text")
                    .attr("class", "data-label")
                    .attr("x", xScale(d.year))
                    .attr("y", yScale(d.value) - 12)
                    .text(d.value.toFixed(1));
            });
        }

        updateForecastLines();

        // メッセージ表示関数
        function showMessage(text, type = 'success') {
            const messageContainer = document.getElementById('message-container');
            messageContainer.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => {
                messageContainer.innerHTML = '';
            }, 3000);
        }

        // データ保存機能
        function saveData() {
            const dataToSave = {
                version: "1.0",
                timestamp: new Date().toISOString(),
                type: "price_sensitivity_cpi",
                forecastData: forecastData
            };

            const dataStr = JSON.stringify(dataToSave, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `price_sensitivity_forecast_${new Date().getTime()}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showMessage('データを保存しました！', 'success');
        }

        // データ読み込み機能
        function loadData(fileContent) {
            try {
                const loadedData = JSON.parse(fileContent);
                
                if (!loadedData.forecastData) {
                    throw new Error('無効なデータ形式です');
                }

                forecastData = loadedData.forecastData;
                updateForecastLines();

                showMessage('データを読み込みました！', 'success');
            } catch (error) {
                showMessage('データの読み込みに失敗しました: ' + error.message, 'error');
            }
        }

        // ボタンのイベントハンドラ
        d3.select("#reset-btn").on("click", function() {
            forecastData = generateInitialForecast();
            updateForecastLines();
            showMessage('データをリセットしました', 'success');
        });

        d3.select("#save-btn").on("click", saveData);

        d3.select("#load-btn").on("click", function() {
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    loadData(e.target.result);
                };
                reader.readAsText(file);
                event.target.value = '';
            }
        });
    </script>
</body>
</html>
