n}\nfunction closeTpl(){ $('tpl').style.display='none'; tplV=null; d3.select('#pvg').selectAll('*').remove(); }\n$('tplX').onclick=$('tplCancel').onclick=closeTpl;\n$('tplOk').onclick=()=>{ if(!tplV||!tplShape) return; const v=tplV, L=S.lanes[v.id], {pr,b}=tplRead();\n  L.bounds=b; const vals=shapeValues(v,tplShape,pr);\n  vals.forEach(d=>L.points[d.year]=d.value); L.template={shape:tplShape, params:pr, at:new Date().toISOString()};\n  log('template',{v:v.id,shape:tplShape,params:pr,bounds:b}); save(); closeTpl(); draw(); toast('下書きしました。点をドラッグして直せます'); };\ndocument.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('tpl').style.display==='block') closeTpl(); });\n\nfunction rank(id){const r=S.rank.indexOf(id); if(r>=0)S.rank.splice(r,1); else S.rank.push(id); log('rank',{rank:[...S.rank]}); save(); draw()}\n\n/* ---------- コメント入力 ---------- */\nlet popCtx=null;\nfunction openPop(v,year,px,py,future){\n  popCtx={v,year}; selKey=v.id+':'+year;\n  const pop=$('pop'), card=pop.parentNode;\n  $('popT').textContent=`${v.pathway}・${year}年`;\n  $('popIn').value=S.lanes[v.id].notes[year]||'';\n  $('popIn').placeholder=future?'なぜこうなる？':'このとき何があった？';\n  $('popDel').style.display=future?'':'none';\n  pop.style.display='block';\n  const cw=card.clientWidth, ch=card.clientHeight;\n  pop.style.left=Math.max(8,Math.min(cw-258,px-125))+'px';\n  pop.style.top=(py+14+110>ch? py-110 : py+14)+'px';\n  setTimeout(()=>$('popIn').focus(),0);\n}\nfunction closePop(){ $('pop').style.display='none'; popCtx=null; }\nfunction commit(){ if(!popCtx)return; const {v,year}=popCtx, t=$('popIn').value.trim();\n  if(t) S.lanes[v.id].notes[year]=t; else delete S.lanes[v.id].notes[year];\n  log('note',{v:v.id,year}); save(); closePop(); draw(); }\n$('popOk').onclick=commit; $('popX').onclick=()=>{closePop();draw()};\n$('popIn').onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();commit()} if(e.key==='Escape'){closePop();draw()} };\n$('popDel').onclick=()=>{ const {v,year}=popCtx; delete S.lanes[v.id].points[year]; delete S.lanes[v.id].notes[year]; log('remove',{v:v.id,year}); save(); closePop(); draw(); };\n\n/* ---------- 保存 ---------- */\nfunction download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},0)}\nconst stem=()=>`${CONFIG.studyId}_${(S.participant.id||'anon').replace(/[^\\w-]/g,'_')}_${new Date().toISOString().slice(0,10)}`;\n$('sj').onclick=()=>{ if(!S.participant.id){toast('番号を入力してください');$('pid').focus();return}\n  log('export',{format:'json'}); download(stem()+'.json',JSON.stringify({...S,position:pos(),futureYears:fYears(),exportedAt:new Date().toISOString(),config:CONFIG},null,2),'application/json'); toast('保存しました'); };\n$('sc').onclick=()=>{ const q=v=>{const s=String(v??'');return /[\",\\n]/.test(s)?`\"${s.replace(/\"/g,'\"\"')}\"`:s};\n  const head=['study','participant_id','group','own_value','position','variable','role','pathway','record','year','value','rank','comment'];\n  const b=[CONFIG.studyId,S.participant.id,S.participant.group,S.participant.value,pos()];const rows=[];\n  VARS.forEach(v=>{const L=S.lanes[v.id],rk=S.rank.indexOf(v.id)+1||'',base=[...b,v.id,v.role,v.pathway];\n    hist(v).forEach(p=>rows.push([...base,'history',p.year,p.value,rk,L.notes[p.year]||'']));\n    fYears().forEach(yr=>rows.push([...base,'forecast',yr,L.points[yr]??'',rk,L.notes[yr]||'']));\n    if(L.template) rows.push([...base,'shape','','',rk,L.template.shape+' '+JSON.stringify(L.template.params)]);\n    if(L.bounds&&L.bounds.max!=null) rows.push([...base,'bound_max','',L.bounds.max,rk,'']);\n    if(L.bounds&&L.bounds.min!=null) rows.push([...base,'bound_min','',L.bounds.min,rk,'']);});\n  log('export',{format:'csv'}); download(stem()+'.csv','\\uFEFF'+[head,...rows].map(r=>r.map(q).join(',')).join('\\n'),'text/csv'); toast('CSVを保存しました'); };\n$('ld').onclick=()=>$('fileIn').click();\n$('fileIn').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();\n  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(o.schema!==SCHEMA||o.studyId!==CONFIG.studyId)throw new Error('形式が違います');\n    ['config','exportedAt','position','futureYears'].forEach(k=>delete o[k]);VARS.forEach(v=>{if(!o.lanes[v.id])o.lanes[v.id]={points:{},notes:{}}});S=o;log('import');draw();toast('読み込みました')}catch(err){toast('読み込めません：'+err.message)}e.target.value=''};rd.readAsText(f)};\n$('rs').onclick=()=>{\n  hpOpen(`\u003ch3>やり直す\u003c/h3>\n   \u003cdiv class=\"step\">\u003cb>描いた線を消す\u003c/b>\u003cbr>このシートで描いた線・コメント・型の選択を消して、白紙から描き直します。表示や設定はそのままです。\u003cbr>\u003cbutton class=\"btn\" id=\"rsLines\" style=\"margin-top:6px\">描いた線を消す\u003c/button>\u003c/div>\n   \u003cdiv class=\"step\">\u003cb>すべて最初の状態に戻す\u003c/b>\u003cbr>描いた線に加えて、「かんたん／くわしく」の表示や、研究者が設定画面で変えた内容も、このファイルを最初に開いたときの状態に戻します。\u003cbr>\u003cbutton class=\"btn\" id=\"rsAll\" style=\"margin-top:6px;background:#B3261E;border-color:#B3261E\">すべて最初の状態に戻す\u003c/button>\u003c/div>\n   \u003cp>※保存（JSON）していない線は、元に戻せません。\u003c/p>\n   \u003cdiv class=\"ft\">\u003cbutton class=\"btn g\" id=\"rsX\">やめる\u003c/button>\u003c/div>`);\n  $('rsX').onclick=hpClose;\n  $('rsLines').onclick=()=>{try{localStorage.removeItem(STORE)}catch(e){}S=fresh();save();hpClose();draw();toast('描いた線を消しました');};\n  $('rsAll').onclick=()=>{try{['tet-ui',OVR,STORE].forEach(k=>localStorage.removeItem(k));Object.keys(localStorage).filter(k=>/^tet_sheet_/.test(k)).forEach(k=>localStorage.removeItem(k));}catch(e){}location.reload();};\n};\n\n/* ---------- 設定（タイトル・縦軸・過去データ） ---------- */\nconst OVR='tet_sheet_config';\nconst dataText=v=> v.groups ? Object.entries(v.groups).flatMap(([g,a])=>a.map(([y,val])=>`${y},${val},${g}`)).join('\\n') : (v.history||[]).map(([y,val])=>`${y},${val}`).join('\\n');\nfunction parseData(text){\n  const rows=text.split(/\\r?\\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.split(/[,\\t;]/).map(c=>c.trim().replace(/^\"|\"$/g,'')));\n  const good=rows.filter(r=>r.length>=2 && isFinite(+r[0]) && r[0]!=='' && isFinite(+r[1]) && r[1]!=='');\n  if(!good.length) throw new Error('「年,値」の行が見つかりません');\n  const hasG=good.some(r=>r[2]);\n  const sortA=a=>a.sort((p,q)=>p[0]-q[0]);\n  if(!hasG) return {history:sortA(good.map(r=>[+r[0],+r[1]]))};\n  const groups={}; good.forEach(r=>{const k=r[2]||'全体';(groups[k]=groups[k]||[]).push([+r[0],+r[1]])}); Object.values(groups).forEach(sortA);\n  return {groups};\n}\nfunction autoRange(vals){ const mn=Math.min(...vals), mx=Math.max(...vals), pad=Math.max((mx-mn)*0.6,Math.abs(mx)*0.1,1);\n  const step=Math.pow(10,Math.floor(Math.log10(pad))); return [Math.max(mn>=0?0:-Infinity,Math.floor((mn-pad)/step)*step), Math.ceil((mx+pad)/step)*step]; }\nlet csvTarget=null, focusVar=null;\nconst LOCK=qs.get('lock')==='1';\nif(LOCK){ document.getElementById('st').style.display='none'; document.getElementById('toSum').style.display='none'; }\nfunction openSettings(vid){\n  if(LOCK) return;\n  focusVar=vid||null; $('mErr').textContent='';\n  $('cTitle').value=CONFIG.title; $('cOwnL').value=CONFIG.own.label; $('cOwnV').value=CONFIG.own.value; $('cOwnU').value=CONFIG.own.unit; $('cNow').value=CONFIG.nowYear;\n  $('cArch').innerHTML='\u003coption value=\"\">（使わない）\u003c/option>'+ARCH.map(q=>`\u003coption value=\"${q.id}\">${esc(q.nm)}\u003c/option>`).join('');$('cArch').value=(CONFIG.archetype&&CONFIG.archetype.id)||'';$('cArchLock').checked=!!CONFIG.archetypeLock;\n  $('mVars').innerHTML=CONFIG.variables.map(v=>`\u003cdiv class=\"vbox ${v.role} ${v.id===vid?'hl':''}\" id=\"vb-${v.id}\">\n    \u003ch3>${esc(v.pathway)}（${esc(v.id)}）\u003c/h3>\n    \u003cdiv class=\"mrow\">\n      \u003clabel>経路の名前\u003cinput data-k=\"pathway\" value=\"${esc(v.pathway)}\">\u003c/label>\n      \u003clabel>変数の名前\u003cinput data-k=\"name\" value=\"${esc(v.name)}\">\u003c/label>\n      \u003clabel>出典\u003cinput data-k=\"src\" value=\"${esc(v.src)}\">\u003c/label>\n      \u003clabel>単位\u003cinput data-k=\"unit\" value=\"${esc(v.unit)}\">\u003c/label>\n      \u003clabel>縦軸の下限\u003cinput data-k=\"min\" type=\"number\" value=\"${v.domain[0]}\">\u003c/label>\n      \u003clabel>縦軸の上限\u003cinput data-k=\"max\" type=\"number\" value=\"${v.domain[1]}\">\u003c/label>\n    \u003c/div>\n    \u003clabel>過去のデータ\u003ctextarea data-k=\"data\" spellcheck=\"false\">${esc(dataText(v))}\u003c/textarea>\n      \u003cspan class=\"mini-btns\">\u003cbutton type=\"button\" data-a=\"csv\">CSVを読み込む\u003c/button>\u003cbutton type=\"button\" data-a=\"gt\" class=\"${/bottom/i.test(v.pathway)?'rec':''}\">Googleトレンド\u003c/button>\u003cbutton type=\"button\" data-a=\"pdf\" class=\"${/top/i.test(v.pathway)?'rec':''}\">PDFから語を数える\u003c/button>\u003cbutton type=\"button\" data-a=\"ratio\" class=\"${/afford/i.test(v.pathway)?'rec':''}\">比で作る（所得÷価格）\u003c/button>\u003cbutton type=\"button\" data-a=\"auto\">縦軸をデータに合わせる\u003c/button>\u003c/span>\u003c/label>\n  \u003c/div>`).join('');\n  document.querySelectorAll('.vbox').forEach(box=>{ const id=box.id.slice(3);\n    box.querySelector('[data-a=csv]').onclick=()=>{csvTarget=id;$('csvIn').click()};\n    box.querySelector('[data-a=gt]').onclick=()=>helperTrends(id);\n    box.querySelector('[data-a=pdf]').onclick=()=>helperPdf(id);\n    box.querySelector('[data-a=ratio]').onclick=()=>helperRatio(id);\n    box.querySelector('[data-a=auto]').onclick=()=>{ try{ const d=parseData(box.querySelector('[data-k=data]').value);\n      const vals=(d.history||Object.values(d.groups).flat()).map(r=>r[1]); const [a,b]=autoRange(vals);\n      box.querySelector('[data-k=min]').value=a; box.querySelector('[data-k=max]').value=b; }catch(e){ $('mErr').textContent=e.message } };\n  });\n  $('modal').classList.add('open');\n  if(vid) setTimeout(()=>{ const b=$('vb-'+vid); b&&b.scrollIntoView({block:'center'}); const i=b&&b.querySelector('[data-k=min]'); i&&i.focus(); },30);\n}\n$('csvIn').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();\n  rd.onload=()=>{ const ta=document.querySelector(`#vb-${csvTarget} [data-k=data]`); try{ parseData(rd.result); ta.value=rd.result.trim(); $('mErr').textContent=''; }catch(err){ $('mErr').textContent=err.message } e.target.value=''; };\n  rd.readAsText(f); };\nfunction closeSettings(){ $('modal').classList.remove('open'); }\n\n/* ---------- データ作りの手助け（Googleトレンド／PDF／比） ---------- */\nconst hp=$('hp'),hpc=$('hpc');\nconst hpOpen=html=>{hpc.innerHTML=html;hp.classList.add('open');};\nconst hpClose=()=>hp.classList.remove('open');\nhp.addEventListener('click',e=>{if(e.target===hp)hpClose();});\ndocument.addEventListener('keydown',e=>{if(e.key==='Escape'&&hp.classList.contains('open')){e.stopPropagation();hpClose();}},true);\nconst r1=v=>Math.round(v*10)/10;\n// 年ごとにまとめる（年 / 年-月 / 年-月-日 の行に対応）\nfunction annualize(text){const g={};String(text||'').split(/\\r?\\n/).forEach(l=>{const m=l.replace(/\"/g,'').match(/^\\s*(\\d{4})(?:[-\\/年.](\\d{1,2}))?(?:[-\\/月.]\\d{1,2})?[^,\\t;]*[,\\t;]\\s*([\u003c\\d.\\-]+)/);if(!m)return;\n  const v=m[3].startsWith('\u003c')?0.5:parseFloat(m[3]);if(!isFinite(v))return;(g[m[1]]=g[m[1]]||[]).push(v);});\n  return Object.entries(g).map(([y,a])=>({year:+y,value:a.reduce((s,x)=>s+x,0)/a.length,n:a.length})).sort((a,b)=>a.year-b.year);}\nfunction fillVar(id,rows,unit,src){const box=$('vb-'+id);if(!box)return;\n  box.querySelector('[data-k=data]').value=rows.map(r=>`${r[0]},${r1(r[1])}`).join('\\n');\n  if(unit!=null)box.querySelector('[data-k=unit]').value=unit;if(src!=null)box.querySelector('[data-k=src]').value=src;\n  const vals=rows.map(r=>r[1]);const [a,b]=autoRange(vals);box.querySelector('[data-k=min]').value=a;box.querySelector('[data-k=max]').value=b;\n  hpClose();toast('過去のデータを入れました。確かめて「適用」を押してください');}\nconst rebase=(rows,by,bv)=>{const b=rows.find(r=>r[0]===by);if(!b||!b[1])throw new Error(`基準の年（${by}）のデータがありません`);return rows.map(r=>[r[0],r[1]/b[1]*bv]);};\nconst vName=id=>{const v=CONFIG.variables.find(x=>x.id===id);return v?(v.name||v.pathway):'';};\n\n// 1) Googleトレンド\nfunction helperTrends(id){\n  hpOpen(`\u003ch3>Googleトレンドから作る（ボトムアップ：人々の関心）\u003c/h3>\n  \u003cp>Googleトレンドは外部から自動で数値を取り出す仕組みが公開されていないため、2ステップで入れます。\u003c/p>\n  \u003cdiv class=\"r\">\u003clabel>キーワード\u003cinput id=\"gtK\" value=\"野菜 レシピ\">\u003c/label>\u003clabel>地域\u003cselect id=\"gtG\">\u003coption value=\"JP\" selected>日本\u003c/option>\u003coption value=\"\">全世界\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n  \u003cdiv class=\"step\">① 下のボタンでGoogleトレンドを開き、グラフの右上の「↓（CSV）」を押して \u003cb>multiTimeline.csv\u003c/b> を保存します。\u003cbr>\n  \u003cbutton class=\"btn\" id=\"gtOpen\" style=\"margin-top:6px\">Googleトレンドを開く\u003c/button>\u003c/div>\n  \u003cdiv class=\"step\">② 保存したCSVを選ぶと、月ごとの値を年の平均にして入れます。\u003cbr>\u003cinput type=\"file\" id=\"gtF\" accept=\".csv,.txt\" style=\"margin-top:6px\">\u003c/div>\n  \u003cdiv class=\"r\">\u003clabel>基準の年\u003cinput id=\"gtBY\" type=\"number\" value=\"2019\">\u003c/label>\u003clabel>基準の年の値\u003cinput id=\"gtBV\" type=\"number\" value=\"50\">\u003c/label>\u003clabel>途中の年\u003cselect id=\"gtPart\">\u003coption value=\"0\">使わない\u003c/option>\u003coption value=\"1\">使う\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n  \u003cdiv id=\"gtOut\">\u003c/div>\u003cp class=\"warn\" id=\"gtErr\">\u003c/p>\n  \u003cdiv class=\"ft\">\u003cbutton class=\"btn g\" id=\"gtX\">やめる\u003c/button>\u003cbutton class=\"btn\" id=\"gtOk\" disabled>この値を入れる\u003c/button>\u003c/div>`);\n  $('gtX').onclick=hpClose;\n  $('gtOpen').onclick=()=>{const k=$('gtK').value.trim();if(!k)return;window.open(`https://trends.google.co.jp/trends/explore?date=all${$('gtG').value?'&geo='+$('gtG').value:''}&q=${encodeURIComponent(k)}&hl=ja`,'_blank','noopener');};\n  let rows=null;\n  const calc=()=>{if(!rows)return;try{$('gtErr').textContent='';const mx=Math.max(...rows.map(r=>r.n));\n    let rs=rows.filter(r=>$('gtPart').value==='1'||r.n>=mx);const by=+$('gtBY').value,bv=+$('gtBV').value;\n    const out=rebase(rs.map(r=>[r.year,r.value]),by,bv);\n    $('gtOut').innerHTML=`\u003ctable>\u003ctr>\u003cth>年\u003c/th>\u003cth>平均（元の値）\u003c/th>\u003cth>入れる値\u003c/th>\u003cth>件数\u003c/th>\u003c/tr>${out.map((r,i)=>`\u003ctr>\u003ctd>${r[0]}\u003c/td>\u003ctd>${r1(rs[i].value)}\u003c/td>\u003ctd>\u003cb>${r1(r[1])}\u003c/b>\u003c/td>\u003ctd>${rs[i].n}\u003c/td>\u003c/tr>`).join('')}\u003c/table>`;\n    $('gtOk').disabled=false;$('gtOk').onclick=()=>fillVar(id,out,`${by}=${bv}`,`Googleトレンド「${$('gtK').value.trim()}」（${$('gtG').value?'日本':'全世界'}）`);}\n    catch(e){$('gtErr').textContent=e.message;$('gtOk').disabled=true;}};\n  $('gtF').onchange=async e=>{const f=e.target.files[0];if(!f)return;rows=annualize(await f.text());if(!rows.length){$('gtErr').textContent='CSVの中に「年-月,値」の行が見つかりません';return;}\n    if(!rows.some(r=>r.year===+$('gtBY').value))$('gtBY').value=rows[0].year;calc();};\n  ['gtBY','gtBV','gtPart'].forEach(k=>$(k).onchange=calc);\n}\n\n// 2) PDF から語の出現率\nlet pdfLib=null;\nfunction loadPdf(){if(pdfLib)return pdfLib;const V='3.11.174',B=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${V}/`;\n  pdfLib=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=B+'pdf.min.js';\n    sc.onload=()=>{window.pdfjsLib.GlobalWorkerOptions.workerSrc=B+'pdf.worker.min.js';res({lib:window.pdfjsLib,B});};\n    sc.onerror=()=>{pdfLib=null;rej(new Error('PDFを読む部品を読み込めませんでした（インターネットにつながっているか確かめてください）'));};document.head.appendChild(sc);});return pdfLib;}\nconst yearFromName=n=>{let m=n.match(/(19|20)\\d{2}/);if(m)return +m[0];m=n.match(/令和\\s*(\\d+|元)/);if(m)return 2018+(m[1]==='元'?1:+m[1]);m=n.match(/平成\\s*(\\d+)/);if(m)return 1988+(+m[1]);m=n.match(/[Rr](\\d{1,2})(?!\\d)/);if(m)return 2018+(+m[1]);m=n.match(/[Hh](\\d{1,2})(?!\\d)/);if(m)return 1988+(+m[1]);return '';};\nfunction helperPdf(id){\n  let docs=[];\n  hpOpen(`\u003ch3>PDFから語の出現率を作る（トップダウン：社会・制度）\u003c/h3>\n  \u003cp>年ごとの文書（白書・計画・報告書など）のPDFを選び、数えたい語を入れると、1万字あたりの出現回数を年ごとに計算します。文字はこのパソコンの中だけで読み取り、外に送りません。\u003c/p>\n  \u003clabel>数える語（読点「、」かカンマで区切る。合計して数えます）\u003cinput id=\"pdK\" value=\"野菜\">\u003c/label>\n  \u003clabel>PDFを選ぶ（複数可）\u003cinput type=\"file\" id=\"pdF\" accept=\".pdf,application/pdf\" multiple>\u003c/label>\n  \u003cdiv id=\"pdList\">\u003c/div>\n  \u003cdiv class=\"r\">\u003clabel>表し方\u003cselect id=\"pdMode\">\u003coption value=\"idx\">基準の年＝100の指数\u003c/option>\u003coption value=\"raw\">1万字あたりの回数\u003c/option>\u003c/select>\u003c/label>\u003clabel>基準の年\u003cinput id=\"pdBY\" type=\"number\" value=\"2019\">\u003c/label>\u003c/div>\n  \u003cdiv id=\"pdOut\">\u003c/div>\u003cp class=\"warn\" id=\"pdErr\">\u003c/p>\n  \u003cdiv class=\"ft\">\u003cbutton class=\"btn g\" id=\"pdX\">やめる\u003c/button>\u003cbutton class=\"btn g\" id=\"pdRun\">数える\u003c/button>\u003cbutton class=\"btn\" id=\"pdOk\" disabled>この値を入れる\u003c/button>\u003c/div>`);\n  $('pdX').onclick=hpClose;\n  const list=()=>{$('pdList').innerHTML=docs.length?`\u003ctable>\u003ctr>\u003cth>ファイル\u003c/th>\u003cth>年\u003c/th>\u003cth>文字数\u003c/th>\u003c/tr>${docs.map((d,i)=>`\u003ctr>\u003ctd>${esc(d.f.name)}\u003c/td>\u003ctd>\u003cinput data-y=\"${i}\" type=\"number\" value=\"${d.year}\" style=\"width:80px\">\u003c/td>\u003ctd>${d.len??'—'}\u003c/td>\u003c/tr>`).join('')}\u003c/table>`:'';\n    document.querySelectorAll('#pdList [data-y]').forEach(inp=>inp.onchange=()=>{docs[+inp.dataset.y].year=+inp.value;});};\n  $('pdF').onchange=e=>{docs=docs.concat([...e.target.files].map(f=>({f,year:yearFromName(f.name),text:null,len:null})));list();};\n  let result=null;\n  const show=()=>{if(!result)return;try{$('pdErr').textContent='';const raw=result.map(r=>[r.year,r.rate]);\n    const out=$('pdMode').value==='idx'?rebase(raw,+$('pdBY').value,100):raw;\n    $('pdOut').innerHTML=`\u003ctable>\u003ctr>\u003cth>年\u003c/th>\u003cth>文字数\u003c/th>\u003cth>回数\u003c/th>\u003cth>1万字あたり\u003c/th>\u003cth>入れる値\u003c/th>\u003c/tr>${result.map((r,i)=>`\u003ctr>\u003ctd>${r.year}\u003c/td>\u003ctd>${r.len.toLocaleString()}\u003c/td>\u003ctd>${r.cnt}\u003c/td>\u003ctd>${r1(r.rate)}\u003c/td>\u003ctd>\u003cb>${r1(out[i][1])}\u003c/b>\u003c/td>\u003c/tr>`).join('')}\u003c/table>`;\n    $('pdOk').disabled=false;$('pdOk').onclick=()=>fillVar(id,out,$('pdMode').value==='idx'?`${$('pdBY').value}=100`:'回/1万字',`PDFの語「${$('pdK').value.trim()}」の出現率`);}\n    catch(e){$('pdErr').textContent=e.message;$('pdOk').disabled=true;}};\n  ['pdMode','pdBY'].forEach(k=>$(k).onchange=show);\n  $('pdRun').onclick=async()=>{\n    const kws=$('pdK').value.split(/[、,，]/).map(k=>k.normalize('NFKC').replace(/\\s+/g,'')).filter(Boolean);\n    if(!kws.length){$('pdErr').textContent='数える語を入れてください';return;}\n    if(!docs.length){$('pdErr').textContent='PDFを選んでください';return;}\n    if(docs.some(d=>!d.year)){$('pdErr').textContent='すべてのファイルに年を入れてください';return;}\n    try{$('pdErr').textContent='';$('pdRun').disabled=true;\n      const {lib,B}=await loadPdf();\n      for(const [i,d] of docs.entries()){if(d.text!=null)continue;$('pdOut').innerHTML=`\u003cp>読み取り中… ${i+1}/${docs.length}：${esc(d.f.name)}\u003c/p>`;\n        const pdf=await lib.getDocument({data:new Uint8Array(await d.f.arrayBuffer()),cMapUrl:B+'cmaps/',cMapPacked:true,standardFontDataUrl:B+'standard_fonts/'}).promise;\n        let t='';for(let p=1;p\u003c=pdf.numPages;p++){const pg=await pdf.getPage(p);const c=await pg.getTextContent();t+=c.items.map(it=>it.str).join('');\n          if(p%10===0)$('pdOut').innerHTML=`\u003cp>読み取り中… ${i+1}/${docs.length}：${esc(d.f.name)}（${p}/${pdf.numPages}ページ）\u003c/p>`;}\n        d.text=t.normalize('NFKC').replace(/\\s+/g,'');d.len=d.text.length;}\n      list();\n      const by={};docs.forEach(d=>{const o=by[d.year]=by[d.year]||{year:d.year,len:0,cnt:0};o.len+=d.len;o.cnt+=kws.reduce((s,k)=>s+(d.text.split(k).length-1),0);});\n      result=Object.values(by).sort((a,b)=>a.year-b.year).map(o=>({...o,rate:o.len?o.cnt/o.len*10000:0}));\n      if(result.some(r=>r.len\u003c200))$('pdErr').textContent='文字がほとんど読み取れないPDFがあります（画像だけのPDFは数えられません）';\n      if(!result.some(r=>r.year===+$('pdBY').value))$('pdBY').value=result[0].year;show();\n    }catch(e){$('pdErr').textContent=e.message||String(e);}finally{$('pdRun').disabled=false;}};\n}\n\n// 3) 比で作る（所得÷価格 など）\nfunction helperRatio(id){\n  hpOpen(`\u003ch3>比で作る（アフォーダビリティ：買いやすさ）\u003c/h3>\n  \u003cp>「所得」を「野菜の価格（消費者物価指数）」で割り、基準の年を100にした指数を作ります。数値は e-Stat などからCSVで落として、それぞれ読み込むか貼り付けてください。月ごとの値は年の平均にします。\u003c/p>\n  \u003cdiv class=\"step\">データの例：分子＝家計調査の可処分所得や実収入、分母＝消費者物価指数の「生鮮野菜」。\u003cbr>\n  \u003cbutton class=\"btn g\" id=\"raInc\" style=\"margin-top:6px\">e-Statで家計調査を開く\u003c/button> \u003cbutton class=\"btn g\" id=\"raCpi\" style=\"margin-top:6px\">e-Statで消費者物価指数を開く\u003c/button>\u003c/div>\n  \u003cdiv class=\"r\">\u003clabel>分子（所得など）：年,値\u003ctextarea id=\"raN\" placeholder=\"2019,450000&#10;2020,470000\">\u003c/textarea>\u003cinput type=\"file\" id=\"raNF\" accept=\".csv,.txt\">\u003c/label>\n  \u003clabel>分母（価格など）：年,値\u003ctextarea id=\"raD\" placeholder=\"2019,100&#10;2020,104.2\">\u003c/textarea>\u003cinput type=\"file\" id=\"raDF\" accept=\".csv,.txt\">\u003c/label>\u003c/div>\n  \u003cdiv class=\"r\">\u003clabel>基準の年\u003cinput id=\"raBY\" type=\"number\" value=\"2019\">\u003c/label>\u003clabel>基準の年の値\u003cinput id=\"raBV\" type=\"number\" value=\"100\">\u003c/label>\u003c/div>\n  \u003cdiv id=\"raOut\">\u003c/div>\u003cp class=\"warn\" id=\"raErr\">\u003c/p>\n  \u003cdiv class=\"ft\">\u003cbutton class=\"btn g\" id=\"raX\">やめる\u003c/button>\u003cbutton class=\"btn g\" id=\"raRun\">計算する\u003c/button>\u003cbutton class=\"btn\" id=\"raOk\" disabled>この値を入れる\u003c/button>\u003c/div>`);\n  $('raX').onclick=hpClose;\n  $('raInc').onclick=()=>window.open('https://www.e-stat.go.jp/stat-search/files?page=1&toukei=00200561','_blank','noopener');\n  $('raCpi').onclick=()=>window.open('https://www.e-stat.go.jp/stat-search/files?page=1&toukei=00200573','_blank','noopener');\n  [['raNF','raN'],['raDF','raD']].forEach(([f,t])=>$(f).onchange=async e=>{const x=e.target.files[0];if(!x)return;$(t).value=annualize(await x.text()).map(r=>`${r.year},${r1(r.value)}`).join('\\n');});\n  $('raRun').onclick=()=>{try{$('raErr').textContent='';const N=annualize($('raN').value),D=annualize($('raD').value);\n    const rows=N.map(n=>{const d=D.find(x=>x.year===n.year);return d&&d.value?[n.year,n.value/d.value]:null;}).filter(Boolean);\n    if(!rows.length)throw new Error('分子と分母で、同じ年のデータがありません');\n    const out=rebase(rows,+$('raBY').value,+$('raBV').value);\n    $('raOut').innerHTML=`\u003ctable>\u003ctr>\u003cth>年\u003c/th>\u003cth>分子\u003c/th>\u003cth>分母\u003c/th>\u003cth>入れる値\u003c/th>\u003c/tr>${out.map(r=>`\u003ctr>\u003ctd>${r[0]}\u003c/td>\u003ctd>${r1(N.find(x=>x.year===r[0]).value)}\u003c/td>\u003ctd>${r1(D.find(x=>x.year===r[0]).value)}\u003c/td>\u003ctd>\u003cb>${r1(r[1])}\u003c/b>\u003c/td>\u003c/tr>`).join('')}\u003c/table>`;\n    $('raOk').disabled=false;$('raOk').onclick=()=>fillVar(id,out,`${$('raBY').value}=${$('raBV').value}`,'所得÷価格（e-Statなど）');}\n    catch(e){$('raErr').textContent=e.message;$('raOk').disabled=true;}};\n}\n$('mClose').onclick=closeSettings;\n$('modal').onclick=e=>{ if(e.target.id==='modal') closeSettings(); };\ndocument.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('modal').classList.contains('open')) closeSettings(); });\nfunction readSettings(){\n  const C=JSON.parse(JSON.stringify(CONFIG));\n  C.title=$('cTitle').value.trim()||C.title; C.own.label=$('cOwnL').value.trim()||C.own.label;\n  if($('cOwnV').value!=='') C.own.value=+$('cOwnV').value; C.own.unit=$('cOwnU').value.trim();\n  if($('cNow').value!=='') C.nowYear=+$('cNow').value;\n  { const ai=$('cArch').value; if(ai){ if(!C.archetype||C.archetype.id!==ai) C.archetype={id:ai}; } else delete C.archetype; C.archetypeLock=$('cArchLock').checked; }\n  C.variables.forEach(v=>{ const box=$('vb-'+v.id), val=k=>box.querySelector(`[data-k=${k}]`).value;\n    ['pathway','name','src','unit'].forEach(k=>v[k]=val(k).trim());\n    const mn=+val('min'), mx=+val('max'); if(!(isFinite(mn)&&isFinite(mx)&&mn\u003cmx)) throw new Error(`${v.pathway}：縦軸の下限は上限より小さくしてください`);\n    v.domain=[mn,mx];\n    const d=parseData(val('data')); delete v.history; delete v.groups; Object.assign(v,d);\n    if(!(v.history||Object.values(v.groups).flat()).some(r=>r[0]\u003c=C.nowYear)) throw new Error(`${v.pathway}：「いま」以前のデータがありません`);\n  });\n  return C;\n}\n$('mApply').onclick=()=>{ try{ CONFIG=readSettings(); try{localStorage.setItem(OVR,JSON.stringify(CONFIG))}catch(e){}\n    applyConfig(); closeSettings(); toast('設定を反映しました'); log('settings'); }catch(e){ $('mErr').textContent=e.message } };\n$('mExport').onclick=()=>{ try{ const C=readSettings(); download(`tet_config_${C.studyId}.json`,JSON.stringify(C,null,2),'application/json'); }catch(e){ $('mErr').textContent=e.message } };\n$('mDefault').onclick=()=>{ if(!confirm('設定を初期状態に戻しますか？（描いた線は残ります）')) return; try{localStorage.removeItem(OVR)}catch(e){} location.reload(); };\nfunction applyConfig(){\n  VARS=[...CONFIG.variables.filter(v=>v.role!=='y'),...CONFIG.variables.filter(v=>v.role==='y')];\n  VARS.forEach(v=>{ if(!S.lanes[v.id]) S.lanes[v.id]={points:{},notes:{}}; });\n  if(!S.collapsed) S.collapsed=defaultCollapsed();\n  const g=VARS.find(v=>v.groups); if(g && !g.groups[S.participant.group]) S.participant.group=Object.keys(g.groups)[0];\n  if(!CONFIG.horizons.includes(S.horizon)) S.horizon=CONFIG.horizon;\n  document.title=CONFIG.title; save(); draw();\n}\n\n/* ---------- 記入と集計の切り替え ---------- */\nwindow.TET={\n  config:()=>CONFIG,\n  answer:()=>({id:S.participant.id, group:S.participant.group, value:S.participant.value, pos:pos(), lanes:JSON.parse(JSON.stringify(S.lanes)), rank:[...S.rank]}),\n  mode:m=>{ const sum=m==='summary'&&!LOCK; $('sheetApp').hidden=sum; $('sumApp').hidden=!sum;\n    const u=new URL(location.href); if(sum) u.searchParams.set('mode','summary'); else u.searchParams.delete('mode'); history.replaceState(null,'',u);\n    if(sum){ window.TET_SUM&&window.TET_SUM.render(); } else draw(); }\n};\nlet UI=(()=>{try{return localStorage.getItem('tet-ui')||'simple'}catch(e){return 'simple'}})();\nfunction setUI(m){UI=m;try{localStorage.setItem('tet-ui',m)}catch(e){}document.body.classList.toggle('simple',m==='simple');$('uiS').setAttribute('aria-pressed',m==='simple');$('uiA').setAttribute('aria-pressed',m!=='simple');if($('arP').style.display==='block')openArch();if(typeof S!=='undefined'&&S)draw();}\n$('uiS').onclick=()=>setUI('simple');$('uiA').onclick=()=>setUI('adv');setUI(UI);\n$('tplMore').onclick=()=>{const t=$('tpl');t.classList.toggle('det');$('tplMore').textContent=t.classList.contains('det')?'▾ 数字で細かく調整する':'▸ 数字で細かく調整する';};\n$('arB').onclick=()=>{const p=$('arP');if(p.style.display==='block')p.style.display='none';else openArch();};\n$('toSum').onclick=()=>window.TET.mode('summary');\n\n/* ---------- 起動 ---------- */\nfunction start(){\n  // 因果ループ図ツールから作ったシート：埋め込まれた設定を使う（研究者が設定画面で直したものは、同じシートの間は優先）\n  const P=window.TET_CONFIG;\n  if(P&&Array.isArray(P.variables)){\n    let o=null; try{o=JSON.parse(localStorage.getItem(OVR))}catch(e){}\n    CONFIG=(o&&Array.isArray(o.variables)&&o.presetId&&o.presetId===P.presetId)?o:JSON.parse(JSON.stringify(P));\n  } else {\n  try{ const o=JSON.parse(localStorage.getItem(OVR)); if(o&&Array.isArray(o.variables)) CONFIG=o; }catch(e){}\n  }\n  migrateCfg(CONFIG);\n  VARS=[...CONFIG.variables.filter(v=>v.role!=='y'),...CONFIG.variables.filter(v=>v.role==='y')];\n  STORE='tet_sheet_'+CONFIG.studyId;\n  try{const o=JSON.parse(localStorage.getItem(STORE));S=(o&&o.schema===SCHEMA)?o:fresh()}catch(e){S=fresh()}\n  applyConfig(); if(qs.get('mode')==='summary'&&!LOCK) setTimeout(()=>window.TET.mode('summary'),0);\n  let tm; new ResizeObserver(()=>{clearTimeout(tm);tm=setTimeout(draw,80)}).observe($('chart').parentNode);\n}\nconst cfg=qs.get('config');\nif(cfg&&/^[\\w.\\-\\/]+\\.json$/.test(cfg)) fetch(cfg).then(r=>r.json()).then(c=>{CONFIG=Object.assign({},CONFIG,c);start()}).catch(()=>{toast('設定ファイルを読めません');start()});\nelse start();\n\u003c/script>\n\u003cscript>\n(()=>{\n\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst toast=m=>{const e=$('sm_toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)};\nlet CFG=null;            // 最初のファイルの設定（変数・過去データ・縦軸）\nlet P=[];                // 参加者 {id, group, value, pos, lanes:{vid:{points:{}, notes:{}}}, rank:[]}\nlet tab='types';\n\n/* ---------- 読み込み ---------- */\nfunction fromJSON(o){\n  if(!o.lanes) throw new Error('回答ファイルではありません');\n  if(o.config && !CFG) CFG=o.config;\n  return {id:o.participant?.id||'anon', group:o.participant?.group||'', value:o.participant?.value??'', pos:o.position||null,\n          lanes:o.lanes, rank:o.rank||[]};\n}\nfunction fromCSV(text){\n  const rows=d3.csvParse(text.replace(/^\\uFEFF/,''));\n  const by=d3.group(rows,r=>r.participant_id);\n  const out=[];\n  by.forEach((rs,id)=>{\n    const p={id, group:rs[0].group, value:rs[0].own_value, pos:rs[0].position||null, lanes:{}, rank:[]};\n    const rk={};\n    rs.forEach(r=>{ const L=p.lanes[r.variable]=p.lanes[r.variable]||{points:{},notes:{}};\n      if(r.record==='forecast' && r.value!=='') L.points[r.year]=+r.value;\n      if(r.comment) L.notes[r.year]=r.comment;\n      if(r.rank) rk[r.variable]=+r.rank; });\n    p.rank=Object.entries(rk).sort((a,b)=>a[1]-b[1]).map(e=>e[0]);\n    if(!CFG){ // CSV だけの場合は、履歴行から最低限の設定を作る\n      const vars=[...d3.group(rs,r=>r.variable)].map(([vid,vr])=>{ const h=vr.filter(r=>r.record==='history').map(r=>[+r.year,+r.value]);\n        const vals=[...h.map(d=>d[1]),...vr.filter(r=>r.record==='forecast'&&r.value!=='').map(r=>+r.value)];\n        return {id:vid, role:vr[0].role, pathway:vr[0].pathway, name:'', unit:'', src:'', history:h, domain:[Math.min(0,d3.min(vals)), d3.max(vals)*1.15]}; });\n      CFG={title:'TET 集計 ) && p.group===f.slice(4))); }\nfunction fillFilter(){\n  const cur=$('sm_flt').value||'all', groups=[...new Set(P.map(p=>p.group).filter(Boolean))];\n  const opts=[['all','全員'],['pos:hi',posLabel('hi')],['pos:lo',posLabel('lo')],...groups.map(g=>['grp:'+g,g])];\n  $('sm_flt').innerHTML=opts.map(([v,l])=>`\u003coption value=\"${esc(v)}\" ${v===cur?'selected':''}>${esc(l)}\u003c/option>`).join('');\n}\n$('sm_flt').onchange=render; $('sm_mode').onchange=render;\nconst hist=(v,group)=>(v.groups?(v.groups[group]||Object.values(v.groups)[0]):v.history).map(([year,value])=>({year,value}));\n// 各参加者の線を、共通の年（全員の点の年の和集合）に直線で補間する\nfunction lineOf(p,v){\n  const H=hist(v,p.group), last=H.at(-1), pts=Object.entries(p.lanes[v.id]?.points||{}).map(([y,val])=>({year:+y,value:+val})).filter(d=>isFinite(d.value)).sort((a,b)=>a.year-b.year);\n  if(!pts.length) return null; return [last,...pts];\n}\nfunction interp(line,yr){ if(!line||yr\u003cline[0].year||yr>line.at(-1).year) return null;\n  for(let i=0;i\u003cline.length-1;i++){ const a=line[i],b=line[i+1]; if(yr>=a.year&&yr\u003c=b.year) return a.value+(b.value-a.value)*(yr-a.year)/((b.year-a.year)||1); } return line.at(-1).year===yr?line.at(-1).value:null; }\nfunction stats(v,people){\n  const now=CFG.nowYear, yrsSet=new Set(); people.forEach(p=>Object.keys(p.lanes[v.id]?.points||{}).forEach(y=>yrsSet.add(+y)));\n  const yrs=[...yrsSet].sort((a,b)=>a-b);\n  const lines=people.map(p=>({p,l:lineOf(p,v)})).filter(d=>d.l);\n  const rows=yrs.map(yr=>{ const vals=lines.map(d=>interp(d.l,yr)).filter(x=>x!=null).sort(d3.ascending);\n    return {year:yr,n:vals.length,p10:d3.quantileSorted(vals,.1),p25:d3.quantileSorted(vals,.25),med:d3.quantileSorted(vals,.5),p75:d3.quantileSorted(vals,.75),p90:d3.quantileSorted(vals,.9),min:vals[0],max:vals.at(-1)}; });\n  // 出発点（いま）：全員の最終実績の中央値\n  const start=d3.median(lines,d=>d.l[0].value);\n  if(rows.length && start!=null) rows.unshift({year:now,n:lines.length,p10:start,p25:start,med:start,p75:start,p90:start,min:start,max:start});\n  return {rows,lines};\n}\n// 線の型（論文ステップ5の「型」）：いまからの変化を縦軸の幅に対する割合で判定\nconst TYPES=['上昇','横ばい','下降','上がって下がる','下がって上がる'];\nfunction shapeOf(line,v){\n  const sp=v.domain[1]-v.domain[0], v0=line[0].value, rel=line.slice(1).map(d=>(d.value-v0)/sp), end=rel.at(-1), mx=d3.max(rel), mn=d3.min(rel), th=0.06;\n  if(Math.max(Math.abs(mx),Math.abs(mn))\u003cth) return '横ばい';\n  if(mx>th && end\u003cmx-th && rel.indexOf(mx)\u003crel.length-1 && Math.abs(mx)>=Math.abs(mn)) return '上がって下がる';\n  if(mn\u003c-th && end>mn+th && rel.indexOf(mn)\u003crel.length-1) return '下がって上がる';\n  return end>th?'上昇':(end\u003c-th?'下降':'横ばい');\n}\nfunction kendallW(people,items){\n  const full=people.filter(p=>items.every(id=>p.rank.includes(id))); const m=full.length, n=items.length; if(m\u003c2||n\u003c2) return {W:null,m};\n  const R=items.map(id=>d3.sum(full,p=>p.rank.indexOf(id)+1)), mean=m*(n+1)/2, S=d3.sum(R,r=>(r-mean)**2);\n  return {W:12*S/(m*m*(n**3-n)), m};\n}\n\n/* ---------- 描画 ---------- */\nfunction render(){\n  fillFilter(); const people=filtered();\n  $('sm_count').textContent=`${people.length}人${people.length!==P.length?` / ${P.length}人`:''}`;\n  $('sm_drop').style.display=P.length?'none':'flex';\n  if(CFG) $('sm_title').textContent='集計｜'+(CFG.title||'TET');\n  drawChart(people); drawPane(people);\n}\nconst VARS=()=>CFG?(migrateCfg(CFG),[...CFG.variables.filter(v=>v.role!=='y'),...CFG.variables.filter(v=>v.role==='y')]):[];\nfunction drawChart(people){\n  const box=$('sm_chart'); box.innerHTML=''; if(!CFG||!people.length) return;\n  const W=box.clientWidth,H=box.clientHeight, LW=150, RW=78, TOP=30, BOT=26, GAP=8, V=VARS(), n=V.length, sep=10;\n  const laneH=(H-TOP-BOT-GAP*(n-1)-sep)/n, mode=$('sm_mode').value, grp=people[0]?.group;\n  const first=d3.min(V,v=>hist(v,grp)[0].year), lastY=d3.max(people,p=>d3.max(Object.values(p.lanes).flatMap(L=>Object.keys(L.points||{}).map(Number))))||CFG.nowYear+10;\n  const x=d3.scaleLinear().domain([first,lastY function metricScores(){

  else if(sizeBy==='out')for(let i=0;i<n;i++)sc[i]=out[i].size;
  else if(sizeBy==='in')for(let i=0;i<n;i++)sc[i]=inc[i].size;

    for(let s0=0;s0<n;s0++){if(!alive(s0))continue;
      const S=[],P=Array.from({length:n},()=>[]),sig=new Array(n).fill(0),d=new Array(n).fill(-1);sig[s0]=1;d[s0]=0;const Q=[s0];
      while(Q.length){const v=Q.shift();S.push(v);out[v].forEach(w=>{if(d[w]<0){d[w]=d[v]+1;Q.push(w);}if(d[w]===d[v]+1){sig[w]+=sig[v];P[w].push(v);}});}

}

/* ---- ループの探索 ---- */
function cyclesThrough(v,L,cap,edgeOK){
  const res=[];const path=[v];const onp=new Set([v]);
  (function dfs(x){if(res.length>=cap)return;
    for(const y of out[x]){if(edgeOK&&!edgeOK(x,y))continue;
      if(y===v){if(path.length>=2)res.push(path.slice());continue;}
      if(onp.has(y)||path.length>=L)continue;path.push(y);onp.add(y);dfs(y);path.pop();onp.delete(y);}})(v);
  return res.sort((a,b)=>a.length-b.length);
}
function cyclesExact(v,L,cap){
  const res=[];const path=[v];const onp=new Set([v]);
  (function dfs(x){if(res.length>=cap)return;
    for(const y of out[x]){
      if(path.length===L){if(y===v)res.push(path.slice());continue;}
      if(y===v||onp.has(y))continue;
      if(path.length+DIST[y][v]>L)continue;
      path.push(y);onp.add(y);dfs(y);path.pop();onp.delete(y);if(res.length>=cap)return;}})(v);
  return res;
}
let loopCache={};
function loopsOf(i){
  const key=i+'|'+maxLen;
  if(loopCache[key])return loopCache[key];
  const Lmax=maxLen===Infinity?8:maxLen;let list=[];let extended=false,capped=false;
  for(let L=2;L<=Lmax&&list.length<600;L++){const c=cyclesExact(i,L,600-list.length);list=list.concat(c);if(list.length>=600)capped=true;}
  if(!list.length){for(let L=Lmax+1;L<=10;L++){const c=cyclesExact(i,L,30);if(c.length){list=c;extended=true;break;}}}
  return loopCache[key]={list,extended,capped};
}
function loopSign(ids){

}

      const i=nodes[a],j=nodes[b];if(!pos[i]||!pos[j])continue;const dx=pos[j].x-pos[i].x,dy=pos[j].y-pos[i].y;

function mergeState(d,merge){
  const res={vNew:0,vSame:0,e:0,conf:0};

  const gmap={};(d.groups||[]).forEach(g=>{if(!g||!g.k)return;const ex=GROUPS.find(x=>x.k===g.k||x.ja===g.ja);if(ex)gmap[g.k]=ex.k;else{GROUPS.push({k:g.k,ja:g.ja,color:g.color});THEMES[g.k]=[g.ja,g.ja];themeOn.add(g.k);gmap[g.k]=g.k;}});
  if(!merge)COLORS=Object.assign({},d.colors||{});else Object.entries(d.colors||{}).forEach(([k,v])=>{if(!COLORS[k])COLORS[k]=v;});
  // 変数
  const umap={};
  (d.vars||[]).forEach(v=>{if(!v||!v.ja)return;const t=gmap[v.t]||v.t||'p';
    let k=UVARS.findIndex(x=>!x.del&&(x.uid===v.uid||(x.ja===v.ja&&(x.t||'p')===t&&(x.cat||null)===(v.cat||null))));
    if(k>=0){res.vSame++;const x=UVARS[k];x.by=[...new Set([...(x.by||[]),...(v.by||[]),...(d.author?[d.author]:[])])];if((v.st||1)>(x.st||1))x.st=v.st;if(!x.desc&&v.desc)x.desc=v.desc;umap[v.uid]=x.uid;}
    else{let uid=v.uid&&!UVARS.some(x=>x.uid===v.uid)?v.uid:newUid();UVARS.push({uid,ja:v.ja,t,cat:t==='p'?(v.cat||'bu'):undefined,st:v.st||1,desc:v.desc||'',by:[...new Set([...(v.by||[]),...(d.author?[d.author]:[])])]});umap[v.uid]=uid;res.vNew++;}});
  syncVars();graph();
  const mapRef=r=>{if(typeof r!=='string')return null;if(r.startsWith('U:')){const u=umap[r.slice(2)]||r.slice(2);return idxOf('U:'+u);}return idxOf(r);};
  const mapKey=k=>{const [a,b]=k.split('>');const f=mapRef(a),t=mapRef(b);return f!==null&&t!==null?[f,t]:null;};
  // 矢印
  (d.edges||[]).forEach(e=>{const f=mapRef(e.f),t=mapRef(e.t);if(f===null||t===null||f===t)return;const key=ekey(f,t);
    if(!baseKeys.has(key)&&!isUser(f,t)){USER.push([f,t]);res.e++;}
    const by=[...new Set([...(edgeBy[key]||[]),...(e.by||[]),...(d.author?[d.author]:[])])];if(by.length)edgeBy[key]=by;});

  Object.entries(d.pol||{}).forEach(([k,p])=>{const m=mapKey(k);if(!m||(p!=='+'&&p!=='-'))return;const key=ekey(...m);

    if(!pol[key])pol[key]=p;else if(pol[key]!==p)res.conf++;});
  if(!merge)Object.entries(d.votes||{}).forEach(([k,v])=>{const m=mapKey(k);if(m)polVotes[ekey(...m)]=v;});
  (d.eoff||[]).forEach(k=>{const m=mapKey(k);if(m)EOFF.add(ekey(...m));});(d.noff||[]).forEach(r=>{const i=mapRef(r);if(i!==null)NOFF.add(i);});saveOff();

}

let enWarned=false;
async function translateMissing(){
  const miss=UVARS.map((v,k)=>({v,k})).filter(o=>!o.v.del&&!o.v.en);if(!miss.length)return;
  if(aiSample&&aiSample.json){toast('Translating added variables…');
    try{const r=await aiSample.json(`Translate these short Japanese variable names from a food-system causal loop diagram into concise natural English (each under 6 words, as a quantity that can increase or decrease). Return JSON only: {"names":["..."]} in the same order.\n`+miss.map((o,i)=>`${i+1}. ${o.v.ja}`).join('\n'));
      (r.names||[]).forEach((t,i)=>{if(miss[i]&&typeof t==='string'&&t.trim())miss[i].v.en=t.trim();});store.set('fsci-cld-vars',UVARS);syncVars();relabel();toast('Added variables translated (you can edit them in the variable panel)');return;}catch(e){}}
  if(!enWarned){enWarned=true;toast(`${miss.length} added variable(s) have no English name yet. Select one and type its English name in the panel.`);}
}
['ja','en'].forEach(l=>document.getElementById('lang-'+l).addEventListener('click',()=>{lang=l;['ja','en'].forEach(x=>document.getElementById('lang-'+x).setAttribute('aria-pressed',x===l));relabel();if(l==='en')translateMissing();}));
['plain','fsci'].forEach(n=>document.getElementById('ns-'+n).addEventListener('click',()=>{nameStyle=n;['plain','fsci'].forEach(x=>document.getElementById('ns-'+x).setAttribute('aria-pressed',x===n));relabel();}));
let rt;const refit=()=>{clearTimeout(rt);rt=setTimeout(fit,120);};
window.addEventListener('resize',refit);
if(window.ResizeObserver)new ResizeObserver(refit).observe(document.getElementById('stage'));
document.getElementById('zfull').onclick=async()=>{const st=document.getElementById('stage');
  try{if(document.fullscreenElement)await document.exitFullscreen();else await st.requestFullscreen();}
  catch(_){document.getElementById('layout').classList.toggle('wide');refit();toast(T('全画面が使えないため、図を広げました','Fullscreen unavailable; widened the diagram'));}};
document.addEventListener('fullscreenchange',refit);

document.body.classList.toggle('simple',uiMode==='simple');['simple','adv'].forEach(x=>document.getElementById('ui-'+x).setAttribute('aria-pressed',(x==='simple')===(uiMode==='simple')));
setupSvg();setHelp(helpOn);texts();renderLegend();renderSteps();applyEdit();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>rebuild());
</script>
</body>
