<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>フードシステムの因果ループ図</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5FB; --ink:#23263A; --muted:#6B7088; --line:#E2E4F0; --panel:#FFFFFF; --soft:#F1F1FA; --accent:#5B5BD6; --accent-d:#3F3FB0; --mint:#14A37F;
  --pos:#1F6FB2; --neg:#C2412D;
  --d:#B07F00; --e:#2E8B57; --l:#A23D78; --g:#2F5D9E; --r:#11807D; --p:#6B4FA0; --gray:#B3BBB7; --td:#5B4BB0; --bu:#C2457E; --af:#D9822B; --a:#8A5A44;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131816; --ink:#E7ECE9; --muted:#9BA6A1; --line:#2E3633; --panel:#1B211F; --soft:#242B28; --accent:#6F9BE0;
  --pos:#6FA8E8; --neg:#F07A64;
  --d:#EDB72E; --e:#4FBC7E; --l:#D873AF; --g:#6F9BE0; --r:#3BC1BD; --p:#A88BE0; --gray:#5A6460; --td:#9C8CF0; --bu:#EE7FAE; --af:#F0A860; --a:#C79A82;}}
:root[data-theme="dark"]{
  --bg:#131816; --ink:#E7ECE9; --muted:#9BA6A1; --line:#2E3633; --panel:#1B211F; --soft:#242B28; --accent:#6F9BE0;
  --pos:#6FA8E8; --neg:#F07A64;
  --d:#EDB72E; --e:#4FBC7E; --l:#D873AF; --g:#6F9BE0; --r:#3BC1BD; --p:#A88BE0; --gray:#5A6460; --td:#9C8CF0; --bu:#EE7FAE; --af:#F0A860; --a:#C79A82;}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"M PLUS Rounded 1c","BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;line-height:1.6}
body.nohelp .help{display:none !important}
body.simple .adv{display:none !important}
.wrap{max-width:1680px;margin:0 auto;padding:10px 14px;height:100vh;height:100dvh;display:flex;flex-direction:column}
.wrap>*{flex:none}
header{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:1.4rem;line-height:1.35;margin:0}
.hright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;font-size:.88rem;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary[aria-pressed="true"]{background:var(--neg);border-color:var(--neg)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex}
.seg button{font:inherit;font-size:.88rem;padding:6px 12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:none}
.seg button:first-child{border-radius:8px 0 0 8px}.seg button:last-child{border-radius:0 8px 8px 0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:0 0 8px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.82rem;line-height:1.45;display:flex;gap:8px;align-items:center}
.step .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;flex:1 1 auto !important;min-height:0}
.layout.wide{grid-template-columns:1fr}
.layout.wide{grid-template-columns:minmax(0,1fr) 0}
.layout.wide aside{display:none}
@media (max-width:960px){.wrap{height:auto}.layout{grid-template-columns:1fr}.stage{height:72vh}aside{overflow:visible}}
.stage{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;height:100%;min-height:360px;overflow:hidden;touch-action:none}
.stage:fullscreen{border-radius:0}
#cld{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#cld.panning{cursor:grabbing}
.stage.adding #cld{cursor:crosshair}
.tbar{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;pointer-events:none}
.tbar>*{pointer-events:auto}
.banner{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:var(--neg);color:#fff;font-size:.88rem;padding:6px 14px;border-radius:20px;display:none;white-space:nowrap}
.stage.adding .banner{display:block}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:4px}
.zoom button{font:inherit;width:38px;height:38px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:1.05rem}
.zoom button:hover{background:var(--soft)}
aside{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;overflow-y:auto;padding-right:2px}
aside>*{flex:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{font-size:.95rem;margin:0 0 8px}
select{width:100%;font:inherit;font-size:.95rem;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.selname{font-weight:700;font-size:1.15rem;line-height:1.4;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);margin-top:2px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.desc{font-size:.88rem;margin:8px 0 6px;line-height:1.6}
.fsci{font-size:.75rem;color:var(--muted);margin:0 0 8px;line-height:1.5}
.nums{display:flex;gap:6px;font-size:.82rem;flex-wrap:wrap}
.nums span{background:var(--soft);border-radius:6px;padding:2px 8px}
.nums b{font-size:1rem;margin-right:2px}
.loops{list-style:none;margin:0;padding:0}
.loops li button{all:unset;display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:.86rem;line-height:1.45;padding:5px 4px;border-radius:6px;width:100%;box-sizing:border-box}
.loops li button:hover,.loops li button:focus-visible{background:var(--soft)}
.loops li button[aria-current="true"]{background:var(--soft);outline:1px solid var(--line)}
.badge{flex:none;min-width:24px;height:22px;border-radius:11px;display:inline-grid;place-items:center;font-size:.72rem;font-weight:700;border:1.5px solid var(--muted);color:var(--muted);padding:0 4px}
.badge.R{border-color:var(--pos);color:var(--pos)}.badge.B{border-color:var(--neg);color:var(--neg)}
details.lg{border-top:1px solid var(--line);margin-top:6px;padding-top:4px}
details.lg summary{cursor:pointer;font-size:.82rem;color:var(--muted);padding:4px 0}
.lscroll{max-height:300px;overflow:auto}
.empty{color:var(--muted);font-size:.86rem;margin:0}
.noloop{background:var(--soft);border-radius:8px;padding:10px;font-size:.86rem}
.noloop p{margin:0 0 8px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:.86rem;align-items:center}
.legend b{text-align:center;min-width:22px}
details.set summary{cursor:pointer;font-weight:700;font-size:.95rem}
.lab{font-size:.8rem;color:var(--muted);margin:12px 0 4px}
.chk{display:flex;gap:6px;align-items:center;font-size:.86rem;cursor:pointer;margin:4px 0}
.row{display:flex;gap:6px;flex-wrap:wrap}
.mini{width:auto;font-size:.85rem;padding:6px 8px;border-radius:8px;background:var(--panel)}
.tleft{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tright{display:flex;gap:8px}
[hidden]{display:none !important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:20;padding:16px}
.dlg{background:var(--panel);color:var(--ink);border-radius:14px;padding:18px;width:min(460px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.dlg h3{margin:0 0 10px;font-size:1.05rem}
.dlg input,.dlg textarea{width:100%;font:inherit;font-size:.95rem;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.dlg textarea{min-height:60px;resize:vertical}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cats button{font:inherit;font-size:.8rem;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 6px;cursor:pointer;text-align:center;line-height:1.35}
.cats button small{display:block;color:var(--muted);font-size:.7rem;margin-top:2px}
.cats button[aria-pressed="true"]{border-color:var(--p);background:color-mix(in srgb,var(--p) 12%,var(--panel));color:var(--p);font-weight:700}
.exlab{font-size:.75rem;color:var(--muted);margin:8px 0 4px}
.presets button{font:inherit;font-size:.84rem;border:1px solid var(--p);color:var(--p);background:transparent;border-radius:16px;padding:4px 10px;cursor:pointer}
.presets button:hover{background:color-mix(in srgb,var(--p) 12%,transparent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:.88rem;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1;pointer-events:auto}
.toast button{font:inherit;font-size:.85rem;margin-left:10px;background:transparent;color:inherit;border:1px solid currentColor;border-radius:12px;padding:1px 10px;cursor:pointer}
.edge .del{cursor:pointer}
.edge .del circle{fill:var(--panel);stroke:var(--muted);stroke-width:1.2}
.edge .del text{fill:var(--muted);stroke:none;font-weight:700;pointer-events:none}
.edge .del:hover circle{stroke:var(--neg);fill:color-mix(in srgb,var(--neg) 12%,var(--panel))}
.edge .del:hover text{fill:var(--neg)}
.how{margin:8px 0 6px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.how summary{cursor:pointer;font-size:.86rem;font-weight:700;padding:8px 10px}
.how .body{padding:0 10px 10px;font-size:.86rem;line-height:1.7}
.how .body p{margin:0 0 8px}
.how .ex{background:var(--panel);border-left:3px solid var(--accent);padding:6px 8px;border-radius:4px;margin:0 0 8px}
.how dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0;font-size:.82rem}
.how dt{color:var(--muted)}
.how dd{margin:0}
.how ol{margin:6px 0 0;padding-left:1.3em;font-size:.76rem;line-height:1.5;color:var(--muted)}
.how ol li{margin-bottom:4px}
.how ol a{color:var(--accent);word-break:break-all}
.how .rh{font-size:.78rem;font-weight:700;margin:10px 0 0;color:var(--ink)}
.rank{list-style:none;margin:0;padding:0;counter-reset:r}
.rank li button{all:unset;display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;cursor:pointer;font-size:.86rem;padding:4px 4px;border-radius:6px;width:100%;box-sizing:border-box}
.rank li button:hover,.rank li button:focus-visible{background:var(--soft)}
.rank .no{color:var(--muted);font-size:.78rem;text-align:right}
.rank .bar{height:6px;border-radius:3px;background:var(--accent);opacity:.7;min-width:4px}
.rank .val{font-size:.78rem;color:var(--muted);text-align:right}
.aiout{font-size:.88rem;line-height:1.75;margin-top:10px;white-space:normal}
.aiout:empty{display:none}
.aiout .q{background:var(--soft);border-radius:8px;padding:6px 10px;margin:10px 0 6px;font-size:.84rem}
.aiout .a p{margin:0 0 8px}.aiout .a ul{margin:0 0 8px;padding-left:1.3em}
.aiout .think{color:var(--muted)}
.qbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qbtns button{font:inherit;font-size:.82rem;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:14px;padding:4px 10px;cursor:pointer;text-align:left}
.qbtns button:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.qbtns button:disabled{opacity:.4;cursor:default}
.aifree{display:flex;gap:6px;margin-top:8px}
.aifree textarea{flex:1;font:inherit;font-size:.86rem;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);resize:vertical;min-height:38px}
.datalink{display:inline-block;margin-top:8px;font-size:.86rem;color:var(--accent)}
.about{margin-top:14px;font-size:.78rem;color:var(--muted);max-width:70em}
/* SVG */
.node{cursor:pointer}
.node .hit{fill:transparent}
.node text{fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:5px;stroke-linejoin:round}
.node.sel text{font-weight:700}
.node.sel .hit,.node.from .hit{fill:color-mix(in srgb,var(--c) 14%,transparent);stroke:var(--c);stroke-width:1.5}
.node.from .hit{stroke:var(--neg);stroke-width:3;stroke-dasharray:5 3}
.node.dim{opacity:.18}
.node.soft text{font-style:italic}
.epop{position:absolute;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:10px 12px;width:260px;font-size:.84rem}
.epop .t{font-weight:700;line-height:1.4;margin:0 22px 8px 0}
.epop .x{position:absolute;right:8px;top:6px;border:none;background:none;font-size:1.1rem;cursor:pointer;color:var(--muted)}
.epop .seg button{flex:1;padding:4px 6px}
.epop input[type=range]{width:100%}
.epop .wrow{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--muted);font-size:.78rem}
.cleg{position:absolute;left:12px;bottom:12px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:.78rem;display:flex;gap:14px;align-items:center}
.cleg i{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.lane{cursor:pointer}
.tetv{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
.tetv h4{margin:0 0 6px;font-size:.9rem;display:flex;justify-content:space-between;gap:8px}
.tetv .g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tetv label{font-size:.75rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.tetv input,.tetv textarea,.tetbox input,.tetbox select{font:inherit;font-size:.86rem;padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:100%}
.tetv textarea{min-height:64px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
.tetbox .g2{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
.tetbox label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.tetx{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tetx label{flex-direction:row;align-items:center;gap:5px;border:1px solid var(--line);border-radius:14px;padding:3px 10px;color:var(--ink);font-size:.82rem;cursor:pointer}
.tetx input{width:auto}
.rd .st{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.86rem;line-height:1.6}
.rd .st.cur{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 25%,transparent)}
.rd .st .q{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.rd .st .q button{font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.rd .st .q button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rd .up{color:var(--pos);font-weight:700}.rd .dn{color:var(--neg);font-weight:700}
.rd .hint{font-size:.76rem;color:#8A5600;background:color-mix(in srgb,#E39B2D 12%,transparent);border-radius:6px;padding:3px 7px;margin-top:6px;display:inline-block}
.rd .concl{border-radius:10px;padding:10px;margin-top:8px;font-size:.88rem;line-height:1.7}
.rd .concl.R{background:color-mix(in srgb,var(--pos) 10%,transparent);border:1px solid var(--pos)}
.rd .concl.B{background:color-mix(in srgb,var(--neg) 10%,transparent);border:1px solid var(--neg)}
.refm{margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.refm .h{font-size:.8rem;font-weight:700;margin-bottom:4px}
.refm svg{width:100%;height:auto;display:block}
.elist{max-height:300px;overflow-y:auto;display:grid;gap:2px}
.elist .er{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;font-size:.82rem;padding:4px 2px;border-bottom:1px solid var(--soft)}
.elist .er:hover{background:var(--soft)}
.elist .nm{line-height:1.35;cursor:pointer}
.elist .nm small{color:var(--muted)}
.elist .pg{display:inline-flex}
.elist .pg button{font:inherit;font-size:.8rem;width:24px;height:24px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;padding:0}
.elist .pg button+button{border-left:none}
.elist .pg button:first-child{border-radius:6px 0 0 6px}.elist .pg button:last-child{border-radius:0 6px 6px 0}
.elist .pg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.elist input[type=number],.epop input[type=number]{width:58px;font:inherit;font-size:.82rem;padding:3px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.elist .sub{font-size:.75rem;color:var(--muted);margin:6px 0 2px;font-weight:700}
.colors{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:.84rem}
.colors input[type=color]{width:40px;height:26px;border:1px solid var(--line);border-radius:6px;padding:0;background:none;cursor:pointer}
.aip{margin-top:10px;border:1px solid var(--accent);border-radius:10px;padding:10px;font-size:.84rem;background:color-mix(in srgb,var(--accent) 6%,var(--panel))}
.aip p{margin:0 0 6px}.aip label{display:flex;gap:8px;align-items:flex-start;margin:6px 0}.dlg .aip input[type=checkbox]{width:auto;flex:none;margin-top:4px}
.aip .h{font-weight:700;margin-bottom:6px}
.lane:hover text{fill:var(--accent)}
.icelab{font-size:13px;font-weight:700;fill:var(--muted)}
.iceph{font-size:13px;fill:var(--muted);font-style:italic}
.edge path.vis{fill:none}
.edge path.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.edge:hover path.vis{stroke-width:3 !important;opacity:1 !important}
.edge.dim{opacity:.06}
.edge text{font-weight:700;pointer-events:none;fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.tlabel{font-weight:700;paint-order:stroke;stroke:var(--panel);stroke-width:5px}
.lm text{font-weight:700}

/* ===== デザイン：TETとそろえた、やさしくポップな見た目 ===== */
.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex:none}
.icb::before{content:'';display:inline-block;width:1.1em;height:1.1em;margin-right:.35em;vertical-align:-.18em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.ic-chat{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z'/></svg>")}
.ic-info{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='12' r='9'/><path d='M12 11v6M12 7.5v.5'/></svg>")}
.ic-slider{--m:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1'/><circle cx='15' cy='6' r='2'/><circle cx='9' cy='12' r='2'/><circle cx='17' cy='18' r='2'/></svg>")}

.node .nx{cursor:pointer;opacity:.35;transition:opacity .15s}.node:hover .nx{opacity:1}.node .nx circle{fill:var(--panel);stroke:var(--muted);stroke-width:1.3}.node .nx text{fill:var(--muted);stroke:none;font-weight:800;pointer-events:none}.node .nx:hover circle{stroke:var(--neg)}.node .nx:hover text{fill:var(--neg)}
.str{display:flex;gap:4px;margin-top:6px}.str button{flex:1;font:inherit;font-size:.82rem;font-weight:800;border:2px solid var(--line);border-bottom-width:3px;background:var(--panel);color:var(--ink);border-radius:10px;padding:5px 2px;cursor:pointer}.str button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent-d,#3F3FB0)}
.str i{display:block;margin:2px auto 0;height:0;border-top:solid currentColor;width:60%;border-radius:2px}
.arow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;border:2px solid var(--line);border-bottom-width:3px;background:var(--panel);color:var(--ink);border-radius:12px;padding:6px 10px;margin-top:6px;cursor:pointer}
.arow[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.arow b{font-size:.92rem}.arow small{display:block;color:var(--muted);font-size:.74rem}
.arow .sc{margin-left:auto;font-size:.72rem;font-weight:800;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--muted);white-space:nowrap}
.arow .sc.hi{background:var(--accent);color:#fff}
.rtab{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center;font-size:.84rem;margin-top:10px}
.rtab b{color:var(--accent-d,#3F3FB0)}.rtab b.pb{color:var(--neg)}
.rtab select{font-size:.84rem;padding:5px}
.story2{font-size:.98rem;line-height:2.2;background:var(--soft);border-radius:14px;padding:10px 12px;margin-top:4px}
.story2 .sv{font:inherit;font-size:.92rem;font-weight:800;border:2px dashed var(--accent);background:var(--panel);color:var(--accent-d,#3F3FB0);border-radius:10px;padding:1px 10px;margin:0 2px;cursor:pointer;line-height:1.6}
.story2 .sv.on{border-style:solid;background:color-mix(in srgb,var(--accent) 12%,var(--panel))}
.story2 .sv.pb{border:0;background:none;color:var(--neg);padding:0}
.ccards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 2px}
.ccards button{font:inherit;font-size:.9rem;font-weight:700;text-align:left;border:2px solid var(--line);border-bottom-width:4px;background:var(--panel);color:var(--ink);border-radius:14px;padding:10px 12px;cursor:pointer;line-height:1.4}
.ccards button:hover{border-color:var(--accent)}
@keyframes pls{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 50%,transparent)}100%{box-shadow:0 0 0 12px transparent}}.rgo.pulse{animation:pls .8s ease-out 2}
.ccards button small{display:block;font-size:.7rem;color:var(--muted);font-weight:500;margin-top:2px}
.ends{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ends button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:2px 10px;cursor:pointer}
.rpk{width:min(440px,100%) !important;position:relative;padding:22px 20px 18px !important}
.rpk .rx{position:absolute;right:12px;top:10px;border:0;background:none;font-size:1.4rem;color:var(--muted);cursor:pointer}
.rpk .rq{font-size:1.15rem;font-weight:800;line-height:1.5;margin-right:24px}
.rpk .rr{font-size:.8rem;color:var(--accent-d,#3F3FB0);font-weight:700;margin:4px 0 12px}
.rpk input{width:100%;font:inherit;font-size:1.05rem;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink)}
.rpk input:focus{border-color:var(--accent);outline:none}
.rpk .rk{font-size:.78rem;color:var(--muted);margin:12px 0 6px}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchips button{font:inherit;font-size:.85rem;font-weight:800;border:2px solid var(--c);color:var(--c);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer}
.rchips button[aria-pressed="true"]{background:var(--c);color:#fff}
.rpk .rgo{width:100%;margin-top:14px;padding:11px;font-size:1.05rem}
.rpk .rmore{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.rpk .rmore summary{cursor:pointer;font-size:.85rem;font-weight:700;color:var(--accent-d,#3F3FB0)}
.rpk .rmore .qbtns{margin:8px 0}
.rpk .rmore select{margin-top:6px}
.rpk .rclr{margin-top:10px;border:0;background:none;color:var(--neg);font:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.ph{cursor:pointer}.ph:hover rect{stroke-width:3}
.node.prob .hit{fill:color-mix(in srgb,var(--neg) 12%,transparent);stroke:var(--neg);stroke-width:2.4}
.edge.miss path.vis{stroke-dasharray:6 5}
.dockbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none}
.dockbar button{font:inherit;font-size:.78rem;font-weight:800;border:2px solid var(--line);border-bottom-width:4px;background:var(--panel);color:var(--ink);border-radius:14px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.dockbar button b{font-size:1.25rem;line-height:1.1}
.dockbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-d,#3F3FB0);color:#fff}
.dockbar button:active{transform:translateY(2px)}
#dock .dk:not(.on){display:none !important}
#dock .dk details>summary{display:none}
.empty-hero{text-align:center;padding:14px 8px 6px;color:var(--muted)}
.empty-hero b{display:block;font-size:2.2rem;line-height:1.1}
.empty-hero span{display:block;font-weight:800;color:var(--ink);font-size:1rem;margin-top:6px}
body{font-size:15px}
h1{font-weight:800;color:var(--accent-d,#3F3FB0);font-size:1.35rem}
header{background:var(--panel);border-radius:18px;padding:8px 14px;box-shadow:0 2px 0 var(--line),0 6px 18px rgba(35,38,58,.06)}
.card{border:0 !important;border-radius:20px !important;box-shadow:0 2px 0 var(--line),0 8px 22px rgba(35,38,58,.06)}
.stage{border:0 !important;border-radius:22px !important;box-shadow:0 2px 0 var(--line),0 10px 28px rgba(35,38,58,.07)}
.btn,.seg button,.zoom button{font-weight:800 !important;transition:transform .08s,border-bottom-width .08s}
.btn{border-radius:12px !important;border:2px solid var(--line) !important;border-bottom-width:4px !important}
.btn:active,.seg button:active,.zoom button:active{transform:translateY(2px)}
.btn.primary{background:var(--accent) !important;border-color:var(--accent-d,#3F3FB0) !important;color:#fff !important}
.btn.primary[aria-pressed="true"]{background:var(--neg) !important;border-color:#8E2A1E !important}
.seg{border-radius:14px;box-shadow:0 2px 0 var(--line)}
.seg button{border-width:2px !important;padding:6px 12px}
.seg button:first-child{border-radius:12px 0 0 12px !important}.seg button:last-child{border-radius:0 12px 12px 0 !important}
.seg button[aria-pressed="true"]{background:var(--accent) !important;border-color:var(--accent) !important;color:#fff !important}
.zoom button{border-radius:12px !important;border:2px solid var(--line) !important;border-bottom-width:4px !important}
select,.mini{border-radius:12px !important;border:2px solid var(--line) !important;background:var(--panel)}
.step{border:0 !important;border-radius:16px !important;box-shadow:0 2px 0 var(--line)}
.step .n{background:var(--accent) !important;color:#fff}
.selname{font-size:1.25rem;color:var(--accent-d,#3F3FB0)}
.loops li button{border-radius:12px}
.badge{border-width:2px}
details.lgd summary,details.set summary{cursor:pointer;font-weight:800;font-size:.95rem;list-style:none}
details.lgd summary::-webkit-details-marker,details.set summary::-webkit-details-marker{display:none}
details.lgd summary::after,details.set summary::after{content:' ▾';color:var(--muted)}
details[open].lgd summary::after,details[open].set summary::after{content:' ▴'}
.how,.noloop,.refm,.tetv{border-radius:14px !important}
.toast{border-radius:999px !important;font-weight:700}
.dlg{border-radius:20px !important}
.cleg{border-radius:12px !important;border:0 !important;box-shadow:0 2px 0 var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#8C8CF0;--accent-d:#B5B5FF}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1 data-ja="フードシステムの因果ループ図" data-en="Food system causal loop diagram"></h1>
  <div class="hright">
    <div class="seg" role="group" aria-label="mode"><button id="ui-simple" data-ja="かんたん" data-en="Simple"></button><button id="ui-adv" data-ja="くわしく" data-en="Advanced"></button></div>
    <button class="btn" id="helpBtn" aria-pressed="true" data-ja="？ 使い方" data-en="? Help"></button>
    <div class="seg" role="group" aria-label="language"><button id="lang-ja" aria-pressed="true">日本語</button><button id="lang-en" aria-pressed="false">EN</button></div>
  </div>
</header>

<div class="steps help" id="steps"></div>

<div class="layout" id="layout">
  <div class="stage" id="stage">
    <svg id="cld" role="img" aria-label="因果ループ図"></svg>
    <div class="tbar">
      <div class="tleft">
        <div class="seg" role="group" id="modeSeg">
          <button data-mode="all" data-ja="全体" data-en="All"></button>
          <button data-mode="focus" data-ja="1つの変数" data-en="One variable"></button>
          <button data-mode="loop" data-ja="ループ" data-en="Loop"></button>
        </div>
        <div class="seg" role="group" id="layerSeg" hidden></div>
        <select id="lenSel" class="mini adv" aria-label="ループの長さ"></select>
        <select id="sizeSel" class="mini adv" aria-label="変数の大きさ"></select>
        <select id="arrSel" class="mini adv" aria-label="表示する矢印"></select>
        <button class="btn icb ic-star" id="flBtn" aria-pressed="false" data-ja="注目ループ" data-en="Key loops"></button>
        <button class="btn icb ic-loop" id="archBtn" aria-pressed="false" data-ja="型で見る" data-en="Archetype view" hidden></button>
        <button class="btn icb ic-ice" id="iceBtn" aria-pressed="false" data-ja="氷山で見る" data-en="Iceberg view"></button>
      </div>
      <div class="tright"><div class="seg" role="group" id="dirSeg" hidden></div><span id="focAdd" hidden style="display:inline-flex;gap:6px"><button class="btn primary icb ic-plus" id="addCause" data-ja="原因を足す" data-en="Add cause"></button><button class="btn primary icb ic-plus" id="addEffect" data-ja="影響を足す" data-en="Add effect"></button></span><button class="btn icb ic-side" id="sideBtn" aria-pressed="false" data-ja="図を大きく" data-en="Bigger"></button></div>
      <div class="tright" id="editBar" hidden>
        <button class="btn primary" id="varBtn" data-ja="＋ 変数" data-en="+ Variable"></button>
        <button class="btn primary" id="addBtn" aria-pressed="false" data-ja="＋ 矢印" data-en="+ Arrow"></button>
      </div>
    </div>
    <div class="banner" id="banner"></div>
    <div class="cleg" id="cleg" hidden></div>
    <div class="epop" id="epop" hidden role="dialog" aria-label="矢印の設定"></div>
    <div class="zoom">
      <button id="zin" aria-label="拡大">＋</button>
      <button id="zout" aria-label="縮小">－</button>
      <button id="zfit" aria-label="全体を表示" title="全体を表示"><i class="ic ic-fit"></i></button>
      <button id="zfull" aria-label="全画面" title="全画面"><i class="ic ic-full"></i></button>
    </div>
  </div>

  <aside>
    <div class="card">
      <select id="pick" aria-label="変数を選ぶ"></select>
      <div id="info"></div>
    </div>

    <div class="card adv" id="edgeCard" hidden>
      <details id="edgeDet" open><summary style="cursor:pointer;font-weight:700;font-size:.95rem" id="edgeHead"></summary>
        <p class="empty help" style="font-size:.76rem;margin:6px 0" id="edgeNote"></p>
        <div id="edgeList" class="elist"></div>
      </details>
    </div>

    <div class="card" id="archCard" hidden>
      <h2 id="archHead"></h2>
      <p class="empty" id="archNote" style="font-size:.8rem;margin:-2px 0 8px"></p>
      <div id="archList"></div>
      <div id="archRoles"></div>
    </div>

    <div class="card rd" id="rdCard" hidden>
      <h2 data-ja="ループを読む（1歩ずつ）" data-en="Read the loop step by step"></h2>
      <label style="font-size:.8rem;color:var(--muted);display:block"><span data-ja="起点（ここが増えたとしたら？）" data-en="Start (suppose this increases)"></span>
        <select id="rdStart" style="margin-top:4px"></select></label>
      <div id="rdSteps"></div>
    </div>

    <div class="card" id="flCard" hidden>
      <h2 data-ja="注目ループ（構造から見た候補）" data-en="Key loops (structural candidates)"></h2>
      <div class="seg" role="group" id="flCrit" style="display:flex"></div>
      <div id="flTargetWrap" style="margin-top:8px" hidden><select id="flTarget"></select></div>
      <div class="row adv" style="margin-top:8px;align-items:center;gap:10px">
        <label style="font-size:.8rem;color:var(--muted)"><span data-ja="本数" data-en="Number"></span> <select id="flN" class="mini"><option>3</option><option selected>5</option><option>8</option><option>10</option></select></label>
        <label style="font-size:.8rem;color:var(--muted)"><span data-ja="長さ" data-en="Length"></span> <select id="flLen" class="mini"><option value="3">〜3</option><option value="4" selected>〜4</option></select></label>
      </div>
      <p class="empty" id="flNote" style="font-size:.76rem;margin:8px 0 6px"></p>
      <ol class="loops" id="flList" style="padding:0"></ol>
    </div>

    <div class="card adv" id="rankCard" hidden>
      <h2 id="rankHead"></h2>
      <p class="empty help" id="rankNote" style="margin:-4px 0 8px;font-size:.8rem"></p>
      <ol class="rank" id="rankList"></ol>
    </div>

    <div class="card" id="loopCard">
      <h2 id="loopHead"></h2>
      <div id="loopList"></div>
    </div>

    <div id="dockBar" class="dockbar" role="tablist" aria-label="道具"></div>
    <div id="dock">
    <div class="card dk" id="aiCard" data-dk="ai" hidden>
      <h2 data-ja="AIに聞く（聞く人を選ぶ）" data-en="Ask AI (who is asking?)"></h2>

        <button data-r="student" data-ja="学生" data-en="Student"></button><button data-r="expert" data-ja="専門家" data-en="Expert"></button><button data-r="facil" data-ja="進行役" data-en="Facilitator"></button>
      </div>
      <p class="empty help" id="aiRoleNote" style="font-size:.78rem;margin:6px 0 0"></p>
      <div class="qbtns" id="aiQs"></div>
      <div class="aifree"><textarea id="aiFree" rows="1"></textarea><button class="btn primary" id="aiSend" data-ja="聞く" data-en="Ask"></button></div>
      <div class="aiout" id="aiOut" aria-live="polite"></div>
      <div class="row" style="margin-top:6px"><button class="btn" id="aiStop" hidden data-ja="止める" data-en="Stop"></button><button class="btn" id="aiClear" hidden data-ja="会話を消す" data-en="Clear"></button></div>
      <p class="empty" id="aiNote" style="font-size:.78rem;margin-top:6px"></p>
    </div>

    
    <div class="card dk" id="lgCard" data-dk="lg">
      <details class="lgd" open><summary class="icb ic-info" data-ja="記号の見かた（＋ － R B）" data-en="How to read the symbols"></summary><div class="legend" id="legend" style="margin-top:8px"></div></details>
    </div>

<p class="about help" style="margin:0 2px" data-ja="データ：Food Systems Countdown Initiative（Schneider ほか 2025, Nature Food 6:105–116）の専門家評価による直接の因果関係321本。＋／－と追加した矢印は、このブラウザにだけ保存されます。わかりやすい名前と説明は非公式です。" data-en="Data: 321 expert-assessed direct causal links from the Food Systems Countdown Initiative (Schneider et al. 2025, Nature Food 6:105–116). Your +/－ and added arrows are saved only in this browser. Plain names are unofficial."></p>
    <div class="card dk" id="setCard" data-dk="set">
      <details class="set" open>

: "15歳以上の人に占める％", "dir": -1, "ex": "", "refs": [["Global Diet Quality Project (2022). Measuring what the world eats: Insights from a new approach. Gallup / Harvard T.H. Chan School of Public Health.", "https://www.dietquality.org/"]]}, {"en": "NCD-Protect", "ja": "NCD-Protect（NCD予防食品スコア）", "t": "d", "pja": "病気を防ぐ食品の摂取", "pen": "Intake of health-protective foods", "desc": "全粒穀物・豆類・野菜・果物など、生活習慣病を防ぐ食品をどれだけ食べているか（スコア）。", "url": "https://www.dietquality.org/", "src": "Global Diet Quality Project (Gallup World Poll)", "how": "食事質問票（DQQ）の答えから、病気を防ぐとされる9種類の食品群（全粒穀物、豆類、ナッツ・種、オレンジ色の野菜、濃い緑の葉野菜、その他の野菜、ビタミンAの多い果物、かんきつ類、その他の果物）を、きのう食べていればそれぞれ1点として0〜9点で採点し、国の平均点を出します。", "unit": "点（0〜9点）", "dir": 1, "ex": "", "refs": [["Global Diet Quality Project (2022). Measuring what the world eats: Insights from a new approach. Gallup / Harvard T.H. Chan School of Public Health.", "https://www.dietquality.org/"]]}, {"en": "NCD-Risk", "ja": "NCD-Risk（NCDリスク食品スコア）", "t": "d", "pja": "病気のリスクを高める食品の摂取", "pen": "Intake of health-risk foods", "desc": "加工肉・甘い飲み物・揚げ菓子など、生活習慣病のリスクを高める食品をどれだけ食べているか（スコア）。", "url": "https://www.dietquality.org/", "src": "Global Diet Quality Project (Gallup World Poll)", "how": "食事質問票（DQQ）の答えから、生活習慣病のリスクを高めるとされる食品群（甘い飲み物、焼き菓子、その他の甘いお菓子、加工肉、赤身肉、揚げ物、ファストフード・即席めん、塩味のスナック菓子など）を、きのう食べていれば加点し、0〜9点で採点した国の平均点です。一部の項目は重みづけされています。", "unit": "点（0〜9点）", "dir": -1, "ex": "", "refs": [["Global Diet Quality Project (2022). Measuring what the world eats: Insights from a new approach. Gallup / Harvard T.H. Chan School of Public Health.", "https://www.dietquality.org/"]]}, {"en": "Soft drink consumption", "ja": "清涼飲料の消費", "t": "d", "pja": "甘い飲み物を飲む人の割合", "pen": "People drinking sugary drinks", "desc": "きのう炭酸飲料などの甘い清涼飲料を飲んだ人の割合。", "url": "https://www.dietquality.org/", "src": "Global Diet Quality Project (Gallup World Poll)", "how": "食事質問票（DQQ）で、きのう甘い清涼飲料（炭酸飲料、砂糖入りのジュースなど）を飲んだと答えた15歳以上の人の割合です。飲んだ量ではなく、飲んだ人の割合です。", "unit": "15歳以上の人に占める％", "dir": -1, "ex": "", "refs": [["Global Diet Quality Project (2022). Measuring what the world eats: Insights from a new approach. Gallup / Harvard T.H. Chan School of Public Health.", "https://www.dietquality.org/"]]}, {"en": "Food system emissions", "ja": "フードシステムの温室効果ガス排出量", "t": "e", "pja": "食料にかかわる温室効果ガス", "pen": "Food-related greenhouse gases", "desc": "農業・土地利用・加工・輸送など、フードシステム全体から出る温室効果ガスの量。", "url": "https://www.fao.org/faostat/en/#data/GT", "src": "FAOSTAT", "how": "FAOSTATの推計で、田畑や家畜から出るガス、森林などを農地に変えることによる排出、肥料の製造、食品の加工・包装・輸送・小売、家庭での調理、廃棄物まで、食べ物にかかわる温室効果ガスをCO2に換算して合計します。", "unit": "千トン（CO2換算）", "dir": -1, "ex": "", "refs": [["Tubiello, F.N. et al. (2021). Greenhouse gas emissions from food systems: building the evidence base. Environmental Research Letters 16, 065007.", "https://doi.org/10.1088/1748-9326/ac018e"], ["FAO. FAOSTAT（データベースと方法の解説）", "https://www.fao.org/faostat/en/"]]}, {"en": "Emissions intensity", "ja": "排出原単位", "t": "e", "pja": "食料あたりの温室効果ガス", "pen": "Emissions per unit of food", "desc": "農産物を一定量つくるときに出る温室効果ガスの量。", "url": "https://www.fao.org/faostat/en/#data/EI", "src": "FAOSTAT", "how": "農産物を1kg生産するときに、生産の段階で出る温室効果ガスの量です。FSCIでは牛肉・穀物・牛乳・米などの品目ごとに見ています。", "unit": "kg（CO2換算）／生産物1kg", "dir": -1, "ex": "", "refs": [["FAO. FAOSTAT（データベースと方法の解説）", "https://www.fao.org/faostat/en/"]]}, {"en": "Yield", "ja": "単収", "t": "e", "pja": "畑でとれる量（単収）", "pen": "Crop yields", "desc": "一定の面積からどれだけ作物が収穫できるか。", "url": "https://www.fao.org/faostat/en/#data/QCL", "src": "FAOSTAT", "how": "一定の面積や家畜1頭あたりで、どれだけ生産できるかです。穀物・果物・野菜は1ヘクタールあたりの収穫量、牛乳や牛肉は1頭あたりの量で計算します。", "unit": "トン／ヘクタール（作物）、kg／頭（家畜）", "dir": 1, "ex": "", "refs": [["FAO. FAOSTAT（データベースと方法の解説）", "https://www.fao.org/faostat/en/"]]}, {"en": "Cropland change", "ja": "農地面積の変化", "t": "e", "pja": "農地の広がり", "pen": "Cropland expansion", "desc": "農地面積の増減。森林などを切り開いて農地にすることも含む。", "url": "https://www.fao.org/faostat/en/#data/RL", "src": "FAOSTAT", "how": "農地の面積が前の年から何％増えたか（減ったか）を計算し、過去5年分を平均します。プラスは農地の拡大で、森林や草地を切り開いていることが多いため、低いほうが望ましいとされています。", "unit": "％（年あたりの変化率）", "dir": const TET_SRC="\u003c!DOCTYPE html>\n\u003chtml lang=\"ja\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>TET ワークシート（記入と集計）\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap\" rel=\"stylesheet\">\n\u003cscript src=\"https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js\">\u003c/script>\n\u003cstyle>\n/* TET ワークシート（1枚版）\n   ・変数は CONFIG.variables に並べるだけ（role:'x' は上、role:'y' は下に並ぶ）\n   ・?config=study.json で別の調査にも使える\n   ・?lock=1 で参加者用（設定・集計ボタンを隠す）\n   ・?mode=summary で集計画面から開く（研究者用）                                   */\n:root{--paper:#F4F5FB;--ink:#23263A;--ink-2:#555B73;--ink-3:#858BA3;--rule:#E2E4F0;\n  --x:#5B5BD6;--x-soft:#ECECFD;--y:#E8790C;--y-soft:#FFF1DC;--draw:#FF8A3D;--ok:#14A37F;--focus:#1C6FD1}\n*{box-sizing:border-box}\nhtml,body{margin:0;height:100%;background:var(--paper);color:var(--ink);overflow:hidden}\nbody{font-family:'M PLUS Rounded 1c','Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo',sans-serif;font-size:14px;font-feature-settings:\"palt\" 1}\nbutton,input,select{font:inherit;color:inherit}\n:focus-visible{outline:3px solid var(--focus);outline-offset:2px}\n.app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px;\n  padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(8px + env(safe-area-inset-bottom,0px))}\nheader{display:flex;align-items:center;gap:6px 9px;flex-wrap:wrap}\nh1{font-size:16px;font-weight:900;margin:0 4px 0 0}\n.f{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2)}\n.f input,.f select{border:1px solid var(--rule);border-radius:8px;padding:5px 8px;background:#fff}\n.posw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:2px 10px 2px 6px;font-size:12px;font-weight:700;color:var(--ink-2)}\n.posw svg{display:block}\n.posw.hi{border-color:var(--ok);color:var(--ok)} .posw.lo{border-color:var(--y);color:#8A5600}\n.sp{flex:1}\n.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;cursor:pointer;font-size:12.5px}\n.btn.g{background:#fff;color:var(--ink)}\n.card{background:#fff;border:1px solid var(--rule);border-radius:14px;position:relative;min-height:0}\n#chart{position:absolute;inset:0}\n#chart svg{width:100%;height:100%;display:block;touch-action:none}\nfooter{display:flex;gap:4px 16px;align-items:center;font-size:12px;color:var(--ink-3);flex-wrap:wrap;line-height:1.5}\nfooter .hint2{flex:1 1 320px;min-width:0;overflow-wrap:anywhere}\nfooter #prog{white-space:nowrap}\nfooter .k{display:inline-flex;align-items:center;gap:5px}\n.sw{display:inline-block;width:20px;border-top:3px solid var(--ink)} .sw.d{border-top:3px dashed var(--draw)}\n\n/* コメント入力 */\n#pop{position:absolute;display:none;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:5;width:250px}\n#pop .t{font-size:12px;font-weight:700;margin-bottom:4px}\n#pop input{width:100%;border:1px solid var(--rule);border-radius:6px;padding:6px 8px}\n#pop .r{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}\n#pop .r button{border:1px solid var(--rule);background:#fff;border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12px}\n#pop .r .ok{background:var(--ink);color:#fff;border-color:var(--ink)}\n\n/* SVG */\n.ax text{font-size:11px;fill:var(--ink-3);font-family:inherit}\n.ax path,.ax line{stroke:var(--rule)}\n.lt{font-family:inherit}\n.hl{fill:none;stroke:var(--ink);stroke-width:2.6}\n.hd{fill:var(--ink);stroke:#fff;stroke-width:1.5;cursor:pointer}\n.fl{fill:none;s /\n:root{--pop:#5B5BD6;--pop-d:#3F3FB0;--sun:#FFC93C;--mint:#14A37F;--coral:#FF6B6B}\nbody{font-size:15px}\nheader{background:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 2px 0 #E2E4F0,0 6px 18px rgba(35,38,58,.06)}\nh1{font-size:18px;font-weight:800;color:var(--pop-d)}\n.card{border-radius:20px !important;box-shadow:0 2px 0 #E2E4F0,0 8px 24px rgba(35,38,58,.06) !important;border:0 !important}\n.btn,.uiseg button{border-radius:12px !important;font-weight:800 !important}\n.btn{border:2px solid #E2E4F0 !important;border-bottom-width:4px !important;background:#fff !important;color:var(--ink) !important;transition:transform .08s,border-bottom-width .08s}\n.btn:active{transform:translateY(2px);border-bottom-width:2px !important}\n.btn:not(.g){background:var(--pop) !important;border-color:var(--pop-d) !important;color:#fff !important}\n#sj{background:var(--mint) !important;border-color:#0C7A5E !important}\n.uiseg{border:2px solid #E2E4F0 !important;border-radius:14px !important}\n.uiseg button[aria-pressed=\"true\"]{background:var(--pop) !important}\n.f input,.f select{border-radius:10px !important;border:2px solid #E2E4F0 !important;background:#fff}\nfooter{font-size:13px}\n#tpl,#arP,#pop{border-radius:18px !important;border-width:3px !important}\n#tpl .sg button{border-radius:14px !important;border-width:2px !important;border-bottom-width:4px !important;transition:transform .08s}\n#tpl .sg button:active{transform:translateY(2px)}\n#tpl .sg button[aria-pressed=\"true\"]{border-color:var(--pop) !important;background:#F1F1FF !important}\n#tpl .ok,#pop .ok{background:var(--pop) !important;border-radius:12px !important}\n#hp .hc{border-radius:20px}\n/* 点を置いたとき・描き終えたときの小さな動き */\n@keyframes popIn{0%{transform:scale(.2)}60%{transform:scale(1.35)}100%{transform:scale(1)}}\ncircle.fp.new{transform-box:fill-box;transform-origin:center;animation:popIn .35s ease-out}\n@keyframes stamp{0%{transform:scale(.3) rotate(-25deg);opacity:0}70%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}\n.cele{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:300;pointer-events:none}\n.cele div{background:#fff;border:3px solid var(--mint);color:#0C7A5E;font-weight:800;font-size:20px;padding:14px 22px;border-radius:20px;box-shadow:0 10px 30px rgba(20,163,127,.25);animation:stamp .45s ease-out}\n@media (prefers-reduced-motion:reduce){circle.fp.new,.cele div{animation:none}}\n\n.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;flex:none}\n.icb::before{content:'';display:inline-block;width:1.1em;height:1.1em;margin-right:.35em;vertical-align:-.18em;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}\n.ic-chat{--m:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\u003cpath d='M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z'/>\u003c/svg>\")}\n.ic-info{--m:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\u003ccircle cx='12' cy='12' r='9'/>\u003cpath d='M12 11v6M12 7.5v.5'/>\u003c/svg>\")}\n.ic-slider{--m:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\u003cpath d='M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1'/>\u003ccircle cx='15' cy='6' r='2'/>\u003ccircle cx='9' cy='12' r='2'/>\u003ccircle cx='17' cy='18' r='2'/>\u003c/svg>\")}\n.ic-share{--m:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' strok ml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\u003cpath d='M12 5v14M5 12h14'/>\u003c/svg>\")}\n.ic-pen{--m:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\u003cpath d='M4 20l4-1 11-11-3-3L5 16z'/>\u003c/svg>\")}\n.ic-bulb{--m:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\u003cpath d='M9 18h6M10 21h4'/>\u003cpath d='M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z'/>\u003c/svg>\")}\n.ic-eye{--m:url(\"data:image/svg+xml;utf8,\u003csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>\u003cpath d='M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z'/>\u003ccircle cx='12' cy='12' r='3'/>\u003c/svg>\")}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"app\" id=\"sheetApp\">\n  \u003cheader>\n    \u003ch1 id=\"title\">\u003c/h1>\n    \u003clabel class=\"f\" title=\"名前の代わりの番号。保存ファイル名と集計で使います\">参加者番号\u003cinput id=\"pid\" size=\"5\" placeholder=\"A-012\">\u003c/label>\n    \u003clabel class=\"f\" id=\"valWrap\" title=\"食事記録ツールなどで測った自分の値。目標と比べて「以上／未満」を記録し、集計で立ち位置別に比べます\">\u003cspan id=\"valLbl\">\u003c/span>\u003cinput id=\"val\" type=\"number\" min=\"0\" style=\"width:66px\">\u003c/label>\n    \u003cspan class=\"posw adv\" id=\"pos\" role=\"status\" aria-live=\"polite\">\u003c/span>\n    \u003clabel class=\"f\" id=\"grpWrap\" title=\"比べる行動データ\">\u003cselect id=\"grp\">\u003c/select>\u003c/label>\n    \u003cspan class=\"sp\">\u003c/span>\n    \u003cspan class=\"uiseg\" role=\"group\" aria-label=\"表示\">\u003cbutton id=\"uiS\">かんたん\u003c/button>\u003cbutton id=\"uiA\">くわしく\u003c/button>\u003c/span>\n    \u003clabel class=\"f adv\">将来\u003cselect id=\"hz\">\u003c/select>\u003c/label>\n    \u003clabel class=\"f adv\">間隔\u003cselect id=\"iv\">\u003coption value=\"5\">5年\u003c/option>\u003coption value=\"1\">1年\u003c/option>\u003c/select>\u003c/label>\n    \u003cbutton class=\"btn g\" id=\"arB\" title=\"システムの原型（型）と、変数の役割\">型\u003c/button>\n    \u003cbutton class=\"btn g adv\" id=\"toSum\">集計\u003c/button>\n    \u003cbutton class=\"btn g adv\" id=\"st\">設定\u003c/button>\n    \u003cbutton class=\"btn\" id=\"sj\">保存\u003c/button>\n    \u003cbutton class=\"btn g adv\" id=\"sc\">CSV\u003c/button>\n    \u003cbutton class=\"btn g adv\" id=\"ld\">読込\u003c/button>\n    \u003cbutton class=\"btn g\" id=\"rs\">やり直す\u003c/button>\n  \u003c/header>\n  \u003csection class=\"card\">\u003cdiv id=\"chart\">\u003c/div>\n    \u003cdiv id=\"tpl\" role=\"dialog\" aria-labelledby=\"tplT\">\u003cdiv class=\"th\">\u003cb id=\"tplT\">\u003c/b>\u003cspan style=\"font-size:10.5px;color:var(--ink-3)\">⠿ ドラッグで移動\u003c/span>\u003cbutton id=\"tplX\" aria-label=\"閉じる\">×\u003c/button>\u003c/div>\n      \u003cdiv class=\"sg\" id=\"tplGrid\">\u003c/div>\u003cdiv class=\"desc\" id=\"tplD\">\u003c/div>\u003cbutton type=\"button\" id=\"tplMore\">▸ 数字で細かく調整する\u003c/button>\u003cdiv class=\"tf\" id=\"tplF\">\u003c/div>\n      \u003cdiv class=\"r\">\u003cbutton id=\"tplCancel\">やめる\u003c/button>\u003cbutton class=\"ok\" id=\"tplOk\">この形で描く\u003c/button>\u003c/div>\u003c/div>\n    \u003cdiv id=\"arP\" role=\"dialog\" aria-label=\"システムの原型\">\u003c/div>\n    \u003cdiv id=\"pop\" role=\"dialog\" aria-label=\"コメント\">\u003cdiv class=\"t\" id=\"popT\">\u003c/div>\u003cinput id=\"popIn\" placeholder=\"なぜ？ 何が起きる？\">\u003cdiv class=\"r\">\u003cbutton id=\"popDel\">点を消す\u003c/button>\u003cbutton id=\"popX\">閉じる\u003c/button>\u003cbutton class=\"ok\" id=\"popOk\">OK\u003c/button>\u003c/div>\u003c/div>\n  \u003c/section>\n  \u003cfooter>\n    \u003cspan class=\"k\">\u003ci class=\"sw\">\u003c/i>データ\u003c/span>\u003cspan class=\"k\">\u003ci class=\"sw d\">\u003c/i>あなたの将来\u003c/span>\n    \u003cspan class=\"hint2 adv\">クリック：点を置く ／ 点をクリック：コメント ／ ドラッグ：上下に調整 ／ ▾で経路を閉じる（描かなくてOK）／ 右の ○：効く順\u003c/span>\u003cspan class=\"hint2 sim\">クリックで点を置く ／ 点をドラッグで上下に動かす ／ 点をクリックでコメント\u003c/span>\u003cspan id=\"prog\" class=\"adv\">\u003c/span>\n  \u003c/footer>\n\u003c/div>\n\u003cdiv class=\"app sum\" id=\"sumApp\" hidden>\n  \u003cheader>\n    \u003ch1 id=\"sm_title\">TET 集計\u003c/h1>\n    \u003cspan class=\"n\" id=\"sm_count\">0人\u003c/span>\n    \u003clabel class=\"f\">対象\u003cselect id=\"sm_flt\">\u003c/select>\u003c/label>\n    \u003clabel class=\"f\">表示\u003cselect id=\"sm_mode\" style=\"max-width:150px\">\u003coption value=\"fan\">中心と幅\u003c/option>\u003coption value=\"both\">中心と幅＋個人の線\u003c/option>\u003coption value=\"lines\">個人の線\u003c/option>\u003c/select>\u003c/label>\n    \u003cspan class=\"sp\">\u003c/span>\n    \u003cbutton class=\"btn g\" id=\"sm_back\">← 記入\u003c/button>\n    \u003cbutton class=\"btn\" id=\"sm_add\" title=\"tet_tool.html で保存した回答（JSON・CSV、複数可）\">回答を読込\u003c/button>\n    \u003cbutton class=\"btn g\" id=\"sm_self\" title=\"この端末の記入内容を加える\">＋自分\u003c/button>\n    \u003cbutton class=\"btn g\" id=\"sm_demo\">サンプル\u003c/button>\n    \u003cbutton class=\"btn g\" id=\"sm_csv\">CSV\u003c/button>\n    \u003cbutton class=\"btn g\" id=\"sm_svg\">図\u003c/button>\n    \u003cbutton class=\"btn g\" id=\"sm_clr\">クリア\u003c/button>\n  \u003c/header>\n  \u003cmain>\n    \u003csection class=\"card\">\u003cdiv id=\"sm_chart\">\u003c/div>\n      \u003cdiv class=\"drop\" id=\"sm_drop\">\u003cb>回答ファイルをここにドラッグ\u003c/b>\u003cspan>tet_sheet.html で保存した JSON・CSV（複数まとめて可）\u003c/span>\u003cbutton class=\"btn\" id=\"sm_add2\">ファイルを選ぶ\u003c/button>\u003cbutton class=\"btn g\" id=\"sm_demo2\">サンプルで試す\u003c/button>\u003c/div>\n    \u003c/section>\n    \u003caside class=\"card\">\n      \u003cdiv class=\"tabs\" role=\"tablist\">\u003cbutton role=\"tab\" data-t=\"types\" aria-selected=\"true\">型\u003c/button>\u003cbutton role=\"tab\" data-t=\"rank\">順位\u003c/button>\u003cbutton role=\"tab\" data-t=\"notes\">コメント\u003c/button>\u003cbutton role=\"tab\" data-t=\"people\">参加者\u003c/button>\u003c/div>\n      \u003cdiv class=\"pane\" id=\"sm_pane\">\u003c/div>\n    \u003c/aside>\n  \u003c/main>\n\u003c/div>\n\u003cinput type=\"file\" id=\"sm_files\" accept=\".json,.csv\" multiple hidden>\n\u003cdiv class=\"toast\" id=\"sm_toast\">\u003c/div>\n\u003cdiv id=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mTitle\">\u003cdiv class=\"mbox\">\n  \u003cdiv class=\"mhead\">\u003ch2 id=\"mTitle\">設定（研究者用）\u003c/h2>\u003cbutton class=\"btn g\" id=\"mClose\">閉じる\u003c/button>\u003c/div>\n  \u003cdiv class=\"mbody\">\n    \u003cdiv class=\"mrow\">\n      \u003clabel>タイトル\u003cinput id=\"cTitle\">\u003c/label>\n      \u003clabel>自分の値の名前\u003cinput id=\"cOwnL\">\u003c/label>\n      \u003clabel>目標値\u003cinput id=\"cOwnV\" type=\"number\">\u003c/label>\n      \u003clabel>単位\u003cinput id=\"cOwnU\">\u003c/label>\n      \u003clabel>「いま」の年\u003cinput id=\"cNow\" type=\"number\">\u003c/label>\n      \u003clabel>システムの原型（初期値）\u003cselect id=\"cArch\">\u003coption value=\"\">（使わない）\u003c/option>\u003c/select>\u003c/label>\n      \u003clabel style=\"flex-direction:row;align-items:center;gap:6px\">\u003cinput type=\"checkbox\" id=\"cArchLock\" style=\"width:auto\">参加者が型を変えられないようにする\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"hint\" style=\"font-size:12px;color:var(--ink-3)\">過去のデータは「年,値」を1行ずつ（Excelから貼り付け可）。男女などの区分があるときは「年,値,区分」。CSVファイルも読み込めます。\u003c/div>\n    \u003cdiv id=\"mVars\">\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"mfoot\">\u003cbutton class=\"btn\" id=\"mApply\">適用\u003c/button>\u003cbutton class=\"btn g\" id=\"mExport\">設定を書き出す（JSON）\u003c/button>\u003cbutton class=\"btn g\" id=\"mDefault\">初期設定に戻す\u003c/button>\u003cspan class=\"err\" id=\"mErr\">\u003c/span>\u003c/div>\n\u003c/div>\u003c/div>\n\u003cdiv id=\"hp\" role=\"dialog\" aria-modal=\"true\">\u003cdiv class=\"hc\" id=\"hpc\">\u003c/div>\u003c/div>\n\u003cinput type=\"file\" id=\"csvIn\" accept=\".csv,.txt,.tsv\" hidden>\n\u003cinput type=\"file\" id=\"fileIn\" accept=\".json\" hidden>\n\u003cdiv class=\"toast\" id=\"toast\">\u003c/div>\n\u003c!--TET_PRESET-->\n\u003cscript>\nlet CONFIG = {\n  title:'野菜を食べる未来を描く', studyId:'foodlifestyle',\n  own:{label:'野菜 g/日', value:350, unit:'g'},\n  nowYear:2024, horizons:[2030,2040,2050], horizon:2050, interval:5,\n  variables:[\n    {id:'x1',role:'x',pathway:'Top-down',name:'社会・制度',unit:'2019=100',domain:[40,160],src:'食育白書',\n     history:[[2019,100],[2020,92.3],[2021,105.6],[2022,113.2],[2023,92.3],[2024,92.7]]},\n    {id:'x2',role:'x',pathway:'Bottom-up',name:'人々の関心',unit:'2019=50',domain:[0,100],src:'Google トレンド',\n     history:[[2019,50],[2020,70.8],[2021,78.1],[2022,79.1],[2023,76.8],[2024,69.8]]},\n    {id:'x3',role:'x',pathway:'Affordability',name:'買いやすさ',unit:'2019=100',domain:[40,160],src:'所得÷野菜CPI',\n     history:[[2019,100],[2020,100.4],[2021,119.6],[2022,114.6],[2023,99.6],[2024,88.1]]},\n    {id:'y',role:'y',pathway:'Variable of interest',name:'350g以上の人',unit:'%',domain:[0,50],src:'（統計名を記入）',\n     groups:{'女性':[[2014,29.2],[2015,31.4],[2016,27.2],[2017,29.0],[2018,27.0],[2019,26.5],[2022,24.8],[2023,21.9],[2024,22.0]],\n             '男性':[[2014,33.2],[2015,33.7],[2016,29.3],[2017,32.3],[2018,30.7],[2019,30.1],[2022,28.9],[2023,25.2],[2024,26.2]]}}\n  ]\n};\nconst SCHEMA='tet-sheet-1.0', qs=new URLSearchParams(location.search);\nlet S, STORE, VARS;\nconst $=id=>document.getElementById(id);\nconst esc=s=>String(s??'').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2000)};\nconst fresh=()=>{const lanes={};VARS.forEach(v=>lanes[v.id]={points:{},notes:{}});const g=VARS.find(v=>v.groups);\n  return {schema:SCHEMA,studyId:CONFIG.studyId,participant:{id:'',value:'',group:g?Object.keys(g.groups)[0]:''},horizon:CONFIG.horizon,interval:CONFIG.interval,lanes,rank:[],collapsed:defaultCollapsed(),startedAt:new Date().toISOString(),log:[]}};\nconst defaultCollapsed=()=>{ const c={}; const xs=VARS.filter(v=>v.role==='x'); xs.forEach((v,i)=>{ if(CONFIG.openX ? !CONFIG.openX.includes(v.id) : i>0) c[v.id]=true; }); return c; };\nconst save=()=>{try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}};\nconst log=(type,d)=>{S.log.push({t:new Date().toISOString(),type,...(d||{})});save()};\nconst hist=v=>(v.groups?v.groups[S.participant.group]:v.history).map(([year,value])=>({year,value}));\nconst fYears=()=>{const a=[];for(let y=CONFIG.nowYear+1;y\u003c=S.horizon;y+=S.interval)a.push(y);if(a.at(-1)!==S.horizon)a.push(S.horizon);return a};\nconst nPts=id=>fYears().filter(y=>S.lanes[id].points[y]!=null).length;\nconst hasFutureNote=id=>Object.keys(S.lanes[id].notes).some(y=>+y>CONFIG.nowYear&&S.lanes[id].notes[y].trim());\nconst done=id=>nPts(id)===fYears().length&&hasFutureNote(id);\nconst isCol=id=>!!(S.collapsed&&S.collapsed[id]) && (VARS.find(v=>v.id===id)||{}).role==='x';\nfunction toggleCol(id){ S.collapsed=S.collapsed||{}; S.collapsed[id]=!S.collapsed[id]; log('collapse',{v:id,collapsed:S.collapsed[id]}); save(); if(typeof closeTpl==='function') closeTpl(); draw(); }\nconst pos=()=>S.participant.value===''?null:(+S.participant.value>=CONFIG.own.value?'hi':'lo');\n\n/* ---------- ヘッダー ---------- */\nfunction header(){\n  $('title').textContent=CONFIG.title; $('valLbl').textContent='あなたの'+CONFIG.own.label;\n  $('pid').value=S.participant.id; $('val').value=S.participant.value;\n  posWidget();\n  const g=VARS.find(v=>v.groups); $('grpWrap').style.display=g?'':'none';\n  if(g){$('grp').innerHTML=Object.keys(g.groups).map(k=>`\u003coption ${k===S.participant.group?'selected':''}>${esc(k)}\u003c/option>`).join('')}\n  $('hz').innerHTML=CONFIG.horizons.map(h=>`\u003coption ${h===S.horizon?'selected':''}>${h}\u003c/option>`).join('');\n  $('iv').value=String(S.interval);\n  const d=VARS.filter(v=>done(v.id)).length, X=VARS.filter(v=>v.role==='x').length;\n  const op=VARS.filter(v=>!isCol(v.id)), dO=op.filter(v=>done(v.id)).length;\n  $('prog').textContent=`完了 ${dO}/${op.length}（開いている変数）　順位 ${S.rank.length}/${X}`;\n}\n$('title').onclick=()=>openSettings(); $('st').onclick=()=>openSettings();\n$('pid').oninput=e=>{S.participant.id=e.target.value.trim();save()};\n$('val').oninput=e=>{S.participant.value=e.target.value;save();header();clearTimeout(window.__pv);window.__pv=setTimeout(draw,300)};\n$('val').onchange=()=>log('own',{value:S.participant.value});\n$('grp').onchange=e=>{const g=VARS.find(v=>v.groups);if(nPts(g.id)&&!confirm('線を消して切り替えますか？')){header();return}\n  S.participant.group=e.target.value;S.lanes[g.id]={points:{},notes:{}};log('group',{value:e.target.value});draw()};\n$('hz').onchange=e=>{S.horizon=+e.target.value;log('horizon',{value:S.horizon});draw()};\n$('iv').onchange=e=>{S.interval=+e.target.value;log('interval',{value:S.interval});draw()};\n\n/* 自分の位置：色だけに頼らず「バーの位置・印・文字」で示す */\nfunction posWidget(){\n  const el=$('pos'), p=pos(), T=CONFIG.own.value, U=CONFIG.own.unit, mx=Math.max(T*1.7, +S.participant.value||0), v=+S.participant.value||0;\n  const W=64,H=14, tx=T/mx*W, fx=Math.min(v,mx)/mx*W;\n  const bar=`\u003csvg width=\"${W}\" height=\"${H+6}\" viewBox=\"0 0 ${W} ${H+6}\" aria-hidden=\"true\">\n    \u003cdefs>\u003cpattern id=\"hatch\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\">\u003crect width=\"5\" height=\"5\" fill=\"#FFF1DC\"/>\u003cline x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"#E8790C\" stroke-width=\"2.4\"/>\u003c/pattern>\u003c/defs>\n    \u003crect x=\"0\" y=\"4\" width=\"${W}\" height=\"${H-4}\" rx=\"5\" fill=\"#E5EAEC\"/>\n    ${p?`\u003crect x=\"0\" y=\"4\" width=\"${fx}\" height=\"${H-4}\" rx=\"5\" fill=\"${p==='hi'?'#14A37F':'url(#hatch)'}\" stroke=\"${p==='hi'?'#14A37F':'#E8790C'}\"/>`:''}\n    \u003cline x1=\"${tx}\" x2=\"${tx}\" y1=\"0\" y2=\"${H+4}\" stroke=\"#23263A\" stroke-width=\"2\"/>\u003c/svg>`;\n  el.className='posw adv '+(p||'');\n  const txt = !p ? `目標 ${T}${U}（線）` : (p==='hi' ? `✓ 目標以上 +${Math.round(v-T)}${U}` : `△ あと${Math.round(T-v)}${U}で目標`);\n  el.innerHTML=bar+`\u003cspan>${txt}\u003c/span>`;\n  el.setAttribute('aria-label', !p?`目標は${T}${U}`:`あなたは${v}${U}。${p==='hi'?'目標以上':'目標未満'}`);\n}\n\n/* ---------- 1枚のグラフ ---------- */\nlet selKey=null;\nfunction celebrate(msg){const d=document.createElement('div');d.className='cele';d.innerHTML=`\u003cdiv>${msg}\u003c/div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1400);}\nlet _doneSeen=null;\nfunction draw(){\n  if(S&&VARS){const now=VARS.filter(v=>done(v.id)).map(v=>v.id);if(_doneSeen){now.filter(id=>!_doneSeen.includes(id)).forEach(id=>{const v=VARS.find(q=>q.id===id);celebrate(`✓ 「${esc(v.name||v.pathway)}」を描けました！`);});}_doneSeen=now;}\n  setTimeout(()=>{window._newPt=null;},400);\n  header(); closePop();\n  const box=$('chart'); const W=box.clientWidth,H=box.clientHeight; if(W\u003c50||H\u003c50)return; box.innerHTML='';\n  const LW=138, RW=46, TOP=30, BOT=26, GAP=8, n=VARS.length, sepExtra=10;\n  const CH=30, nCol=VARS.filter(v=>isCol(v.id)).length, nOpen=Math.max(1,n-nCol);\n  const laneH=(H-TOP-BOT-GAP*(n-1)-sepExtra-CH*nCol)/nOpen; let yCur=TOP;\n  const first=Math.min(...VARS.map(v=>hist(v)[0].year));\n  const x=d3.scaleLinear().domain([first,S.horizon]).range([LW+34,W-RW-8]);\n  const nowX=x(CONFIG.nowYear), X0=x.range()[0], X1=x.range()[1];\n  const svg=d3.select(box).append('svg').attr('viewBox',`0 0 ${W} ${H}`);\n  const pat=svg.append('defs').append('pattern').attr('id','gr').attr('width',16).attr('height',16).attr('patternUnits','userSpaceOnUse');\n  pat.append('rect').attr('width',16).attr('height',16).attr('fill','#FFFDF8');pat.append('path').attr('d','M16 0H0V16').attr('fill','none').attr('stroke','#F2EAD9');\n  // 上の帯\n  svg.append('rect').attr('x',X0).attr('y',4).attr('width',nowX-X0-3).attr('height',22).attr('rx',6).attr('fill','#23263A');\n  fitText(svg.append('text').attr('class','lt').attr('x',(X0+nowX)/2).attr('y',19).attr('text-anchor','middle').attr('fill','#fff').attr('font-size',12).attr('font-weight',700).text('データに基づく過去'), nowX-X0-3, '過去');\n  svg.append('rect').attr('x',nowX+3).attr('y',4).attr('width',X1-nowX-3).attr('height',22).attr('rx',6).attr('fill','#E8790C');\n  fitText(svg.append('text').attr('class','lt').attr('x',(nowX+X1)/2).attr('y',19).attr('text-anchor','middle').attr('fill','#fff').attr('font-size',12).attr('font-weight',700).text('あなたが描く将来'), X1-nowX-3, '将来');\n  const FY=fYears(), line=d3.line().x(p=>x(p.year)).y(p=>p.yy);\n  VARS.forEach((v,i)=>{\n    if(v.role==='y') yCur+=sepExtra;\n    const y0=yCur; yCur+=(isCol(v.id)?CH:laneH)+GAP;\n    if(isCol(v.id)){ // 折りたたんだ帯：名前と状態だけ\n      const cg=svg.append('g').style('cursor','pointer').attr('tabindex',0).attr('role','button').attr('aria-expanded','false').attr('aria-label',`${v.pathway}を開く`)\n        .on('click',()=>toggleCol(v.id)).on('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggleCol(v.id)}});\n      cg.append('rect').attr('x',8).attr('y',y0).attr('width',W-RW-16).attr('height',CH).attr('rx',8).attr('fill','#ECECFD').attr('stroke','#D9D9F7');\n      cg.append('text').attr('class','lt').attr('x',18).attr('y',y0+20).attr('font-size',13).attr('font-weight',900).attr('fill','#5B5BD6').text((typeof UI!=='undefined'&&UI==='simple')?`▸ ${v.name||v.pathway}`:`▸ ${v.pathway}`)\n        .append('tspan').attr('font-weight',700).attr('fill','#23263A').attr('dx',10).text((typeof UI!=='undefined'&&UI==='simple')?'':v.name);\n      cg.append('text').attr('class','lt').attr('x',W-RW-24).attr('y',y0+20).attr('text-anchor','end').attr('font-size',11.5).attr('font-weight',700).attr('fill','#555B73')\n        .text(nPts(v.id)?`${done(v.id)?'✓ 完了':'描きかけ'}・開く ▸`:(typeof UI!=='undefined'&&UI==='simple')?'開いて描く ▸':'開いて描く（任意）▸');\n      if(!(typeof UI!=='undefined'&&UI==='simple')){ const r=S.rank.indexOf(v.id), cx=W-RW/2-4, cy=y0+CH/2;\n      const rb=svg.append('g').style('cursor','pointer').attr('role','button').attr('tabindex',0).attr('aria-label',`${v.pathway}の順位`).on('click',()=>rank(v.id)).on('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();rank(v.id)}});\n      rb.append('circle').attr('cx',cx).attr('cy',cy).attr('r',12).attr('fill',r>=0?'#FF8A3D':'#fff').attr('stroke','#FF8A3D').attr('stroke-width',2);\n      rb.append('text').attr('class','lt').attr('x',cx).attr('y',cy+4.5).attr('text-anchor','middle').attr('font-size',12.5).attr('font-weight',900).attr('fill',r>=0?'#fff':'#FF8A3D').text(r>=0?r+1:'?');\n      }\n      delete GEOM[v.id]; return;\n    }\n    const y=d3.scaleLinear().domain(v.domain).range([y0+laneH-6,y0+8]);\n    const L=S.lanes[v.id], g=svg.append('g'); L.bounds=L.bounds||{};\n    if(v.role==='y') svg.append('line').attr('x1',8).attr('x2',W-8).attr('y1',y0-GAP/2-sepExtra/2).attr('y2',y0-GAP/2-sepExtra/2).attr('stroke','#C3C7D9');\n    // ラベル\n    g.append('rect').attr('x',8).attr('y',y0).attr('width',LW-12).attr('height',laneH).attr('rx',10).attr('fill',v.role==='y'?'#FFF1DC':'#ECECFD').style('cursor','pointer').on('click',()=>openSettings(v.id)).append('title').text('クリックで範囲・データを設定');\n    if(v.role==='x'){ const cb=g.append('g').style('cursor','pointer').attr('role','button').attr('tabindex',0).attr('aria-expanded','true').attr('aria-label',`${v.pathway}を閉じる`)\n        .on('click',ev=>{ev.stopPropagation();toggleCol(v.id)}).on('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggleCol(v.id)}});\n      cb.append('rect').attr('x',LW-30).attr('y',y0+6).attr('width',22).attr('height',22).attr('rx',6).attr('fill','#fff').attr('stroke','#B7B7EE');\n      cb.append('text').attr('class','lt').attr('x',LW-19).attr('y',y0+22).attr('text-anchor','middle').attr('font-size',12).attr('fon [shape](t);\n    else if(shape==='SSH'){ const m=Math.min(.9,Math.max(.1,tt(+pr.mid))), k=10, f=u=>1/(1+Math.exp(-k*(u-m))); val=L0+(end-L0)*(f(t)-f(0))/(f(1)-f(0)); }\n    else if(shape==='PEAK'||shape==='VALLEY'){ const tp=Math.min(.95,Math.max(.05,tt(+pr.extYear))), ex=+pr.ext;\n      val = t\u003c=tp ? L0+(ex-L0)*Math.sin(Math.PI/2*t/tp) : ex+(end-ex)*(1-Math.cos(Math.PI/2*(t-tp)/(1-tp))); }\n    else if(shape==='OSC'){ val=L0+(end-L0)*t+(+pr.amp)*Math.sin(2*Math.PI*(+pr.cycles)*t); }\n    return {year:yr, value:Math.round(clampV(v,val)*10)/10};\n  });\n}\n/* ---------- システムの原型（型） ---------- */\n// roles: k=キー, nm=役割の名前, sh=典型的な形, dir=向き, y=関心のある変数に向く役割, hint=経路の目安\nconst ARCH=[\n {id:'fixes',nm:'応急処置の失敗',en:'Fixes that fail',d:'応急処置が長期的に意図せざる結果をうみ、問題がかえって悪化する。',\n  roles:[{k:'P',nm:'問題の症状',sh:'VALLEY',dir:'いったん良くなり、また悪くなる',y:1,x:40,yy:100},{k:'F',nm:'応急処置',sh:'PEX',dir:'だんだん増える',hint:/top/i,x:290,yy:100},{k:'U',nm:'意図しない結果',sh:'PEX',dir:'遅れて増える',hint:/afford|bottom/i,x:165,yy:178}],\n  e:[['P','F','+'],['F','P','-'],['F','U','+',1],['U','P','+']],L:[['B',165,72,['P','F']],['R',165,128,['F','U','P']]]},\n {id:'burden',nm:'問題の転嫁',en:'Shifting the burden',d:'即効性のある対処療法を繰り返し、根本的な解決から離れていく。',\n  roles:[{k:'S',nm:'問題の症状',sh:'OSC',dir:'上下をくり返す',y:1,x:165,yy:100},{k:'Q',nm:'対処療法',sh:'PEX',dir:'だんだん増える',hint:/top/i,x:165,yy:20},{k:'E',nm:'副作用',sh:'PEX',dir:'遅れて増える',hint:/afford/i,x:295,yy:100},{k:'F',nm:'根本的解決策',sh:'NEX',dir:'だんだん減る',hint:/bottom/i,x:165,yy:180}],\n  e:[['S','Q','+'],['Q','S','-'],['Q','E','+'],['E','F','-'],['S','F','+'],['F','S','-',1]],L:[['B',118,60,['S','Q']],['R',225,100,['Q','E','F','S']],['B',118,140,['S','F']]]},\n {id:'drift',nm:'目標のなし崩し',en:'Drifting goals',d:'実際のレベルに合わせて目標が少しずつ下がっていく。',\n  roles:[{k:'G',nm:'目標のレベル',sh:'LINR',dir:'少しずつ下がる',hint:/top/i,x:50,yy:30},{k:'A',nm:'実際のレベル',sh:'NEX',dir:'下がっていく',y:1,x:50,yy:172},{k:'Gp',nm:'ギャップ',sh:'CONST',dir:'あまり変わらない',x:168,yy:100},{k:'Pr',nm:'目標を引き下げる圧力',sh:'PEAK',dir:'強まってから弱まる',hint:/bottom/i,x 変数にあたる役割の性質：bad＝高いほど困る（問題の症状など）、good＝高いほど良い\nconst YROLE={fixes:['bad','いったん良くなり、また悪くなる'],burden:['bad','良くなったり悪くなったりをくり返す'],drift:['good','目標350g → 300g → 250g…と下がる'],limits:['good','部員が増える → 体育館が混んで増えなくなる'],under:['good','人気のお店 → 待ち時間が長くなり客が減る'],esc:['good','A店とB店の値下げ合戦'],commons:['good','遅れて悪くなる'],success:['good','選ばれる選手ばかり点を取る']};\nconst yBetter=()=>{const y=VARS.find(v=>v.role==='y');if(!y)return 'up';if(S.yBetter)return S.yBetter;if(y.better)return y.better;return /ない|困る|不足|リスク|ゼロ|損失|乱高下/.test(y.name||'')?'down':'up';};\n// 型の典型の形を、変数の「良い向き」に合わせて上下を入れ替える\nfunction yShape(def){const r=def.roles.find(q=>q.y);if(!r)return null;const sense=(YROLE[def.id]||['good'])[0];const inv=(sense==='bad')!==(yBetter()==='down');\n  let sh=r.sh;if(inv)sh=sh==='VALLEY'?'PEAK':sh==='PEAK'?'VALLEY':sh;\n  const dv0={drift:-1,commons:-1,limits:1,success:1,fixes:-1}[def.id]||1;return {sh,dir:inv?-dv0:dv0,inv,txt:(YROLE[def.id]||['',''])[1]};}\nlet tplDir=0;\nconst DIAL_NM={td:'Top-down',bu:'Bottom-up',af:'Affordability'},DIAL_JA={td:'トップダウン',bu:'ボトムアップ',af:'アフォーダビリティ'};\nconst DIAL_RE={td:/top/i,bu:/bottom/i,af:/afford/i};\nconst LV={u:'強まる ↑',s:'変わらない →',d:'弱まる ↓'};\n// 描いた線から「強まる／変わらない／弱まる」を読み取る\nfunction dialFromLane(k){const v=VARS.find(q=>q.role==='x'&&DIAL_RE[k].test(q.pathway));if(!v)return null;const L=S.lanes[v.id];if(!L)return null;\n  const ys=Object.keys(L.points).map(Number).filter(y=>y>CONFIG.nowYear).sort((a,b)=>a-b);if(!ys.length)return null;\n  const h=hist(v);const last=h[h.length-1].value,end=L.points[ys[ys.length-1]],sp=(v.domain[1]-v.domain[0])||1;const d=(end-last)/sp;\n  return d>0.05?'u':d\u003c-0.05?'d':'s';}\n// 3つのつまみの組み合わせから、近い型を2つまで挙げる（ワークショップの出発点となる仮説）\nfunction suggestArch(dl){const m=(k,v)=>dl[k]===v?1:0,sc={};\n  sc.fixes=2*m('td','u')+(dl.bu!=='u'?1:0)+(dl.af!=='u'?0.5:0);\n  sc.burden=1.5*m('td','u')+1.5*m('bu','d');\n  sc.drift=2*m('bu','d')+(dl.td!=='u'?1:0);\n  sc.limits=2*m('bu','u')+(dl.af==='s'?1:0)+0.5*m('af','d');\n  sc.success=1.5*m('bu','u')+1.5*m('af','d');\n  sc.under=1.5*m('af','d')+(dl.td!=='u'?1:0)-(dl.bu==='u'?0.5:0);\n  const why={fixes:'政策や情報だけが強まり、関心や買いやすさが追いつかないと、一時的に良くなっても戻りやすい',burden:'即効性のある働きかけに頼り、地域や家庭の取り組みが弱まると、根本的な解決から離れていく',\n    drift:'周りの関心や習慣が弱まると、「無理だ」と目標や基準が少しずつ下がっていく',limits:'関心や習慣が広がって伸びるが、やがて何かの制約で頭打ちになる',\n    success:'関心は高まっても買いやすさが下がると、買える人だけが伸びて差が広がる',under:'買いやすさが下がり、供給や環境への手当ても弱いと、伸びが止まる'};\n  return Object.entries(sc).filter(([k,v])=>v>=2).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([k])=>({id:k,why:why[k]}));}\n\n// 型の図かん：だれにでも分かる説明・身近な例・食の例・抜け出すヒント\nconst ARCH_INFO={\n fixes:{kid:'その場しのぎの手当てが、あとで別の問題を生み、かえって困ってしまう。',ex:'宿題を友だちに写させてもらう → その日は助かるけど、分からないまま次へ進み、もっと分からなくなる。',food:'空腹を安いお菓子でしのぐ → 栄養がかたよって体調をくずす。',hint:'その場しのぎの効き目が切れたあとに何が起きるか、先に考えてみる。'},\n burden:{kid:'すぐ効く方法に頼っているうちに、根本から直す力が弱っていく。',ex:'眠いので毎日エナジードリンク → 生活リズムを直す力が落ちて、ますます頼るようになる。',food:'野菜不足をサプリでおぎなう → 野菜を料理して食べる習慣が育たない。',hint:'すぐ効く方法と並行して、根本の解決にも少しずつ力を回す。'},\n drift:{kid:'目標になかなか届かないと、目標のほうを少しずつ下げてしまう。',ex:'「毎日1時間勉強」のはずが、30分、15分…と目標がいつのまにか下がる。',food:'「野菜350g」は無理だからと、目標をだんだん低くしていく。',hint:'目標を下げる前に、届かない理由を確かめる。'},\n limits:{kid:'うまく伸びていたのに、ある時からブレーキがかかって伸びなくなる。',ex:'部員が増えて部活が強くなる → 練習場所や道具が足りなくなり、伸びが止まる。',food:'野菜を食べる人が増える → 値段の高さや料理の手間がブレーキになる。',hint:'もっとがんばるより、ブレーキ（制約）をゆるめるほうに目を向ける。'},\n under:{kid:'人気が出て求められているのに、準備（設備や人）が追いつかず、人が離れていく。',ex:'人気のパン屋に行列 → 店を広げないまま待ち時間がのび、お客さんが減る。',food:'野菜の人気が上がっても、産地や運ぶしくみへの投資が遅れ、値段が上がる。',hint:'伸びているうちに、先回りして準備（能力）に投資する。'},\n esc:{kid:'相手に負けまいと張り合ううちに、お互いにどんどんエスカレートする。',ex:'SNSでの言い合いや、お店どうしの値下げ合戦。',food:'お店どうしが安さを競い、品質や生産者の暮らしが追いつめられる。',hint:'どちらかが一歩引くか、両方にとっての共通の目標を見つける。'},\n commons:{kid:'みんなが自分の得だけを考えて使うと、みんなの資源がなくなり、全員が困る。',ex:'学校の共有スペースを好き勝手に使って散らかる／海の魚のとりすぎ。',food:'みんなが同じ土地や水を使いすぎて、畑がやせ、収穫が減る。',hint:'使う人みんなで、使い方のルールを決める。'},\n success:{kid:'最初に少しうまくいった方に、チャンスや資源がどんどん集まり、差が広がる。',ex:'試合に出られる選手ばかり上達し、出られない選手との差が広がる。',food:'野菜を買いやすい地域ほど食生活がよくなり、地域の差が広がる。',hint:'チャンスや資源の配り方を見直して、かたよらないようにする。'}\n};\nconst ARCH_SHORT={\n fixes:['その場しのぎが、あとで裏目に','宿題を写させてもらう → あとでもっと分からなくなる'],\n burden:['すぐ効く方法に、頼りきり','眠いからエナジードリンク → 生活リズムがくずれる'],\n drift:['目標が、だんだん下がっていく','毎日1時間の勉強 → 30分 → 15分…'],\n limits:['伸びたあと、頭打ち','部員が増える → 練習場所が足りなくなる'],\n under:['人気に、準備が追いつかない','人気のパン屋 → 行列が長すぎて客が減る'],\n esc:['張り合うほど、エスカレート','SNSの言い合いが、どんどん激しくなる'],\n commons:['みんなで使いすぎて、なくなる','海の魚を、みんながとりすぎる'],\n success:['勝つほど有利になり、差が開く','試合に出る人ばかり、上手になる']};\n// 型の図に「たとえば」の言葉をあてはめた例（役割ごと）と、ぐるっと一周するお話\nconst ARCH_EX={ // 変数は「増えたり減ったりする量」で、数えたり測ったりできるものにする\n fixes:{n:{P:'テストの間違いの数',F:'一夜漬けの時間',U:'すぐ忘れる量'},st:['テストの間違いが多い','一夜漬けの時間を増やす','その場は間違いが減る','でもすぐ忘れて、次のテストでまた間違いが増える']},\n burden:{n:{S:'昼間の眠さ',Q:'エナジードリンクの本数',E:'夜ねむれない時間',F:'早寝できた日数'},st:['昼間に眠い','エナジードリンクの本数が増える','その場は眠気が減る','でも夜ねむれず、早寝の日が減って、また眠くなる']},\n drift:{n:{G:'目標の野菜の量（g）',A:'実際に食べた野菜の量（g）',Gp:'目標との差（g）',Pr:'「無理だよ」という声',C:'野菜を食べる工夫の数'},st:['目標350gに、実際は250gで届かない','差が大きくて「無理だよ」という声が増える','目標を300gに下げる','差は小さくなるが、工夫も減って、食べる量も少しずつ減る']},\n limits:{n:{E:'部員を誘う回数',S:'部員の数',B:'体育館の混みぐあい',C:'体育館のせまさ'},st:['部員を誘う','部員が増えて、もっと誘える','でも体育館が混んで、練習しにくくなる','やめる人も出て、部員が増えなくなる']},\n under:{n:{Eg:'お店の評判',D:'お客さんの数',Lm:'待ち時間（分）',N:'席を増やす計画',I:'席の数'},st:['評判が良くて、お客さんが増える','口コミで、もっと増える','待ち時間が長くなり、お客さんが減り始める','席を増やす計画が遅れて、間に合わない']},\n esc:{n:{Aa:'A店の値下げ',R:'A店がB店より安い分',Ba:'B店の値下げ',Ta:'A店の売上の落ちこみ',Tb:'B店の売上の落ちこみ'},st:['A店が値下げする','B店のお客さんが減る','B店がもっと値下げする','今度はA店のお客さんが減り、A店がさらに値下げする']},\n commons:{n:{Aa:'Aさんがとる魚の量',Ba:'Bさんがとる魚の量',T:'とった魚の合計',G:'1回の漁でとれる量',Lm:'海の魚の数'},st:['みんなが魚をたくさんとる','海の魚が減っていく','1回の漁でとれる量が減る','もっととろうとして、さらに減る']},\n success:{n:{Ae:'Aさんの得点',Ar:'Aさんの出場回数',Al:'監督がAさんを選ぶ割合',Be:'Bさんの得点',Br:'Bさんの出場回数'},st:['Aさんが少し多く点を取る','監督がAさんを選ぶことが増える','Aさんは出場が増えてもっと点を取り、Bさんは出場が減る','2人の差がどんどん広がる']}\n};\n// それぞれの型で「何が問題なのか」（図で目立たせる変数と、ひとことの説明：[しくみ, たとえば]）\nconst ARCH_PROB={\n fixes:{r:['P'],t:['問題の症状が、結局なくならない','テストの間違いが、結局減らない']},\n burden:{r:['S'],t:['問題の症状が、根本から解決しない','昼間の眠さが、いつまでもなくならない']},\n drift:{r:['A'],t:['実際のレベルが、少しずつ下がっていく','食べる野菜の量が、少しずつ減っていく']},\n limits:{r:['S'],t:['成果が、あるところで伸びなくなる','部員の数が、それ以上増えなくなる']},\n under:{r:['D'],t:['需要が
