<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>食の家計消費：差分マップ比較（基準年 vs 比較年）</title>
<style>
  :root { --bg: #ffffff; --ink: #0b2a55; --muted: #4b678f; --line: #d8e1f0; }
  html, body { height: 100%; }
  body { margin: 0; padding: 16px; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Meiryo", Helvetica, Arial, sans-serif;
         background: var(--bg); color: var(--ink); }
  a { color: #295aa3; text-decoration: none; border-bottom: 1px dotted #295aa3; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 18px; margin: 0 0 10px; letter-spacing: .2px; color: var(--ink); text-align:center; }
  .wrap { display: grid; grid-template-columns: 1fr 420px; gap: 16px; align-items: start; }
  #card, .controls { background: #fff; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 26px rgba(11,42,85,.08); }
  #card { padding: 14px; }
  .controls { padding: 14px; }
  label { display:block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  select { width: 100%; background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .panes { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pane { background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px; }
  .pane h2 { font-size: 14px; margin: 0 0 6px; color: var(--ink); text-align:center; }
  svg.map { width: 100%; height: auto; }
  /* Legends */
  .legend { display:flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 10px; text-align:center; }
  .legend-row { width: 320px; display:flex; }
  .legend-row.label { justify-content: center; }
  .legend-row.scale { justify-content: center; }
  .legend-scale { height: 16px; width: 320px; border-radius: 9px; outline: 1px solid var(--line); }
  .legend-axis { display:flex; justify-content: space-between; width: 320px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .legend-note { font-size: 12px; color: var(--muted); text-align:center; }
  .foot { margin-top: 8px; font-size: 12px; color: var(--muted); text-align:center; }
  .credit { margin-top: 6px; font-size: 11px; color: #6b86ac; text-align:center; }
  .tooltip { position: fixed; z-index: 9999; pointer-events: none; transform: translate(-50%, calc(-100% - 14px)); }
  .tooltip .card { background: #ffffff; color: var(--ink); border-radius: 12px; border: 1px solid var(--line);
                    padding: 10px 12px; box-shadow: 0 14px 36px rgba(11,42,85,.18); min-width: 220px; }
  .tooltip .name { font-weight: 700; font-size: 14px; }
  .tooltip .value { font-weight: 800; font-size: 20px; line-height: 1.2; margin-top: 2px; color: #072042; }
  .tooltip .meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .tooltip .arrow { width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent;
                     border-top: 10px solid #ffffff; margin: 0 auto; filter: drop-shadow(0 -1px 0 var(--line)); }
  .pill { display:inline-flex; gap:.35rem; align-items:center; background:#f2f6fb; color:#072042; padding:.25rem .6rem; border-radius: 999px; font-size: 12px; border:1px solid var(--line); }
  .row { display:flex; gap:10px; }
  .row > * { flex: 1; }
  @media (max-width: 1100px) { .wrap { grid-template-columns: 1fr; } }
</style>
</head>

  <h1>食の家計消費：差分マップ比較（基準年 vs 比較年）<br><span style="font-size:12px;color:#4b678f;">差分 = 比較年 − 基準年（赤=増加／青=減少・単位：円）</span></h1>
  <div class="wrap">
    <div id="card">
      <div class="panes">
        <div class="pane">
          <h2>左：基準年 <span id="label-base">2024年</span>（実数）</h2>
          <svg id="mapBase" class="map" viewBox="0 0 1100 1100" preserveAspectRatio="xMidYMid meet" aria-label="Base Map"></svg>
          <div class="legend">
            <div class="legend-row label"><span class="pill">値の高低（実数）</span></div>
            <div class="legend-row scale"><div class="legend-scale" id="legendScaleBase"></div></div>
            <div class="legend-axis"><span id="legendBaseMin">0</span><span id="legendBaseMid">—</span><span id="legendBaseMax">0</span></div>
          </div>
        </div>
        <div class="pane">
          <h2>右：比較年 <span id="label-comp">2025年</span>（差分＝比較−基準）</h2>
          <svg id="mapDiff" class="map" viewBox="0 0 1100 1100" preserveAspectRatio="xMidYMid meet" aria-label="Diff Map"></svg>
          <div class="legend">
            <div class="legend-row label"><span class="pill">差分（赤=増／青=減）</span></div>
            <div class="legend-row scale"><div class="legend-scale" id="legendScaleDiff"></div></div>
            <div class="legend-axis"><span id="legendDiffMin">−</span><span id="legendDiffMid">0</span><span id="legendDiffMax">＋</span></div>
          </div>
        </div>
      </div>
      <div class="foot">白背景・紺系テキスト。ツールチップは（円）で表記。</div>
      <div class="credit">境界データ出典：<a href="https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson" target="_blank" rel="noopener">dataofjapan/land — japan.geojson</a></div>
      <div class="credit">データ出典：<a href="https://www.nstac.go.jp/use/literacy/ssdse/#SSDSE-C" target="_blank" rel="noopener">NISTEP SSDSE-C 家計消費データセット</a></div>
    </div>
    <div class="controls">
      <label for="yearBase">基準年（左）</label>
      <select id="yearBase">
        <option value="2023">2023年</option>
        <option value="2024" selected>2024年</option>
        <option value="2025">2025年</option>
      </select>
      <label for="yearComp" style="margin-top:10px;">比較年（右）</label>
      <select id="yearComp">
        <option value="2023">2023年</option>
        <option value="2024">2024年</option>
        <option value="2025" selected>2025年</option>
      </select>
      <label for="item" style="margin-top:10px;">項目（数字あり=大項目／なし=サブ項目）</label>
      <select id="item"></select>
      <div class="foot" id="stats">差分 = 比較年 − 基準年（赤=増加／青=減少）</div>
    </div>
  </div>

  <div class="tooltip" id="tooltip" style="opacity:0;">
    <div class="card">
      <div class="name" id="tt-name">—</div>
      <div class="value" id="tt-value">—</div>
      <div class="meta" id="tt-meta">—</div>
    </div>
    <div class="arrow"></div>
  </div>

  {label: "04　乳卵類", items: ["04　乳卵類", "牛乳", "ヨーグルト", "卵"]},
  {label: "05　野菜・海藻", items: ["05　野菜・海藻", "キャベツ", "ねぎ", "ブロッコリー"]},
  {label: "06　果物", items: ["06　果物", "りんご", "みかん", "バナナ"]},
  {label: "07　油脂・調味料", items: ["07　油脂・調味料", "食用油", "みそ", "ドレッシング"]},
  {label: "08　菓子類", items: ["08　菓子類", "ケーキ", "せんべい", "チョコレート"]},
  {label: "09　調理食品", items: ["09　調理食品", "弁当", "調理パン", "サラダ"]},
  {label: "10　飲料", items: ["10　飲料", "茶飲料", "コーヒー", "果実・野菜ジュース"]},
  {label: "11　酒類", items: ["11　酒類", "清酒", "焼酎", "ビール"]},
  {label: "12　外食", items: ["12　外食", "すし（外食）", "和食", "洋食"]}
];
    const NAME_KEYS = ["name_ja","nam_ja","N03_001","name","pref","nam","県名","都道府県"];
    const fmtInt = d3.format(",");

    (async function() {
      const mapBase = d3.select("#mapBase");
      const mapDiff = d3.select("#mapDiff");
      const defsBase = mapBase.append("defs");
      const defsDiff = mapDiff.append("defs");

      defsBase.append("filter").attr("id","map-shadow").html(`
        <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#0b2a55" flood-opacity="0.10" />
      `);
      defsDiff.append("filter").attr("id","map-shadow").html(`
        <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#0b2a55" flood-opacity="0.10" />
      `);
      defsBase.append("filter").attr("id","hover-glow").html(`
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="blur"/>
        <feFlood flood-color="#0b2a55" flood-opacity="0.45" result="flood"/>
        <feComposite in="flood" in2="blur" operator="in" result="glow"/>
        <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
      `);
      defsDiff.append("filter").attr("id","hover-glow").html(`
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="blur"/>
        <feFlood flood-color="#0b2a55" flood-opacity="0.45" result="flood"/>
        <feComposite in="flood" in2="blur" operator="in" result="glow"/>
        <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
      `);

      const gBase = mapBase.append("g").attr("filter","url(#map-shadow)");
      const gDiff = mapDiff.append("g").attr("filter","url(#map-shadow)");
      const tooltip = d3.select("#tooltip");
      const ttName = document.getElementById("tt-name");
      const ttValue = document.getElementById("tt-value");
      const ttMeta  = document.getElementById("tt-meta");
      const legendScaleBase = document.getElementById("legendScaleBase");
      const legendBaseMin = document.getElementById("legendBaseMin");
      const legendBaseMid = document.getElementById("legendBaseMid");
      const legendBaseMax = document.getElementById("legendBaseMax");
      const legendScaleDiff = document.getElementById("legendScaleDiff");
      const legendDiffMin = document.getElementById("legendDiffMin");
      const legendDiffMid = document.getElementById("legendDiffMid");
      const legendDiffMax = document.getElementById("legendDiffMax");
      const selectItem = document.getElementById("item");
      const selectBase = document.getElementById("yearBase");
      const selectComp = document.getElementById("yearComp");
      const labelBase = document.getElementById("label-base");
      const labelComp = document.getElementById("label-comp");
      const stats = document.getElementById("stats");

      // Populate item select
      GROUPS.forEach(function(g) {
        const og = document.createElement("optgroup");
        og.label = g.label;
        g.items.forEach(function(it, idx) {
          const opt = document.createElement("option");
          opt.value = it;
          opt.textContent = (idx === 0) ? it + "（大項目）" : "・ " + it;
          og.appendChild(opt);
        });
        selectItem.appendChild(og);
      });

      const geo = await fetch("https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson").then(r=>r.json());
      const projection = d3.geoMercator().fitSize([1100,1100], geo);
      const path = d3.geoPath(projection);
      const features = geo.type==="FeatureCollection" ? geo.features : [];

      const pathsBase = gBase.selectAll("path").data(features).enter().append("path")
        .attr("d", path)
        .attr("fill", "#e6effa")
        .attr("stroke", "#0b2a55")
        .attr("stroke-width", 0.7)
        .attr("vector-effect","non-scaling-stroke")
        .style("cursor","pointer")
        .style("pointer-events","all");

      const pathsDiff = gDiff.selectAll("path").data(features).enter().append("path")
        .attr("d", path)
        .attr("fill", "#eef4fb")
        .attr("stroke", "#0b2a55")
        .attr("stroke-width", 0.7)
        .attr("vector-effect","non-scaling-stroke")
        .style("cursor","pointer")
        .style("pointer-events","all");

      function pickName(props) {
        for (const k of NAME_KEYS) if (props && props[k]) return props[k];
        for (const [k,v] of Object.entries(props||{})) if (typeof v==="string" && v) return v;
        return "(不明)";
      }

      function getVal(year, pref, item) {
        const row = (DATA[year]||{})[pref];
        const v = row ? row[item] : null;
        return (typeof v === "number" && isFinite(v)) ? v : null;
      }

      // --- legends ---
      function renderSequentialLegend(node, [mn,mx]) {
        const mid = (mn+mx)/2;
        legendBaseMin.textContent = mn.toLocaleString();
        legendBaseMax.textContent = mx.toLocaleString();
        legendBaseMid.textContent = Math.round(mid).toLocaleString();
        const stops = 120, cvs = document.createElement("canvas");
        cvs.width = stops; cvs.height = 1;
        const ctx = cvs.getContext("2d");
        for (let i=0;i<stops;i++) { ctx.fillStyle = d3.rgb(d3.interpolateBlues(i/(stops-1))).formatHex(); ctx.fillRect(i,0,1,1); }
        node.style.backgroundImage = `url(${cvs.toDataURL()})`;
        node.style.backgroundSize = "100% 100%";
      }
      function renderDivergingLegend(node, lim) {
        // symmetric domain [-lim, lim]
        legendDiffMin.textContent = (-lim).toLocaleString();
        legendDiffMax.textContent = (lim).toLocaleString();
        legendDiffMid.textContent = "0";
        const stops = 240, cvs = document.createElement("canvas");
        cvs.width = stops; cvs.height = 1;
        const ctx = cvs.getContext("2d");
        for (let i=0;i<stops;i++) {
          const t = i/(stops-1); // 0..1
          // blue-white-red diverging
          const col = d3.interpolateRdBu(1-t); // RdBu reversed so red=positive
          ctx.fillStyle = d3.rgb(col).formatHex();
          ctx.fillRect(i,0,1,1);
        }
        node.style.backgroundImage = `url(${cvs.toDataURL()})`;
        node.style.backgroundSize = "100% 100%";
      }

      function recolor(item, yBase, yComp) {
        // base absolute scale
        const valsBase = Object.entries(DATA[yBase]||{}).map(e => e[1][item]).filter(v => typeof v==="number" && isFinite(v));
        const mn = d3.min(valsBase), mx = d3.max(valsBase);
        const scaleSeq = d3.scaleSequential(d3.interpolateBlues).domain([mn, mx]);
        pathsBase.transition().duration(420).attr("fill", function(d){
          const v = getVal(yBase, pickName(d.properties), item);
          return v==null ? "#eef4fb" : scaleSeq(v);
        });
        renderSequentialLegend(legendScaleBase, [mn, mx]);

        // diff scale (comp - base), symmetric domain
        const diffs = Object.keys(DATA[yBase]||{}).map(function(pref){
          const a = getVal(yBase, pref, item);
          const b = getVal(yComp, pref, item);
          if (a==null || b==null) return null;
          return b - a;
        }).filter(v => v!=null);
        const lim = Math.max(Math.abs(d3.min(diffs)||0), Math.abs(d3.max(diffs)||0)) || 1;
        const scaleDiv = d3.scaleDiverging(d3.interpolateRdBu).domain([-lim, 0, lim]); // blue(neg) - white - red(pos)
        pathsDiff.transition().duration(420).attr("fill", function(d){
          const pref = pickName(d.properties);
          const a = getVal(yBase, pref, item);
          const b = getVal(yComp, pref, item);
          const dv = (a==null || b==null) ? null : (b - a);
          return dv==null ? "#f5f7fb" : scaleDiv(dv);
        });
        renderDivergingLegend(legendScaleDiff, Math.round(lim));

        // labels and stats
        document.getElementById("label-base").textContent = yBase + "年";
        document.getElementById("label-comp").textContent = yComp + "年";
        const meanBase = d3.mean(valsBase);
        const meanDiff = d3.mean(diffs);
        stats.innerHTML = `基準年: <b>${yBase}年</b> ／ 比較年: <b>${yComp}年</b> ／ 項目: <b>${item}</b><br>
          基準年の平均: ${Math.round(meanBase).toLocaleString()} 円 ／ 差分平均（比較−基準）: ${Math.round(meanDiff).toLocaleString()} 円`;
      }

      function showTooltip(x, y, name, html) {
        ttName.textContent = name;
        ttValue.innerHTML = html;
        ttMeta.textContent  = "";
        tooltip.style("opacity","1").style("left", x+"px").style("top", (y-8)+"px");
      }
      function hideTooltip() { tooltip.style("opacity","0"); }
      function bringToFront(el) { el.parentNode.appendChild(el); }

      function onEnter() {
        bringToFront(this);
        d3.select(this)
          .attr("stroke", "#072042")
          .attr("stroke-width", 1.8)
          .attr("filter", "url(#hover-glow)")
          .transition().duration(120)
          .attr("transform", "scale(1.004)");
      }
      function onLeave() {
        d3.select(this)
          .transition().duration(120)
          .attr("stroke", "#0b2a55")
          .attr("stroke-width", 0.7)
          .attr("filter", null)
          .attr("transform", null);
        hideTooltip();
      }

      function onMoveBase(event, d) {
        const pref = pickName(d.properties);
        const yBase = selectBase.value, yComp = selectComp.value;
        const item = selectItem.value;
        const a = getVal(yBase, pref, item);
        showTooltip(event.pageX, event.pageY, pref, (a==null ? "—" : (fmtInt(a) + " 円")));
      }
      function onMoveDiff(event, d) {
        const pref = pickName(d.properties);
        const yBase = selectBase.value, yComp = selectComp.value;
        const item = selectItem.value;
        const a = getVal(yBase, pref, item);
        const b = getVal(yComp, pref, item);
        const dv = (a==null || b==null) ? null : (b - a);
        const sign = (dv==null) ? "" : (dv>0 ? "+" : "");
        const html = `比較年: <b>${yComp}年</b> ${b==null?"—":fmtInt(b)+" 円"}<br>
                      基準年: <b>${yBase}年</b> ${a==null?"—":fmtInt(a)+" 円"}<br>
                      差分（比較−基準）: <b>${dv==null?"—":sign+fmtInt(dv)+" 円"}</b>`;
        showTooltip(event.pageX, event.pageY, pref, html);
      }

      pathsBase.on("mouseenter", onEnter).on("mousemove", onMoveBase).on("mouseleave", onLeave);
      pathsDiff.on("mouseenter", onEnter).on("mousemove", onMoveDiff).on("mouseleave", onLeave);

      // init selection (prefer '食料（合計）')
      let initial = null;
      for (let i=0;i<GROUPS.length;i++) {
        if (GROUPS[i].label === "食料（合計）") { initial = GROUPS[i].items[0]; break; }
      }
      if (!initial && GROUPS.length>0 && GROUPS[0].items.length>0) initial = GROUPS[0].items[0];
      if (initial) selectItem.value = initial;
      recolor(selectItem.value, selectBase.value, selectComp.value);
      selectItem.addEventListener("change", function() { recolor(selectItem.value, selectBase.value, selectComp.value); });
      selectBase.addEventListener("change", function() { recolor(selectItem.value, selectBase.value, selectComp.value); });
      selectComp.addEventListener("change", function() { recolor(selectItem.value, selectBase.value, selectComp.value); });
    })();
  </script>
</body>
</html>
