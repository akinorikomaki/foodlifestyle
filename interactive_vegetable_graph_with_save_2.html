<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>対象とする人口を調査（野菜を350g以上食べる人の割合）- インタラクティブ予測</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1800px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 24px;
        }
        h2 {
            text-align: center;
            color: #666;
            font-weight: normal;
            font-size: 16px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .gender-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .scenario-buttons {
            display: flex;
            gap: 10px;
        }
        .save-load-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #f0f0f0;
        }
        .btn.active {
            border-color: #4472C4;
            background: #4472C4;
            color: white;
        }
        .btn.bau {
            border-color: #70AD47;
        }
        .btn.bau.active {
            background: #70AD47;
            border-color: #70AD47;
        }
        .btn.enhanced {
            border-color: #5B9BD5;
        }
        .btn.enhanced.active {
            background: #5B9BD5;
            border-color: #5B9BD5;
        }
        .btn.decelerated {
            border-color: #C55A11;
        }
        .btn.decelerated.active {
            background: #C55A11;
            border-color: #C55A11;
        }
        .reset-btn {
            padding: 8px 16px;
            border: 2px solid #ED7D31;
            background: white;
            color: #ED7D31;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .reset-btn:hover {
            background: #ED7D31;
            color: white;
        }
        .save-btn {
            padding: 8px 16px;
            border: 2px solid #70AD47;
            background: white;
            color: #70AD47;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .save-btn:hover {
            background: #70AD47;
            color: white;
        }
        .load-btn {
            padding: 8px 16px;
            border: 2px solid #5B9BD5;
            background: white;
            color: #5B9BD5;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .load-btn:hover {
            background: #5B9BD5;
            color: white;
        }
        .file-input {
            display: none;
        }
        .instructions {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .area-man {
            fill: #7B9FD4;
            fill-opacity: 0.3;
        }
        .area-woman {
            fill: #F4B084;
            fill-opacity: 0.3;
        }
        .line-man {
            fill: none;
            stroke: #4472C4;
            stroke-width: 2;
        }
        .line-man-dashed {
            fill: none;
            stroke: #4472C4;
            stroke-width: 2;
            stroke-dasharray: 5, 5;
        }
        .line-woman {
            fill: none;
            stroke: #ED7D31;
            stroke-width: 2;
        }
        .line-woman-dashed {
            fill: none;
            stroke: #ED7D31;
            stroke-width: 2;
            stroke-dasharray: 5, 5;
        }
        .forecast-line-bau {
            fill: none;
            stroke: #70AD47;
            stroke-width: 2.5;
            stroke-dasharray: 8, 4;
        }
        .forecast-line-enhanced {
            fill: none;
            stroke: #5B9BD5;
            stroke-width: 2.5;
            stroke-dasharray: 8, 4;
        }
        .forecast-line-decelerated {
            fill: none;
            stroke: #C55A11;
            stroke-width: 2.5;
            stroke-dasharray: 8, 4;
        }
        .average-line {
            stroke: #70C494;
            stroke-width: 2;
            stroke-dasharray: 8, 4;
            fill: none;
        }
        .dot-man {
            fill: #4472C4;
            stroke: white;
            stroke-width: 2;
        }
        .dot-woman {
            fill: #ED7D31;
            stroke: white;
            stroke-width: 2;
        }
        .draggable-point {
            cursor: move;
            stroke: white;
            stroke-width: 2;
        }
        .draggable-point.bau {
            fill: #70AD47;
        }
        .draggable-point.enhanced {
            fill: #5B9BD5;
        }
        .draggable-point.decelerated {
            fill: #C55A11;
        }
        .draggable-point:hover {
            r: 8;
            stroke-width: 3;
        }
        .axis {
            font-size: 12px;
        }
        .grid line {
            stroke: #e0e0e0;
            stroke-opacity: 0.5;
            shape-rendering: crispEdges;
        }
        .grid path {
            stroke-width: 0;
        }
        .legend {
            font-size: 13px;
        }
        .average-label {
            font-size: 12px;
            fill: white;
        }
        .tooltip {
            position: absolute;
            padding: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border-radius: 4px;
            pointer-events: none;
            opacity: 0;
            font-size: 12px;
        }
        .scenario-label {
            font-weight: bold;
            margin-right: 5px;
        }
        .message {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-size: 14px;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>対象とする人口を調査（野菜を350g以上食べる人の割合）</h1>
        <h2>野菜愛好家の割合 - インタラクティブ予測ツール</h2>
        
        <div class="instructions">
            シナリオを選択し、予測線上のポイントをドラッグして未来の予測を描いてください
        </div>
        
        <div class="controls">
            <div class="gender-selector">
                <span class="scenario-label">性別:</span>
                <button class="btn active" id="gender-man">男性</button>
                <button class="btn" id="gender-woman">女性</button>
            </div>
            
            <div class="scenario-buttons">
                <span class="scenario-label">シナリオ:</span>
                <button class="btn bau active" id="scenario-bau">BAU (現状維持)</button>
                <button class="btn enhanced" id="scenario-enhanced">強化シナリオ</button>
                <button class="btn decelerated" id="scenario-decelerated">減速シナリオ</button>
            </div>
            
            <button class="reset-btn" id="reset-btn">全てリセット</button>
        </div>

        <div class="controls">
            <div class="save-load-controls">
                <button class="save-btn" id="save-btn">📥 データを保存</button>
                <button class="load-btn" id="load-btn">📤 データを読み込み</button>
                <input type="file" id="file-input" class="file-input" accept=".json,.txt">
            </div>
        </div>

        <div id="message-container"></div>
        
        <div id="chart"></div>
        <div class="tooltip"></div>
    </div>

    <script>
        // データの定義
        const historicalData = {
            man: [
                {year: 2010, value: 30.7},
                {year: 2011, value: 30.4},
                {year: 2012, value: 30.9},
                {year: 2013, value: 28.9},
                {year: 2014, value: 27.6},
                {year: 2015, value: 28.1},
                {year: 2016, value: 26.8},
                {year: 2017, value: 27.4},
                {year: 2018, value: 26.0},
                {year: 2019, value: 25.2}
            ],
            woman: [
                {year: 2010, value: 29.6},
                {year: 2011, value: 28.5},
                {year: 2012, value: 29.5},
                {year: 2013, value: 27.0},
                {year: 2014, value: 25.6},
                {year: 2015, value: 25.6},
                {year: 2016, value: 24.8},
                {year: 2017, value: 24.2},
                {year: 2018, value: 22.5},
                {year: 2019, value: 21.9}
            ]
        };

        function generateInitialForecast(lastValue, changeRate) {
            const years = [2020, 2025, 2030, 2035, 2040, 2045, 2050, 2055, 2060, 2065, 2070, 2075, 2080];
            return years.map(year => ({
                year: year,
                value: Math.max(0, Math.min(100, lastValue + (year - 2019) * changeRate))
            }));
        }

        let forecastData = {
            man: {
                bau: generateInitialForecast(25.2, -0.5),
                enhanced: generateInitialForecast(25.2, 1.0),
                decelerated: generateInitialForecast(25.2, -1.5)
            },
            woman: {
                bau: generateInitialForecast(21.9, -0.5),
                enhanced: generateInitialForecast(21.9, 1.0),
                decelerated: generateInitialForecast(21.9, -1.5)
            }
        };

        let currentGender = 'man';
        let currentScenario = 'bau';

        // グラフの設定
        const margin = {top: 20, right: 30, bottom: 80, left: 60};
        const width = 1400 - margin.left - margin.right;
        const height = 500 - margin.top - margin.bottom;

        const svg = d3.select("#chart")
            .append("svg")
            .attr("width", width + margin.left + margin.right)
            .attr("height", height + margin.top + margin.bottom)
            .append("g")
            .attr("transform", `translate(${margin.left},${margin.top})`);

        // スケールの設定
        const xScale = d3.scaleLinear()
            .domain([2010, 2080])
            .range([0, width]);

        const yScale = d3.scaleLinear()
            .domain([0, 100])
            .range([height, 0]);

        // グリッド線
        svg.append("g")
            .attr("class", "grid")
            .attr("transform", `translate(0,${height})`)
            .call(d3.axisBottom(xScale)
                .tickSize(-height)
                .tickFormat("")
                .ticks(14));

        svg.append("g")
            .attr("class", "grid")
            .call(d3.axisLeft(yScale)
                .tickSize(-width)
                .tickFormat("")
                .ticks(10));

        // 軸
        svg.append("g")
            .attr("class", "axis")
            .attr("transform", `translate(0,${height})`)
            .call(d3.axisBottom(xScale).ticks(14).tickFormat(d3.format("d")));

        svg.append("g")
            .attr("class", "axis")
            .call(d3.axisLeft(yScale).ticks(10).tickFormat(d => d + "%"));

        // 軸ラベル
        svg.append("text")
            .attr("transform", `translate(${width/2},${height + 40})`)
            .style("text-anchor", "middle")
            .text("年");

        svg.append("text")
            .attr("transform", "rotate(-90)")
            .attr("y", 0 - margin.left)
            .attr("x", 0 - (height / 2))
            .attr("dy", "1em")
            .style("text-anchor", "middle")
            .text("野菜を350g以上食べる人の割合 (%)");

        // 線とエリアのジェネレーター
        const line = d3.line()
            .x(d => xScale(d.year))
            .y(d => yScale(d.value));

        const area = d3.area()
            .x(d => xScale(d.year))
            .y0(height)
            .y1(d => yScale(d.value));

        // 履歴データを線が途切れないように分割
        function splitData(data) {
            const result = {solid1: [], dashed: [], solid2: []};
            
            for (let i = 0; i < data.length; i++) {
                if (i < 6) {
                    result.solid1.push(data[i]);
                } else if (i === 6) {
                    result.solid1.push(data[i]);
                    result.dashed.push(data[i]);
                } else if (i === 7) {
                    result.dashed.push(data[i]);
                    result.solid2.push(data[i]);
                } else {
                    result.solid2.push(data[i]);
                }
            }
            
            return result;
        }

        // 履歴データの描画
        function drawHistoricalData() {
            // 既存の履歴データを削除
            svg.selectAll(".historical-man, .historical-woman").remove();

            const manSplit = splitData(historicalData.man);
            const womanSplit = splitData(historicalData.woman);

            // 男性のエリアと線
            if (manSplit.solid1.length > 0) {
                svg.append("path")
                    .datum(manSplit.solid1)
                    .attr("class", "area-man historical-man")
                    .attr("d", area);

                svg.append("path")
                    .datum(manSplit.solid1)
                    .attr("class", "line-man historical-man")
                    .attr("d", line);
            }

            if (manSplit.dashed.length > 0) {
                svg.append("path")
                    .datum(manSplit.dashed)
                    .attr("class", "line-man-dashed historical-man")
                    .attr("d", line);
            }

            if (manSplit.solid2.length > 0) {
                svg.append("path")
                    .datum(manSplit.solid2)
                    .attr("class", "area-man historical-man")
                    .attr("d", area);

                svg.append("path")
                    .datum(manSplit.solid2)
                    .attr("class", "line-man historical-man")
                    .attr("d", line);
            }

            // 女性のエリアと線
            if (womanSplit.solid1.length > 0) {
                svg.append("path")
                    .datum(womanSplit.solid1)
                    .attr("class", "area-woman historical-woman")
                    .attr("d", area);

                svg.append("path")
                    .datum(womanSplit.solid1)
                    .attr("class", "line-woman historical-woman")
                    .attr("d", line);
            }

            if (womanSplit.dashed.length > 0) {
                svg.append("path")
                    .datum(womanSplit.dashed)
                    .attr("class", "line-woman-dashed historical-woman")
                    .attr("d", line);
            }

            if (womanSplit.solid2.length > 0) {
                svg.append("path")
                    .datum(womanSplit.solid2)
                    .attr("class", "area-woman historical-woman")
                    .attr("d", area);

                svg.append("path")
                    .datum(womanSplit.solid2)
                    .attr("class", "line-woman historical-woman")
                    .attr("d", line);
            }

            // データポイント
            svg.selectAll(".dot-man")
                .data(historicalData.man)
                .enter()
                .append("circle")
                .attr("class", "dot-man historical-man")
                .attr("cx", d => xScale(d.year))
                .attr("cy", d => yScale(d.value))
                .attr("r", 3);

            svg.selectAll(".dot-woman")
                .data(historicalData.woman)
                .enter()
                .append("circle")
                .attr("class", "dot-woman historical-woman")
                .attr("cx", d => xScale(d.year))
                .attr("cy", d => yScale(d.value))
                .attr("r", 3);
        }

        drawHistoricalData();

        // 予測線の描画グループを作成
        const forecastGroup = svg.append("g").attr("class", "forecast-group");

        // 履歴データの透明度を更新する関数
        function updateHistoricalOpacity() {
            if (currentGender === 'man') {
                svg.selectAll(".historical-man").style("opacity", 1);
                svg.selectAll(".historical-woman").style("opacity", 0.15);
            } else {
                svg.selectAll(".historical-man").style("opacity", 0.15);
                svg.selectAll(".historical-woman").style("opacity", 1);
            }
        }

        updateHistoricalOpacity();

        // 予測線を更新する関数
        function updateForecastLines() {
            forecastGroup.selectAll("*").remove();

            ['bau', 'enhanced', 'decelerated'].forEach(scenario => {
                ['man', 'woman'].forEach(gender => {
                    const lastHistorical = historicalData[gender][historicalData[gender].length - 1];
                    const forecastDataPoints = [lastHistorical, ...forecastData[gender][scenario]];
                    
                    forecastGroup.append("path")
                        .datum(forecastDataPoints)
                        .attr("class", `forecast-line-${scenario}`)
                        .attr("d", line)
                        .style("opacity", (currentGender === gender && currentScenario === scenario) ? 1 : 0.2);
                });
            });

            const currentForecastData = forecastData[currentGender][currentScenario];
            
            const drag = d3.drag()
                .on("drag", function(event, d) {
                    const newY = Math.max(0, Math.min(height, event.y));
                    d.value = Math.max(0, Math.min(100, yScale.invert(newY)));
                    
                    d3.select(this)
                        .attr("cy", yScale(d.value));
                    
                    updateForecastLines();
                });

            forecastGroup.selectAll(".draggable-point")
                .data(currentForecastData)
                .enter()
                .append("circle")
                .attr("class", `draggable-point ${currentScenario}`)
                .attr("cx", d => xScale(d.year))
                .attr("cy", d => yScale(d.value))
                .attr("r", 6)
                .call(drag)
                .on("mouseover", function(event, d) {
                    d3.select(".tooltip")
                        .style("opacity", 1)
                        .html(`${currentGender === 'man' ? '男性' : '女性'}<br>年: ${d.year}<br>予測値: ${d.value.toFixed(1)}%<br>(ドラッグして調整)`)
                        .style("left", (event.pageX + 10) + "px")
                        .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseout", function() {
                    d3.select(".tooltip").style("opacity", 0);
                });
        }

        updateForecastLines();

        // 凡例
        const legend = svg.append("g")
            .attr("class", "legend")
            .attr("transform", `translate(20, ${height + 40})`);

        let legendX = 0;

        legend.append("line")
            .attr("x1", legendX)
            .attr("x2", legendX + 30)
            .attr("y1", 0)
            .attr("y2", 0)
            .attr("stroke", "#4472C4")
            .attr("stroke-width", 2);

        legend.append("text")
            .attr("x", legendX + 35)
            .attr("y", 0)
            .attr("dy", "0.35em")
            .text("男性");

        legendX += 100;

        legend.append("line")
            .attr("x1", legendX)
            .attr("x2", legendX + 30)
            .attr("y1", 0)
            .attr("y2", 0)
            .attr("stroke", "#ED7D31")
            .attr("stroke-width", 2);

        legend.append("text")
            .attr("x", legendX + 35)
            .attr("y", 0)
            .attr("dy", "0.35em")
            .text("女性");

        legendX += 150;

        const scenarios = [
            {key: 'bau', label: 'BAU', color: '#70AD47'},
            {key: 'enhanced', label: '強化', color: '#5B9BD5'},
            {key: 'decelerated', label: '減速', color: '#C55A11'}
        ];

        scenarios.forEach(scenario => {
            legend.append("line")
                .attr("x1", legendX)
                .attr("x2", legendX + 30)
                .attr("y1", 0)
                .attr("y2", 0)
                .attr("stroke", scenario.color)
                .attr("stroke-width", 2.5)
                .attr("stroke-dasharray", "8, 4");

            legend.append("text")
                .attr("x", legendX + 35)
                .attr("y", 0)
                .attr("dy", "0.35em")
                .text(scenario.label);

            legendX += 120;
        });

        // メッセージ表示関数
        function showMessage(text, type = 'success') {
            const messageContainer = document.getElementById('message-container');
            messageContainer.innerHTML = `<div class="message ${type}">${text}</div>`;
            setTimeout(() => {
                messageContainer.innerHTML = '';
            }, 3000);
        }

        // データ保存機能
        function saveData() {
            const dataToSave = {
                version: "1.0",
                timestamp: new Date().toISOString(),
                currentGender: currentGender,
                currentScenario: currentScenario,
                forecastData: forecastData
            };

            const dataStr = JSON.stringify(dataToSave, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `vegetable_forecast_${new Date().getTime()}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            showMessage('データを保存しました！', 'success');
        }

        // データ読み込み機能
        function loadData(fileContent) {
            try {
                const loadedData = JSON.parse(fileContent);
                
                // データの検証
                if (!loadedData.forecastData || !loadedData.forecastData.man || !loadedData.forecastData.woman) {
                    throw new Error('無効なデータ形式です');
                }

                // データを適用
                forecastData = loadedData.forecastData;
                currentGender = loadedData.currentGender || 'man';
                currentScenario = loadedData.currentScenario || 'bau';

                // UIを更新
                d3.selectAll(".gender-selector .btn").classed("active", false);
                d3.select(`#gender-${currentGender}`).classed("active", true);
                
                d3.selectAll(".scenario-buttons .btn").classed("active", false);
                d3.select(`#scenario-${currentScenario}`).classed("active", true);

                // グラフを更新
                updateHistoricalOpacity();
                updateForecastLines();

                showMessage('データを読み込みました！', 'success');
            } catch (error) {
                showMessage('データの読み込みに失敗しました: ' + error.message, 'error');
            }
        }

        // ボタンのイベントハンドラ
        d3.select("#gender-man").on("click", function() {
            currentGender = 'man';
            d3.selectAll(".gender-selector .btn").classed("active", false);
            d3.select(this).classed("active", true);
            updateHistoricalOpacity();
            updateForecastLines();
        });

        d3.select("#gender-woman").on("click", function() {
            currentGender = 'woman';
            d3.selectAll(".gender-selector .btn").classed("active", false);
            d3.select(this).classed("active", true);
            updateHistoricalOpacity();
            updateForecastLines();
        });

        d3.select("#scenario-bau").on("click", function() {
            currentScenario = 'bau';
            d3.selectAll(".scenario-buttons .btn").classed("active", false);
            d3.select(this).classed("active", true);
            updateForecastLines();
        });

        d3.select("#scenario-enhanced").on("click", function() {
            currentScenario = 'enhanced';
            d3.selectAll(".scenario-buttons .btn").classed("active", false);
            d3.select(this).classed("active", true);
            updateForecastLines();
        });

        d3.select("#scenario-decelerated").on("click", function() {
            currentScenario = 'decelerated';
            d3.selectAll(".scenario-buttons .btn").classed("active", false);
            d3.select(this).classed("active", true);
            updateForecastLines();
        });

        d3.select("#reset-btn").on("click", function() {
            forecastData = {
                man: {
                    bau: generateInitialForecast(25.2, -0.5),
                    enhanced: generateInitialForecast(25.2, 1.0),
                    decelerated: generateInitialForecast(25.2, -1.5)
                },
                woman: {
                    bau: generateInitialForecast(21.9, -0.5),
                    enhanced: generateInitialForecast(21.9, 1.0),
                    decelerated: generateInitialForecast(21.9, -1.5)
                }
            };
            updateForecastLines();
            showMessage('データをリセットしました', 'success');
        });

        // 保存ボタン
        d3.select("#save-btn").on("click", saveData);

        // 読み込みボタン
        d3.select("#load-btn").on("click", function() {
            document.getElementById('file-input').click();
        });

        // ファイル選択
        document.getElementById('file-input').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    loadData(e.target.result);
                };
                reader.readAsText(file);
                // リセット（同じファイルを再度選択できるようにする）
                event.target.value = '';
            }
        });
    </script>
</body>
</html>
