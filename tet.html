body.simple #tpl:not(.det) #tplF{display:none}
#tplMore{display:none;border:0;background:none;color:#5B3A8C;font:inherit;font-size:12px;font-weight:700;cursor:pointer;padding:4px 0}
body.simple #tplMore{display:inline-block}
.uiseg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden}.uiseg button{border:0;background:#fff;font:inherit;font-size:12.5px;font-weight:700;padding:5px 10px;cursor:pointer;color:var(--ink-2)}.uiseg button[aria-pressed="true"]{background:var(--ink);color:#fff}
#tpl .th{display:flex;align-items:center;gap:8px;margin-bottom:6px}
#tpl .th b{flex:1;font-size:13.5px}
#tpl .th button{border:0;background:none;font-size:18px;cursor:pointer;line-height:1}
#tpl .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#tpl .sg button{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:4px 4px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:700;color:var(--ink)}
#tpl .sg button small{font-size:9.5px;font-weight:500;color:var(--ink-3);line-height:1.2;text-align:center}
#tpl .sg button[aria-pressed="true"]{border:2px solid var(--draw);background:#FFF8EE}
#tpl .tf{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:8px}
#tpl .tf label{font-size:11.5px;font-weight:700;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
#tpl .tf input,#tpl .tf select{border:1px solid var(--rule);border-radius:6px;padding:4px 6px;font-size:12.5px;width:100%}
#tpl .tf .w{grid-column:1/-1}
#tpl .desc{font-size:12px;color:var(--ink-2);margin-top:6px;min-height:18px}
#tpl .r{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
#tpl .r button{border:1px solid var(--rule);background:#fff;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:12.5px}
#tpl .r .ok{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
/* ---------- 集計モード ---------- */
#sumApp{grid-template-rows:auto minmax(0,1fr);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#sumApp .n{font-weight:900;font-size:13px;background:#fff;border:1px solid var(--rule);border-radius:999px;padding:3px 12px}
#sumApp main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:10px;min-height:0}
#sumApp #sm_chart{position:absolute;inset:0}
#sumApp #sm_chart svg{width:100%;height:100%;display:block}
#sumApp aside{display:flex;flex-direction:column;min-height:0}
#sumApp .tabs{display:flex;border-bottom:1px solid var(--rule)}
#sumApp .tabs button{flex:1;border:0;background:none;padding:9px 6px;font-weight:700;color:var(--ink-3);cursor:pointer;border-bottom:3px solid transparent}
#sumApp .tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--draw)}
#sumApp .pane{flex:1;overflow:auto;padding:10px 12px;font-size:13.5px}
#sumApp .drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:var(--ink-2);border:3px dashed var(--rule);border-radius:14px;background:#FBFBFE}
#sumApp .drop.over{border-color:var(--draw);background:#FFF8EE}
#sumApp .drop b{font-size:16px;color:var(--ink)}
#sumApp h3{font-size:13px;margin:10px 0 4px}
#sumApp .cm{border-left:3px solid var(--rule);padding:3px 0 3px 8px;margin:4px 0;font-size:12.5px}
#sumApp .cm .m{font-size:11px;color:var(--ink-3)}
#sumApp .cm.f{border-left-color:var(--draw)}
#sumApp table{border-collapse:collapse;width:100%;font-size:12.5px}
#sumApp th,#sumApp td{border-bottom:1px solid var(--rule);padding:5px 4px;text-align:left}
#sumApp th{font-size:11.5px;color:var(--ink-2)}
#sumApp td.num{text-align:right;font-variant-numeric:tabular-nums}
#sumApp .big{font-size:22px;font-weight:900}
#sumApp .note{font-size:11.5px;color:var(--ink-3)}
#sumApp .bar{height:8px;border-radius:4px;background:var(--draw)}
.app[hidden]{display:none!important}
@media (max-width:900px){#sumApp main{grid-template-columns:1fr}#sumApp .card{height:760px}#sumApp aside{height:600px}}
@media (max-width:760px){html,body{overflow:auto}.app{height:auto}.card{height:900px}}

/* ===== デザイン：やさしく整える（案E）＋ポップなカード（案B） ===== */
:root{--pop:#5B5BD6;--pop-d:#3F3FB0;--sun:#FFC93C;--mint:#14A37F;--coral:#FF6B6B}
body{font-size:15px}
header{background:#fff;border-radius:18px;padding:8px 12px;box-shadow:0 2px 0 #E2E4F0,0 6px 18px rgba(35,38,58,.06)}
h1{font-size:18px;font-weight:800;color:var(--pop-d)}
.card{border-radius:20px !important;box-shadow:0 2px 0 #E2E4F0,0 8px 24px rgba(35,38,58,.06) !important;border:0 !important}
.btn,.uiseg button{border-radius:12px !important;font-weight:800 !important}
.btn{border:2px solid #E2E4F0 !important;border-bottom-width:4px !important;background:#fff !important;color:var(--ink) !important;transition:transform .08s,border-bottom-width .08s}
.btn:active{transform:translateY(2px);border-bottom-width:2px !important}
.btn:not(.g){background:var(--pop) !important;border-color:var(--pop-d) !important;color:#fff !important}
#sj{background:var(--mint) !important;border-color:#0C7A5E !important}
.uiseg{border:2px solid #E2E4F0 !important;border-radius:14px !important}
.uiseg button[aria-pressed="true"]{background:var(--pop) !important}
.f input,.f select{border-radius:10px !important;border:2px solid #E2E4F0 !important;background:#fff}
footer{font-size:13px}
#tpl,#arP,#pop{border-radius:18px !important;border-width:3px !important}
#tpl .sg button{border-radius:14px !important;border-width:2px !important;border-bottom-width:4px !important;transition:transform .08s}
#tpl .sg button:active{transform:translateY(2px)}
#tpl .sg button[aria-pressed="true"]{border-color:var(--pop) !important;background:#F1F1FF !important}
#tpl .ok,#pop .ok{background:var(--pop) !important;border-radius:12px !important}
#hp .hc{border-radius:20px}
/* 点を置いたとき・描き終えたときの小さな動き */
@keyframes popIn{0%{transform:scale(.2)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
circle.fp.new{transform-box:fill-box;transform-origin:center;animation:popIn .35s ease-out}
@keyframes stamp{0%{transform:scale(.3) rotate(-25deg);opacity:0}70%{transform:scale(1.15) rotate(6deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.cele{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:300;pointer-events:none}
.cele div{background:#fff;border:3px solid var(--mint);color:#0C7A5E;font-weight:800;font-size:20px;padding:14px 22px;border-radius:20px;box-shadow:0 10px 30px rgba(20,163,127,.25);animation:stamp .45s ease-out}
@media (prefers-reduced-motion:reduce){circle.fp.new,.cele div{animation:none}}

<body>
<div class="app" id="sheetApp">
  <header>
    <h1 id="title"></h1>
    <label class="f" title="名前の代わりの番号。保存ファイル名と集計で使います">参加者番号<input id="pid" size="5" placeholder="A-012"></label>
    <label class="f" id="valWrap" title="食事記録ツールなどで測った自分の値。目標と比べて「以上／未満」を記録し、集計で立ち位置別に比べます"><span id="valLbl"></span><input id="val" type="number" min="0" style="width:66px"></label>
    <span class="posw adv" id="pos" role="status" aria-live="polite"></span>
    <label class="f" id="grpWrap" title="比べる行動データ"><select id="grp"></select></label>
    <span class="sp"></span>
    <span class="uiseg" role="group" aria-label="表示"><button id="uiS">かんたん</button><button id="uiA">くわしく</button></span>
    <label class="f adv">将来<select id="hz"></select></label>
    <label class="f adv">間隔<select id="iv"><option value="5">5年</option><option value="1">1年</option></select></label>
    <button class="btn g" id="arB" title="システムの原型（型）と、変数の役割">型</button>
    <button class="btn g adv" id="toSum">集計</button>
    <button class="btn g adv" id="st">設定</button>
    <button class="btn" id="sj">保存</button>
    <button class="btn g adv" id="sc">CSV</button>
    <button class="btn g adv" id="ld">読込</button>
    <button class="btn g" id="rs">やり直す</button>
  </header>
  <section class="card"><div id="chart"></div>
    <div id="tpl" role="dialog" aria-labelledby="tplT"><div class="th"><b id="tplT"></b><span style="font-size:10.5px;color:var(--ink-3)">⠿ ドラッグで移動</span><button id="tplX" aria-label="閉じる">×</button></div>
      <div class="sg" id="tplGrid"></div><div class="desc" id="tplD"></div><button type="button" id="tplMore">▸ 数字で細かく調整する</button><div class="tf" id="tplF"></div>
      <div class="r"><button id="tplCancel">やめる</button><button class="ok" id="tplOk">この形で描く</button></div></div>
    <div id="arP" role="dialog" aria-label="システムの原型"></div>
    <div id="pop" role="dialog" aria-label="コメント"><div class="t" id="popT"></div><input id="popIn" placeholder="なぜ？ 何が起きる？"><div class="r"><button id="popDel">点を消す</button><button id="popX">閉じる</button><button class="ok" id="popOk">OK</button></div></div>
  </section>
  <footer>
    <span class="k"><i class="sw"></i>データ</span><span class="k"><i class="sw d"></i>あなたの将来</span>

  </footer>
</div>

    <h1 id="sm_title">TET 集計</h1>

<script>
let CONFIG = {
  title:'野菜を食べる未来を描く', studyId:'foodlifestyle',
  own:{label:'野菜 g/日', value:350, unit:'g'},
  nowYear:2024, horizons:[2030,2040,2050], horizon:2050, interval:5,
  variables:[
    {id:'x1',role:'x',pathway:'Top-down',name:'社会・制度',unit:'2019=100',domain:[40,160],src:'食育白書',
     history:[[2019,100],[2020,92.3],[2021,105.6],[2022,113.2],[2023,92.3],[2024,92.7]]},
    {id:'x2',role:'x',pathway:'Bottom-up',name:'人々の関心',unit:'2019=50',domain:[0,100],src:'Google トレンド',
     history:[[2019,50],[2020,70.8],[2021,78.1],[2022,79.1],[2023,76.8],[2024,69.8]]},
    {id:'x3',role:'x',pathway:'Affordability',name:'買いやすさ',unit:'2019=100',domain:[40,160],src:'可処分所得（家計調査・勤労者世帯）÷生鮮野菜CPI（消費者物価指数）',
     history:[[2019,100],[2020,99.9],[2021,101.6],[2022,98.1],[2023,91.4],[2024,87.7]]},
    {id:'y',role:'y',pathway:'Variable of interest',name:'350g以上の人',unit:'%',domain:[0,50],src:'（統計名を記入）',
     groups:{'女性':[[2014,29.2],[2015,31.4],[2016,27.2],[2017,29.0],[2018,27.0],[2019,26.5],[2022,24.8],[2023,21.9],[2024,22.0]],
             '男性':[[2014,33.2],[2015,33.7],[2016,29.3],[2017,32.3],[2018,30.7],[2019,30.1],[2022,28.9],[2023,25.2],[2024,26.2]]}}
  ]
};
const SCHEMA='tet-sheet-1.0', qs=new URLSearchParams(location.search);
let S, STORE, VARS;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2000)};
const fresh=()=>{const lanes={};VARS.forEach(v=>lanes[v.id]={points:{},notes:{}});const g=VARS.find(v=>v.groups);
  return {schema:SCHEMA,studyId:CONFIG.studyId,participant:{id:'',value:'',group:g?Object.keys(g.groups)[0]:''},horizon:CONFIG.horizon,interval:CONFIG.interval,lanes,rank:[],collapsed:defaultCollapsed(),startedAt:new Date().toISOString(),log:[]}};
const defaultCollapsed=()=>{ const c={}; const xs=VARS.filter(v=>v.role==='x'); xs.forEach((v,i)=>{ if(CONFIG.openX ? !CONFIG.openX.includes(v.id) : i>0) c[v.id]=true; }); return c; };
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}};
const log=(type,d)=>{S.log.push({t:new Date().toISOString(),type,...(d||{})});save()};
const hist=v=>(v.groups?v.groups[S.participant.group]:v.history).map(([year,value])=>({year,value}));
const fYears=()=>{const a=[];for(let y=CONFIG.nowYear+1;y<=S.horizon;y+=S.interval)a.push(y);if(a.at(-1)!==S.horizon)a.push(S.horizon);return a};
const nPts=id=>fYears().filter(y=>S.lanes[id].points[y]!=null).length;
const hasFutureNote=id=>Object.keys(S.lanes[id].notes).some(y=>+y>CONFIG.nowYear&&S.lanes[id].notes[y].trim());
const done=id=>nPts(id)===fYears().length&&hasFutureNote(id);
const isCol=id=>!!(S.collapsed&&S.collapsed[id]) && (VARS.find(v=>v.id===id)||{}).role==='x';
function toggleCol(id){ S.collapsed=S.collapsed||{}; S.collapsed[id]=!S.collapsed[id]; log('collapse',{v:id,collapsed:S.collapsed[id]}); save(); if(typeof closeTpl==='function') closeTpl(); draw(); }
const pos=()=>S.participant.value===''?null:(+S.participant.value>=CONFIG.own.value?'hi':'lo');

/* ---------- ヘッダー ---------- */
function header(){
  $('title').textContent=CONFIG.title; $('valLbl').textContent='あなたの'+CONFIG.own.label;
  $('pid').value=S.participant.id; $('val').value=S.participant.value;
  posWidget();
  const g=VARS.find(v=>v.groups); $('grpWrap').style.display=g?'':'none';
  if(g){$('grp').innerHTML=Object.keys(g.groups).map(k=>`<option ${k===S.participant.group?'selected':''}>${esc(k)}</option>`).join('')}
  $('hz').innerHTML=CONFIG.horizons.map(h=>`<option ${h===S.horizon?'selected':''}>${h}</option>`).join('');
  $('iv').value=String(S.interval);
  const d=VARS.filter(v=>done(v.id)).length, X=VARS.filter(v=>v.role==='x').length;
  const op=VARS.filter(v=>!isCol(v.id)), dO=op.filter(v=>done(v.id)).length;
  $('prog').textContent=`完了 ${dO}/${op.length}（開いている変数）　順位 ${S.rank.length}/${X}`;
}
$('title').onclick=()=>openSettings(); $('st').onclick=()=>openSettings();
$('pid').oninput=e=>{S.participant.id=e.target.value.trim();save()};
$('val').oninput=e=>{S.participant.value=e.target.value;save();header();clearTimeout(window.__pv);window.__pv=setTimeout(draw,300)};
$('val').onchange=()=>log('own',{value:S.participant.value});
$('grp').onchange=e=>{const g=VARS.find(v=>v.groups);if(nPts(g.id)&&!confirm('線を消して切り替えますか？')){header();return}
  S.participant.group=e.target.value;S.lanes[g.id]={points:{},notes:{}};log('group',{value:e.target.value});draw()};
$('hz').onchange=e=>{S.horizon=+e.target.value;log('horizon',{value:S.horizon});draw()};
$('iv').onchange=e=>{S.interval=+e.target.value;log('interval',{value:S.interval});draw()};

/* 自分の位置：色だけに頼らず「バーの位置・印・文字」で示す */
function posWidget(){
  const el=$('pos'), p=pos(), T=CONFIG.own.value, U=CONFIG.own.unit, mx=Math.max(T*1.7, +S.participant.value||0), v=+S.participant.value||0;
  const W=64,H=14, tx=T/mx*W, fx=Math.min(v,mx)/mx*W;
  const bar=`<svg width="${W}" height="${H+6}" viewBox="0 0 ${W} ${H+6}" aria-hidden="true">
    <defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="#FFF1DC"/><line x1="0" y1="0" x2="0" y2="5" stroke="#E8790C" stroke-width="2.4"/></pattern></defs>
    <rect x="0" y="4" width="${W}" height="${H-4}" rx="5" fill="#E5EAEC"/>
    ${p?`<rect x="0" y="4" width="${fx}" height="${H-4}" rx="5" fill="${p==='hi'?'#14A37F':'url(#hatch)'}" stroke="${p==='hi'?'#14A37F':'#E8790C'}"/>`:''}
    <line x1="${tx}" x2="${tx}" y1="0" y2="${H+4}" stroke="#23263A" stroke-width="2"/></svg>`;
  el.className='posw adv '+(p||'');
  const txt = !p ? `目標 ${T}${U}（線）` : (p==='hi' ? `✓ 目標以上 +${Math.round(v-T)}${U}` : `△ あと${Math.round(T-v)}${U}で目標`);
  el.innerHTML=bar+`<span>${txt}</span>`;
  el.setAttribute('aria-label', !p?`目標は${T}${U}`:`あなたは${v}${U}。${p==='hi'?'目標以上':'目標未満'}`);
}

function parseData(text){
  const rows=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.split(/[,\t;]/).map(c=>c.trim().replace(/^"|"$/g,'')));

  return {groups};
}

const wareki=s=>{s=String(s??'').replace(/\s/g,'');let m;

  return null;};

function readSettings(){
  const C=JSON.parse(JSON.stringify(CONFIG));
  C.title=$('cTitle').value.trim()||C.title; C.own.label=$('cOwnL').value.trim()||C.own.label;
  if($('cOwnV').value!=='') C.own.value=+$('cOwnV').value; C.own.unit=$('cOwnU').value.trim();
  if($('cNow').value!=='') C.nowYear=+$('cNow').value;
  { const ai=$('cArch').value; if(ai){ if(!C.archetype||C.archetype.id!==ai) C.archetype={id:ai}; } else delete C.archetype; C.archetypeLock=$('cArchLock').checked; }
  C.variables.forEach(v=>{ const box=$('vb-'+v.id), val=k=>box.querySelector(`[data-k=${k}]`).value;
    ['pathway','name','src','unit'].forEach(k=>v[k]=val(k).trim());
    const mn=+val('min'), mx=+val('max'); if(!(isFinite(mn)&&isFinite(mx)&&mn<mx)) throw new Error(`${v.pathway}：縦軸の下限は上限より小さくしてください`);
    v.domain=[mn,mx];
    const d=parseData(val('data')); delete v.history; delete v.groups; Object.assign(v,d);
    if(!(v.history||Object.values(v.groups).flat()).some(r=>r[0]<=C.nowYear)) throw new Error(`${v.pathway}：「いま」以前のデータがありません`);
  });
  return C;
}

function lineOf(p,v){
  const H=hist(v,p.group), last=H.at(-1), pts=Object.entries(p.lanes[v.id]?.points||{}).map(([y,val])=>({year:+y,value:+val})).filter(d=>isFinite(d.value)).sort((a,b)=>a.year-b.year);

  });
  svg.append('g').attr('class','ax').attr('transform',`translate(0,${H-BOT})`).call(d3.axisBottom(x).tickValues(d3.range(Math.ceil(first/5)*5,lastY+1,5)).tickFormat(d3.format('d')).tickSizeOuter(0));
  svg.append('line').attr('x1',nowX).attr('x2',nowX).attr('y1',TOP-2).attr('y2',H-BOT).attr('stroke','#23263A').attr('stroke-dasharray','4 4');
  svg.append('text').attr('x',W-RW+36).attr('y',TOP+10).attr('text-anchor','middle').attr('font-size',10.5).attr('font-weight',700).attr('fill','#E8790C').text('効く（1位）');
}
function drawPane(people){
  const pane=$('sm_pane'); document.querySelectorAll('#sumApp .tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
  if(!CFG||!people.length){ pane.innerHTML='<p class="note">回答を読み込むと、ここに集計が表示されます。</p>'; return; }
  const V=VARS(), X=V.filter(v=>v.role==='x');
  if(tab==='types'){
    pane.innerHTML=V.map(v=>{ const {rows,lines}=stats(v,people), cnt=d3.rollup(lines,a=>a.length,d=>shapeOf(d.l,v));
      const wide=rows.slice(1).reduce((a,b)=>(b.p75-b.p25)>(a.p75-a.p25)?b:a, rows[1]||rows[0]), end=rows.at(-1);
      return `<h3 style="color:var(--${v.role})">${esc(v.pathway)}　${esc(v.name||'')}</h3>
        <div class="note">回答 ${lines.length}人／${end?end.year+'年の中央値 '+d3.format('.1f')(end.med)+'（真ん中50%：'+d3.format('.1f')(end.p25)+'〜'+d3.format('.1f')(end.p75)+'）':''}${wide?`／幅が最大：${wide.year}年`:''}</div>
        <table>${TYPES.map(t=>`<tr><td>${t}</td><td style="width:45%"><div class="bar" style="width:${lines.length?(cnt.get(t)||0)/lines.length*100:0}%"></div></td><td class="num">${cnt.get(t)||0}人</td></tr>`).join('')}</table>`; }).join('')
      + '<p class="note">型は「いま」からの変化を縦軸の幅の6%を目安に判定しています。</p>';
  } else if(tab==='rank'){
    const ids=X.map(v=>v.id), {W,m}=kendallW(people,ids), withR=people.filter(p=>p.rank.length);
    pane.innerHTML=`<h3>順位のそろい具合</h3><div class="big">${W==null?'—':'W = '+d3.format('.2f')(W)}</div>
      <div class="note">Kendall の一致係数（0＝ばらばら、1＝完全に一致）。3つとも順位をつけた ${m}人で計算</div>
      <h3>要因ごとの結果</h3><table><tr><th>経路</th><th>1位の割合</th><th class="num">平均順位</th></tr>
      ${X.map(v=>{ const f=withR.filter(p=>p.rank[0]===v.id).length, rs=withR.filter(p=>p.rank.includes(v.id)).map(p=>p.rank.indexOf(v.id)+1);
        return `<tr><td><b>${esc(v.pathway)}</b><br><span class="note">${esc(v.name||'')}</span></td><td><div class="bar" style="width:${withR.length?f/withR.length*100:0}%"></div>${withR.length?Math.round(f/withR.length*100):0}%</td><td class="num">${rs.length?d3.format('.2f')(d3.mean(rs)):'—'}</td></tr>`; }).join('')}</table>
      <p class="note">「対象」を切り替えると、立ち位置別・区分別の違いを比べられます。</p>`;
  } else if(tab==='notes'){
    pane.innerHTML=V.map(v=>{ const items=people.flatMap(p=>Object.entries(p.lanes[v.id]?.notes||{}).filter(([,t])=>t&&t.trim()).map(([yr,t])=>({yr:+yr,t,id:p.id,pos:p.pos}))).sort((a,b)=>a.yr-b.yr);
      return `<h3 style="color:var(--${v.role})">${esc(v.pathway)}（${items.length}件）</h3>${items.map(c=>`<div class="cm ${c.yr>CFG.nowYear?'f':''}">${esc(c.t)}<div class="m">${c.yr}年・${esc(c.id)}・${esc(posLabel(c.pos))}</div></div>`).join('')||'<div class="note">なし</div>'}`; }).join('');
  } else {
    pane.innerHTML=`<table><tr><th>番号</th><th>区分</th><th>自分の値</th><th>立ち位置</th><th>順位</th></tr>${people.map(p=>`<tr><td>${esc(p.id)}</td><td>${esc(p.group)}</td><td class="num">${esc(p.value)}</td><td>${esc(posLabel(p.pos))}</td><td>${p.rank.map(id=>esc((V.find(v=>v.id===id)||{}).pathway||id)).join(' > ')}</td></tr>`).join('')}</table>`;
  }
}
document.querySelectorAll('#sumApp .tabs button').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; drawPane(filtered()); });

/* ---------- 書き出し ---------- */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},0)}
$('sm_csv').onclick=()=>{ if(!P.length) return; const people=filtered(), f=$('sm_flt').selectedOptions[0]?.textContent||'全員', q=d3.format('.2f');
  const rows=[['filter','variable','pathway','year','n','median','p10','p25','p75','p90','min','max']];
  VARS().forEach(v=>stats(v,people).rows.forEach(r=>rows.push([f,v.id,v.pathway,r.year,r.n,q(r.med),q(r.p10),q(r.p25),q(r.p75),q(r.p90),q(r.min),q(r.max)])));
  rows.push([]); rows.push(['filter','variable','pathway','type','count']);
  VARS().forEach(v=>{ const {lines}=stats(v,people), c=d3.rollup(lines,a=>a.length,d=>shapeOf(d.l,v)); TYPES.forEach(t=>rows.push([f,v.id,v.pathway,t,c.get(t)||0])); });
  const X=VARS().filter(v=>v.role==='x').map(v=>v.id), {W,m}=kendallW(people,X);
  rows.push([]); rows.push(['filter','kendall_W','n_full_rank']); rows.push([f,W==null?'':q(W),m]);
  const csv='\uFEFF'+rows.map(r=>r.map(c=>{const s=String(c??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}).join(',')).join('\n');
  download(`tet_summary_${new Date().toISOString().slice(0,10)}.csv`,csv,'text/csv'); toast('集計CSVを保存しました'); };
$('sm_svg').onclick=()=>{ const s=document.querySelector('#sm_chart svg'); if(!s) return; download(`tet_summary_${new Date().toISOString().slice(0,10)}.svg`, new XMLSerializer().serializeToString(s),'image/svg+xml'); toast('図（SVG）を保存しました'); };

let tm; new ResizeObserver(()=>{clearTimeout(tm);tm=setTimeout(()=>drawChart(filtered()),80)}).observe(document.querySelector('#sumApp .card'));
// この画面（記入）の回答を集計に加える
$('sm_self').onclick=()=>{ if(!CFG) CFG=JSON.parse(JSON.stringify(window.TET.config()));
  const me=window.TET.answer(); if(!me.id){ toast('記入画面で参加者番号を入力してください'); return; }
  const i=P.findIndex(q=>q.id===me.id); if(i>=0) P[i]=me; else P.push(me); toast(`${me.id} の回答を加えました`); render(); };
$('sm_back').onclick=()=>window.TET.mode('sheet');
window.TET_SUM={render};
render();

})();
</script>
