<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>型カード：野菜のデータで見るくり返しのパターン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F5FB; --ink:#23263A; --ink-2:#4A4E66; --ink-3:#6B7088; --rule:#E2E4F0;
  --plus:#D0336B; --minus:#1E88C8; --prob:#C2412D; --probbg:#FFE9E5; --data:#E8790C; --databg:#FFF1DC;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic',Meiryo,sans-serif;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 48px}
header h1{font-size:clamp(22px,3.2vw,30px);font-weight:800;margin:0 0 6px;letter-spacing:.02em}
header p{margin:0;color:var(--ink-2);font-size:14.5px;max-width:46em}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 22px}
.btn{font:inherit;font-size:14px;font-weight:700;border:2px solid var(--rule);border-bottom-width:4px;background:#fff;color:var(--ink);
  border-radius:12px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:#B9BCD3}
.btn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:focus-visible,.card:focus-visible{outline:3px solid #1C6FD1;outline-offset:3px}
.bar .note{font-size:13px;color:var(--ink-3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr));gap:22px}
.card{position:relative;height:700px;perspective:1600px;cursor:pointer;border-radius:20px;outline:none}
.inner{position:absolute;inset:0;transition:transform .7s cubic-bezier(.3,.1,.2,1);transform-style:preserve-3d}
.card.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;
  border:2px solid var(--rule);border-bottom-width:5px;border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.back{transform:rotateY(180deg)}
.card:hover .face{border-color:var(--c)}

/* 表 */
.front .top{background:var(--c);color:#fff;padding:20px 20px 16px;text-align:center}
.front .nm{font-size:27px;font-weight:800;letter-spacing:.04em;line-height:1.25}
.front .tag{font-size:14px;opacity:.92;margin-top:4px}
.front .en{font-size:12.5px;font-weight:700;opacity:.8;margin-top:2px}
.front .q{display:none;font-size:46px;font-weight:800;line-height:1.1}
.front .body{padding:14px 18px 0;flex:1;display:flex;flex-direction:column;gap:8px}
.lbl{font-size:12px;font-weight:800;color:var(--ink-3)}
.front .ttl{font-size:15.5px;font-weight:800;line-height:1.4}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-direction:column;gap:5px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{flex:none;width:18px;height:0;border-top:4px solid var(--sc);border-radius:2px}
.legend i.dash{border-top-style:dashed;border-top-width:3px}
.read{font-size:13px;color:var(--ink);background:#F7F7FC;border-radius:12px;padding:8px 11px;line-height:1.55}
.shape{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);margin-top:auto}
.shape svg{width:84px;height:auto;flex:none}
.foot{display:flex;justify-content:space-between;align-items:center;padding:10px 18px 12px;font-size:12px;color:var(--ink-3)}
.foot b{color:var(--c);font-size:13px}

/* 裏 */
.back .hd{padding:14px 18px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--rule)}
.back .hd b{font-size:18px;color:var(--c)}
.back .hd small{font-size:11.5px;color:var(--ink-3);font-weight:700}
.back .body{padding:10px 16px 0;flex:1;display:flex;flex-direction:column;gap:8px;overflow:auto}
.prob{font-size:13.5px;font-weight:800;color:var(--prob);background:var(--probbg);border-radius:10px;padding:6px 11px}
.cldbox{position:relative}
.cld{width:100%;height:auto;display:block;background:#FAFAFE;border-radius:12px}
.zoom{position:absolute;right:6px;bottom:6px;font:inherit;font-size:11.5px;font-weight:700;border:1.5px solid var(--rule);background:#fff;color:var(--ink-2);border-radius:8px;padding:2px 8px;cursor:pointer}
.zoom:hover{border-color:var(--c);color:var(--ink)}
dialog{border:none;border-radius:20px;padding:18px 20px;width:min(860px,94vw);color:var(--ink)}
dialog::backdrop{background:rgba(35,38,58,.55)}
dialog h2{margin:0 0 4px;font-size:20px}
dialog .prob{margin:6px 0 10px}
dialog .cld{background:#FAFAFE}
dialog .close{float:right}
.key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--ink-3)}
.key em{font-style:normal;font-weight:800}
.story{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:3px}
.story li{counter-increment:s;font-size:13px;display:flex;gap:7px;align-items:baseline}
.story li::before{content:counter(s);flex:none;width:19px;height:19px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:800;
  display:inline-flex;align-items:center;justify-content:center;transform:translateY(3px)}
.again{font-size:12px;color:var(--ink-3);padding-left:26px;margin-top:-4px}
.hint{font-size:13px;background:#EEF8F4;color:#0F6F56;border-radius:10px;padding:7px 11px}
.hint b{margin-right:4px}
.src{font-size:11px;color:var(--ink-3);line-height:1.45}

/* あてっこモード：表の名前をかくす */
body.guess .front .nm,body.guess .front .tag,body.guess .front .en,body.guess .front .shape{display:none}
body.guess .front .q{display:block}
body.guess .front .top{background:#3A3E57}

.front .top{position:relative;padding:22px 20px 16px 66px}
.ico{position:absolute;left:14px;top:14px;width:46px;height:46px;padding:5px;border-radius:14px;background:rgba(255,255,255,.18)}
.ico svg{width:100%;height:100%;display:block}
body.guess .ico{display:none}
.front .nm{font-size:29px}
.front .tag{font-size:15px;font-weight:700}
.front .ttl{font-size:17.5px;line-height:1.45;margin-top:2px}
.gbox{border:2px dashed var(--rule);border-radius:14px;padding:9px 10px 4px;display:flex;flex-direction:column;gap:6px}
.lg{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.lg i{margin-top:8px}
.lg b{font-weight:800;color:var(--ink)}
.lg em{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-3);background:#EEF0F7;border-radius:6px;padding:1px 6px;margin-left:6px}
.lg small{display:block;font-size:12px;color:var(--ink-3)}
.gsrc{font-size:11px;color:var(--ink-3);text-align:right;margin:-4px 0 2px}
.read{position:relative;font-size:14px;font-weight:500;background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:16px;padding:10px 13px;margin-top:6px}
.read::before{content:"";position:absolute;left:26px;top:-9px;border:9px solid transparent;border-top:0;border-bottom-color:color-mix(in srgb,var(--c) 10%,#fff)}
.foot{justify-content:center}
.pill{background:var(--c);color:#fff;font-weight:800;font-size:14px;border-radius:999px;padding:6px 18px;border-bottom:3px solid rgba(0,0,0,.18)}
.prob{font-size:15px}
.story li{font-size:14px}
.hint{font-size:13.5px}
.hint b{display:block;margin:0 0 1px}

.sec{font-size:20px;font-weight:800;margin:30px 0 4px}
.secp{margin:0 0 14px;font-size:13.5px;color:var(--ink-2);max-width:46em}
.sec+.grid{margin-top:12px}
@media (prefers-reduced-motion:reduce){
  .inner{transition:none}
}
@media (max-width:420px){.card{height:720px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>めくって発見！ 野菜の「くり返しパターン」カード</h1>
  <p>表は、本当のデータのグラフ。めくると、そのウラで回っている「しくみ」が見えるよ。</p>
</header>
<div class="bar">
  <button class="btn" id="guess" aria-pressed="false">🙈 あてっこモード（名前をかくす）</button>
  <button class="btn" id="reset">ぜんぶ表にもどす</button>
  <span class="note">カードをクリックでめくれるよ</span>

<div class="grid" id="grid-world"></div>
<dialog id="dlg"><button class="btn close" type="button" id="dlgx">閉じる</button><div id="dlgc"></div></dialog>

  story:['少しうまくいった地域に、投資が集まる','仕事や工場がふえて、もっと豊かに','もう一方の地域には、お金が回らない','差がどんどん広がる'],
  hint:'お金や支援の配り方を見直して、取り残される地域を作らない'},
 {grp:'world',id:'limits',c:'#14A37F',bad:1,nm:'成功の限界',en:'Limits to success',tag:'伸びたあと、頭打ち',
  ttl:'リトアニア：ぐんぐん減ったのに、9%前後でストップ',
  series:[{k:'ltu'}],
  read:'最初は大きく改善（21.3%→8.8%）。でもそのあとは、改善の幅が小さくなった。取り組みが進むほど、残った人に届けるのがむずかしく（お金や手間がかかるように）なるのかも？',
  prob:'改善が、あるところで止まる',
  names:{E:'給料アップ',S:'食事を\n買える人',B:'届きにくい\n人の壁',C:'年金だけの\n高齢者など'},
  pr:['S'],data:['S'],dataNote:'（買えない人の反対）',
  story:['給料が上がり、食事を買える人がふえる','お金が回って、さらに給料が上がる','でも、年金だけの高齢者など届きにくい人が残る','それ以上、なかなか減らない'],
  hint:'みんな同じ対策より、届きにくい人にねらいを合わせよう'}
];

// 型の典型の形（tet_tool の botSVG2 と同じ線）
const TYP={
 drift:[[[0,.8],[.35,.68],[.65,.48],[1,.22]]],
 fixes:[[[0,.5],[.15,.74],[.28,.76],[.5,.45],[.75,.25],[1,.12]]],
 success:[[[0,.5],[.35,.62],[.65,.8],[1,.92]],[[0,.48],[.35,.36],[.65,.2],[1,.08]]],
 limits:[[[0,.15],[.3,.25],[.5,.55],[.7,.78],[1,.84]]],
 under:[[[0,.2],[.4,.72],[.6,.8],[.8,.68],[1,.48]]],
 burden:[[[0,.7],[.12,.88],[.24,.6],[.38,.78],[.52,.48],[.66,.64],[.8,.32],[.92,.45],[1,.18]]]};


// 型の名前に合わせたピクトグラム（白い線）
const ICON={
 fixes:'<path d="M3 15h34M3 25h34"/><rect x="15" y="11" width="10" height="18" rx="2"/><path d="M30 25c0 3 3 4 3 7a3 3 0 0 1-6 0c0-3 3-4 3-7z"/>',
 success:'<path d="M6 34h28"/><path d="M8 28l9-9 6 4 11-13"/><path d="M28 10h6v6"/><path d="M8 28l9 1 6-1"/>',
 drift:'<path d="M5 12h8v7h8v7h8v7h6"/><path d="M9 12V3l8 3-8 3"/>',
 limits:'<path d="M4 7h32"/><path d="M8 7l-3-4M16 7l-3-4M24 7l-3-4M32 7l-3-4"/><path d="M5 35c8 0 12-6 15-14s6-9 10-9"/><path d="M26 10l4 2-3 4"/>',
 under:'<path d="M13 27h14l-2 9H15z"/><path d="M20 27V11"/><path d="M20 19c-6 0-9-4-9-8 6 0 9 3 9 8z"/><path d="M20 15c5 0 9-3 9-8-6 0-9 3-9 8z"/><path d="M17 30l2 2-2 3"/>',
 burden:'<g transform="rotate(-35 20 20)"><rect x="3" y="14" width="34" height="12" rx="6"/><rect x="14" y="14" width="12" height="12"/></g><circle cx="17" cy="20" r=".8" fill="#fff"/><circle cx="21" cy="18" r=".8" fill="#fff"/><circle cx="19" cy="23" r=".8" fill="#fff"/><circle cx="23" cy="21" r=".8" fill="#fff"/>'
};
const icon=id=>`<svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[id]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let N=0;

function typSVG(id,col,flip){
  const W=120,H=60,x0=8,x1=W-6,yT=6,y0=H-8,X=t=>x0+(x1-x0)*t,Y=v=>yT+(y0-yT)*(flip?v:(1-v));
  const curve=P=>{let d=`M${X(P[0][0])},${Y(P[0][1])}`;for(let i=1;i<P.length;i++){const[a,b]=P[i-1],[c,e]=P[i],mx=(a+c)/2;d+=` C${X(mx)},${Y(b)} ${X(mx)},${Y(e)} ${X(c)},${Y(e)}`;}return d;};
  return `<svg viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="M${x0},${yT}V${y0}H${x1}" fill="none" stroke="#23263A" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="2 4"/>`+
    TYP[id].map(P=>`<path d="${curve(P)}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round"/>`).join('')+`</svg>`;
}

// 実データのグラフ（縦軸の上下の意味と、2019年の基準線をのせる）
function dataSVG(card){
  const ss=card.series.map(s=>({...D[s.k],...s}));
  const hi=ss[0].hi,lo=ss[0].lo,lw=Math.max(hi.length,lo.length)*10.5;
  const W=320,H=165,x0=Math.max(36,lw+20),x1=W-22,yT=16,y0=H-26;
  const yrs=ss.flatMap(s=>s.h.map(p=>p[0])),ya=Math.min(...yrs),yb=Math.max(...yrs);
  const X=y=>x0+(x1-x0)*(y-ya)/(yb-ya||1);
  const vals=ss.flatMap(s=>s.h.map(p=>p[1])).concat(ss[0].base!=null?[ss[0].base]:[]);
  let a=Math.min(...vals),b=Math.max(...vals),pd=(b-a)*.15||1;a-=pd;b+=pd;const Y=v=>y0-(y0-yT)*(v-a)/(b-a);
  const col2=`color-mix(in srgb, ${card.c} 40%, #9AA0B5)`;
  let g=`<path d="M${x0},${yT-6}V${y0}H${x1+8}" fill="none" stroke="#23263A" stroke-opacity=".28" stroke-width="1.5" stroke-dasharray="2 4"/>
   <text x="${x0-5}" y="${yT+4}" font-size="10.5" text-anchor="end" fill="#4A4E66" font-weight="800">↑${hi}</text>
   <text x="${x0-5}" y="${y0}" font-size="10.5" text-anchor="end" fill="#4A4E66" font-weight="800">↓${lo}</text>`;
  if(ss[0].base!=null){const by=Y(ss[0].base);
    g+=`<path d="M${x0},${by}H${x1+8}" stroke="#9AA0B5" stroke-width="1.2" stroke-dasharray="4 3"/><text x="${(x0+x1)/2+20}" y="${by+13}" font-size="9.5" text-anchor="middle" fill="#6B7088" stroke="#fff" stroke-width="3" paint-order="stroke">2019年＝${ss[0].base}</text>`;}
  [...new Set([ya,Math.round((ya+yb)/2),yb])].forEach(t=>g+=`<text x="${X(t)}" y="${H-8}" font-size="10" text-anchor="middle" fill="#6B7088">${t}</text>`);
  ss.forEach((s,i)=>{
    const pts=s.h.map(([yr,v])=>[X(yr),Y(v),yr,v]),c=i?col2:card.c;
    const segs=[[pts[0]]];for(let k=1;k<pts.length;k++){if(pts[k][2]-pts[k-1][2]>1){g+=`<path d="M${pts[k-1][0]},${pts[k-1][1]}L${pts[k][0]},${pts[k][1]}" stroke="${c}" stroke-width="2" stroke-dasharray="3 4" fill="none" opacity=".7"/>`;segs.push([]);}segs[segs.length-1].push(pts[k]);}
    segs.forEach(P=>{if(P.length<2)return;let d=`M${P[0][0]},${P[0][1]}`;
      for(let k=0;k<P.length-1;k++){const p0=P[k-1]||P[k],p1=P[k],p2=P[k+1],p3=P[k+2]||p2;
        d+=` C${p1[0]+(p2[0]-p0[0])/6},${p1[1]+(p2[1]-p0[1])/6} ${p2[0]-(p3[0]-p1[0])/6},${p2[1]-(p3[1]-p1[1])/6} ${p2[0]},${p2[1]}`;}
      g+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${i?(card.shared?5:3.5):6}" ${i&&!card.shared?'stroke-dasharray="6 5"':''} stroke-linecap="round" stroke-linejoin="round"/>`;});
    const f=pts[0],l=pts[pts.length-1],T=(x,y,v,an)=>`<text x="${x}" y="${y}" font-size="11" font-weight="800" fill="#23263A" stroke="#fff" stroke-width="3" paint-order="stroke" text-anchor="${an}">${v}</text>`;
    g+=`<circle cx="${f[0]}" cy="${f[1]}" r="3.6" fill="#23263A"/><circle cx="${l[0]}" cy="${l[1]}" r="3.6" fill="#23263A"/>`;
    const off=card.shared?(i?-8:16):-8;g+=T(f[0]+6,f[1]+off,f[3],'start')+T(l[0],l[1]+off,l[3],'middle');
    if(ss.length===1&&pts.length>3){const mid=pts.slice(1,-1);const mx=mid.reduce((p,q)=>q[3]>p[3]?q:p),mn=mid.reduce((p,q)=>q[3]<p[3]?q:p);
      [mx,mn].forEach((q,k)=>{const lo=k===1,ex=lo?(q[3]<Math.min(f[3],l[3])):(q[3]>Math.max(f[3],l[3]));if(!ex)return;
        g+=`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="#23263A"/>`+T(q[0],q[1]+(lo?16:-8),q[3]+'（'+q[2]+'）','middle');});}
  });
  const leg=ss.map((s,i)=>`<div class="lg"><i class="${i&&!card.shared?'dash':''}" style="--sc:${i?col2:card.c}"></i><div><b>${esc(s.name)}</b>${i&&s.what===ss[0].what?'':`<small>${esc(s.what)}</small>`}</div></div>`).join('');
  return {svg:`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(card.ttl)}">${g}</svg>`,leg,src:[...new Set(ss.map(s=>s.src))]};
}

// 因果ループ図（tet_tool の archSVG を、食の言葉で描けるようにしたもの）
function cldSVG(card){
  const def=ARCH[card.id],U='m'+(++N),pos=def.roles,BX={},FS=12.5,LH=14;
  const lines=k=>(card.names[k]||k).split('\n');
  Object.keys(pos).forEach(k=>{const ls=lines(k);const w=Math.max(56,Math.max(...ls.map(x=>x.length))*FS+16);const pp=card.pr.includes(k)?5:0;BX[k]=[w/2+pp,(ls.length===2?21:14)+pp];});
  const exitP=(k,tx,ty)=>{const[x,y]=pos[k],[hw,hh]=BX[k],dx=tx-x,dy=ty-y;if(!dx&&!dy)return[x,y];const sc=Math.min((hw+4)/Math.abs(dx||1e-9),(hh+4)/Math.abs(dy||1e-9));return[x+dx*sc,y+dy*sc];};
  const loopsOf=(a,b)=>def.L.filter(l=>{const n=l[3];const i=n.indexOf(a);return i>=0&&n[(i+1)%n.length]===b;});
  const mutual=(a,b)=>def.e.some(q=>q[0]===b&&q[1]===a);
  let g='';
  def.e.forEach(([a,b,p,dly])=>{const[x1,y1]=pos[a],[x2,y2]=pos[b],mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;let cx,cy;const lp=loopsOf(a,b);
    if(mutual(a,b)){cx=mx+dy*.3;cy=my-dx*.3;}
    else if(lp.length===1&&lp[0][3].length>2){const ns=lp[0][3],lx=ns.reduce((t,k)=>t+pos[k][0],0)/ns.length,ly=ns.reduce((t,k)=>t+pos[k][1],0)/ns.length;let vx=mx-lx,vy=my-ly;const l=Math.hypot(vx,vy)||1;cx=mx+vx/l*L*.22;cy=my+vy/l*L*.22;}
    else{cx=mx+dy*.08;cy=my-dx*.08;}
    const[sx,sy]=exitP(a,cx,cy),[ex,ey]=exitP(b,cx,cy),col=p==='+'?'#D0336B':'#1E88C8';
    g+=`<path d="M${sx},${sy} Q${cx},${cy} ${ex},${ey}" fill="none" stroke="${col}" stroke-width="1.8" marker-end="url(#${U}${p==='+'?'p':'n'})"/>`;
    const t=.78,qx=(1-t)**2*sx+2*(1-t)*t*cx+t*t*ex,qy=(1-t)**2*sy+2*(1-t)*t*cy+t*t*ey,tx=2*(1-t)*(cx-sx)+2*t*(ex-cx),ty=2*(1-t)*(cy-sy)+2*t*(ey-cy),tl=Math.hypot(tx,ty)||1;
    let nx=ty/tl,ny=-tx/tl;const ox=cx-(sx+ex)/2,oy=cy-(sy+ey)/2;if(nx*ox+ny*oy<0){nx=-nx;ny=-ny;}
    g+=`<text x="${qx+nx*9}" y="${qy+ny*9+4}" font-size="13" font-weight="800" fill="${col}" text-anchor="middle">${p==='+'?'+':'−'}</text>`;
    if(dly){const hx=.25*sx+.5*cx+.25*ex,hy=.25*sy+.5*cy+.25*ey;g+=`<text x="${hx}" y="${hy+4}" font-size="12" font-weight="700" text-anchor="middle" fill="#555">∥</text>`;}});
  def.L.forEach(([k,x,y])=>{const c=k==='R'?'#D0336B':'#1E88C8';g+=`<circle cx="${x}" cy="${y}" r="11" fill="#fff" stroke="${c}" stroke-width="1.5"/><text x="${x}" y="${y+4.5}" font-size="12" font-weight="800" text-anchor="middle" fill="${c}">${k}</text>`;});
  Object.keys(pos).forEach(k=>{const[x,y]=pos[k],m=lines(k),isP=card.pr.includes(k),isD=card.data.includes(k),hw=BX[k][0]-(isP?5:0),hh=BX[k][1]-(isP?5:0);
    if(isP)g+=`<rect x="${x-hw-5}" y="${y-hh-5}" width="${hw*2+10}" height="${hh*2+10}" rx="11" fill="#FFE9E5" stroke="#E5533D" stroke-width="2"/><text x="${x-hw-3}" y="${y-hh-9}" font-size="10.5" font-weight="800" fill="#C2412D">⚠ 問題</text>`;
    g+=`<rect x="${x-hw}" y="${y-hh}" width="${hw*2}" height="${hh*2}" rx="8" fill="${isD?'#FFF1DC':'#fff'}" stroke="${isD?'#E8790C':'#D9DBEA'}" stroke-width="1.3"/>`;
    m.forEach((ln,i)=>g+=`<text x="${x}" y="${y+(i-(m.length-1)/2)*LH+4.5}" font-size="${FS}" font-weight="700" text-anchor="middle" fill="${isD?'#9A4E00':'#23263A'}">${esc(ln)}</text>`);});
  return `<svg class="cld" viewBox="-34 -16 398 240" role="img" aria-label="${esc(card.nm)}の因果ループ図"><defs>
   <marker id="${U}p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#D0336B"/></marker>
   <marker id="${U}n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#1E88C8"/></marker></defs>${g}</svg>`;
}

function render(){
  const html=c=>{const d=dataSVG(c);return `
  <div class="card" tabindex="0" role="button" aria-pressed="false" aria-label="${esc(c.nm)}のカード。めくると因果ループ図" style="--c:${c.c}">
   <div class="inner">
    <section class="face front">
      <div class="top"><span class="ico">${icon(c.id)}</span><div class="nm">${esc(c.nm)}</div><div class="tag">${esc(c.tag)}</div><div class="en">${esc(c.en)}</div><div class="q" aria-hidden="true">？</div></div>
      <div class="body">
        <div class="ttl">${esc(c.ttl)}</div>
        <div class="gbox">
          <span class="lbl">📊 このグラフは…</span>
          <div class="legend">${d.leg}</div>
          ${d.svg}
          <div class="gsrc">データ：${d.src.map(esc).join('、')}</div>
        </div>
        <div class="read">${esc(c.read)}</div>
        <div class="shape">${typSVG(c.id,c.c,c.bad)}<span>この型の、よくある形${c.bad?'（上ほど困る向き）':''}</span></div>
      </div>
      <div class="foot"><span class="pill">めくってみよう ↻</span></div>
    </section>
    <section class="face back">
      <div class="hd"><b>${esc(c.nm)}</b><small>${esc(c.en)}</small></div>
      <div class="body">
        <div class="prob">⚠ ${esc(c.prob)}</div>
        <div class="cldbox">${cldSVG(c)}<button class="zoom" type="button">図を大きく</button></div>
        <div class="key"><span><em style="color:#D0336B">＋</em> 同じ向き</span><span><em style="color:#1E88C8">−</em> 反対向き</span><span><em>∥</em> 時間がかかる</span><span><em style="color:#E8790C">■</em> 表のグラフ${c.dataNote?esc(c.dataNote):''}</span></div>
        <span class="lbl">🔄 ぐるっと一周すると…</span>
        <ol class="story">${c.story.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
        <div class="again">↺ また 1 にもどって、くり返し！</div>
        <div class="hint"><b>💡 ぬけ出すヒント</b>${esc(c.hint)}</div>
        <div class="src">出典：${d.src.map(esc).join('／')}</div>
      </div>
      <div class="foot"><span class="pill">表にもどす ↻</span></div>
    </section>
   </div>
  </div>`;};
  document.getElementById('grid-jp').innerHTML=CARDS.filter(c=>!c.grp).map(html).join('');
  document.getElementById('grid-world').innerHTML=CARDS.filter(c=>c.grp==='world').map(html).join('');
  document.querySelectorAll('.card').forEach(el=>{
    const flip=()=>{el.classList.toggle('flipped');el.setAttribute('aria-pressed',el.classList.contains('flipped'));};
    el.addEventListener('click',flip);
    el.querySelector('.zoom').addEventListener('click',e=>{e.stopPropagation();const c=CARDS.filter(c=>!c.grp).concat(CARDS.filter(c=>c.grp==='world'))[[...document.querySelectorAll('.card')].indexOf(el)];
      document.getElementById('dlgc').innerHTML=`<h2 style="color:${c.c}">${esc(c.nm)} <small style="font-size:13px;color:#6B7088">${esc(c.en)}</small></h2><div class="prob">⚠ 問題：${esc(c.prob)}</div>${cldSVG(c)}`;
      document.getElementById('dlg').showModal();});
    el.querySelector('.zoom').addEventListener('keydown',e=>e.stopPropagation());
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
  });
}
render();
document.getElementById('dlgx').addEventListener('click',()=>document.getElementById('dlg').close());
document.getElementById('dlg').addEventListener('click',e=>{if(e.target.id==='dlg')e.target.close();});
document.getElementById('guess').addEventListener('click',e=>{const on=document.body.classList.toggle('guess');e.currentTarget.setAttribute('aria-pressed',on);});
document.getElementById('reset').addEventListener('click',()=>document.querySelectorAll('.card.flipped').forEach(el=>{el.classList.remove('flipped');el.setAttribute('aria-pressed','false');}));
</script>
</body>
</html>
