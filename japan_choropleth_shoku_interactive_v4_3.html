    const GROUPS = [
  {label: "食料（合計）", items: ["食料（合計）"]},
  {label: "01　穀類", items: ["01　穀類", "米", "食パン", "生うどん・そば"]},
  {label: "02　魚介類", items: ["02　魚介類", "まぐろ", "さけ", "ぶり"]},
  {label: "03　肉類", items: ["03　肉類", "牛肉", "豚肉", "鶏肉"]},
  {label: "04　乳卵類", items: ["04　乳卵類", "牛乳", "ヨーグルト", "卵"]},
  {label: "05　野菜・海藻", items: ["05　野菜・海藻", "キャベツ", "ねぎ", "ブロッコリー"]},
  {label: "06　果物", items: ["06　果物", "りんご", "みかん", "バナナ"]},
  {label: "07　油脂・調味料", items: ["07　油脂・調味料", "食用油", "みそ", "ドレッシング"]},
  {label: "08　菓子類", items: ["08　菓子類", "ケーキ", "せんべい", "チョコレート"]},
  {label: "09　調理食品", items: ["09　調理食品", "弁当", "調理パン", "サラダ"]},
  {label: "10　飲料", items: ["10　飲料", "茶飲料", "コーヒー", "果実・野菜ジュース"]},
  {label: "11　酒類", items: ["11　酒類", "清酒", "焼酎", "ビール"]},
  {label: "12　外食", items: ["12　外食", "すし（外食）", "和食", "洋食"]}
];
    const NAME_KEYS = ["name_ja","nam_ja","N03_001","name","pref","nam","県名","都道府県"];
    const fmtInt = d3.format(",");

    (async function() {
      const svg = d3.select("#map");
      const defs = svg.append("defs");

      defs.append("filter").attr("id","map-shadow").html(`
        <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#0b2a55" flood-opacity="0.10" />
      `);

      defs.append("filter").attr("id","hover-glow").html(`
        <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="blur"/>
        <feFlood flood-color="#0b2a55" flood-opacity="0.45" result="flood"/>
        <feComposite in="flood" in2="blur" operator="in" result="glow"/>
        <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
      `);

      const g = svg.append("g").attr("filter","url(#map-shadow)");
      const tooltip = d3.select("#tooltip");
      const ttName = document.getElementById("tt-name");
      const ttValue = document.getElementById("tt-value");
      const ttMeta  = document.getElementById("tt-meta");
      const legendScale = document.getElementById("legendScale");
      const legendMin = document.getElementById("legendMin");
      const legendMid = document.getElementById("legendMid");
      const legendMax = document.getElementById("legendMax");
      const select = document.getElementById("item");
      const stats = document.getElementById("stats");

      // Populate select
      GROUPS.forEach(function(g) {
        const og = document.createElement("optgroup");
        og.label = g.label;
        g.items.forEach(function(it, idx) {
          const opt = document.createElement("option");
          opt.value = it;
          opt.textContent = (idx === 0) ? it + "（大項目）" : "・ " + it;
          og.appendChild(opt);
        });
        select.appendChild(og);
      });

      const geo = await fetch("https://raw.githubusercontent.com/dataofjapan/land/master/japan.geojson").then(r=>r.json());
      const projection = d3.geoMercator().fitSize([1100,1100], geo);
      const path = d3.geoPath(projection);
      const features = geo.type==="FeatureCollection" ? geo.features : [];

      const paths = g.selectAll("path").data(features).enter().append("path")
        .attr("d", path)
        .attr("fill", "#e6effa")
        .attr("stroke", "#0b2a55")
        .attr("stroke-width", 0.7)
        .attr("vector-effect","non-scaling-stroke")
        .style("cursor","pointer")
        .style("pointer-events","all");

      const zoom = d3.zoom().scaleExtent([1, 8]).on("zoom", (ev) => g.attr("transform", ev.transform));
      svg.call(zoom);

      function pickName(props) {
        for (const k of NAME_KEYS) if (props && props[k]) return props[k];
        for (const [k,v] of Object.entries(props||{})) if (typeof v==="string" && v) return v;
        return "(不明)";
      }

      function getValue(pref, item) {
        const row = DATA[pref]; if(!row) return null;
        const v = row[item]; return (typeof v === "number" && isFinite(v)) ? v : null;
      }

      function updateLegend([mn,mx]) {
        const mid = (mn+mx)/2;
        legendMin.textContent = mn.toLocaleString();
        legendMax.textContent = mx.toLocaleString();
        legendMid.textContent = mid.toLocaleString();
        const stops = 100;
        const cvs = document.createElement("canvas"); cvs.width = stops; cvs.height = 1;
        const ctx = cvs.getContext("2d");
        for (let i=0;i<stops;i++) { ctx.fillStyle = d3.rgb(d3.interpolateBlues(i/(stops-1))).formatHex(); ctx.fillRect(i,0,1,1); }
        legendScale.style.backgroundImage = `url(${cvs.toDataURL()})`;
        legendScale.style.backgroundSize = "100% 100%";
      }

      function recolor(item) {
        const vals = Object.entries(DATA).map(function(e) { return e[1][item]; }).filter(function(v) { return typeof v === "number" && isFinite(v); });
        if (vals.length===0) { console.warn("No values for", item); return; }
        const mn = d3.min(vals), mx = d3.max(vals);
        const scale = d3.scaleSequential(d3.interpolateBlues).domain([mn, mx]);
        paths.transition().duration(420).attr("fill", function(d){
          const v = getValue(pickName(d.properties), item);
          return v==null ? "#eef4fb" : scale(v);
        });
        updateLegend([mn,mx]);
        stats.innerHTML = `選択: <b>${item}</b> ／ 件数: ${vals.length} ／ レンジ: ${mn.toLocaleString()} 〜 ${mx.toLocaleString()}（円）`;
      }

      function showTooltip(x, y, name, value, rankText) {
        ttName.textContent = name;
        ttValue.textContent = (value==null) ? "—" : (fmtInt(value) + " 円");
        ttMeta.textContent  = rankText;
        tooltip.style("opacity","1").style("left", x+"px").style("top", (y-8)+"px");
      }
      function hideTooltip() { tooltip.style("opacity","0"); }
      function bringToFront(el) { el.parentNode.appendChild(el); }

      function rankInfo(item, pref) {
        const entries = Object.entries(DATA)
          .map(function(e) { return [e[0], e[1][item]]; })
          .filter(function(x) { return typeof x[1] === "number" && isFinite(x[1]); })
          .sort(function(a,b) { return b[1]-a[1]; });
        const total = entries.length;
        const mean = d3.mean(entries, function(d) { return d[1]; });
        const meanStr = fmtInt(mean) + " 円";
        const idx = entries.findIndex(function(d) { return d[0]===pref; });
        if (idx<0) return `順位: — / ${total} ・ 平均: ${meanStr}`;
        return `順位: ${idx+1} / ${total} ・ 平均: ${meanStr}`;
      }

      function onEnter() {
        bringToFront(this);
        d3.select(this)
          .attr("stroke", "#072042")
          .attr("stroke-width", 1.8)
          .attr("filter", "url(#hover-glow)")
          .transition().duration(120)
          .attr("transform", "scale(1.004)");
      }
      function onMove(event, d) {
        const nm = pickName(d.properties);
        const item = select.value;
        const v = getValue(nm, item);
        const rinfo = rankInfo(item, nm);
        showTooltip(event.pageX, event.pageY, nm, v, rinfo);
      }
      function onLeave() {
        d3.select(this)
          .transition().duration(120)
          .attr("stroke", "#0b2a55")
          .attr("stroke-width", 0.7)
          .attr("filter", null)
          .attr("transform", null);
        hideTooltip();
      }

      paths.on("mouseenter", onEnter).on("mousemove", onMove).on("mouseleave", onLeave);

      // init selection (prefer '食料（合計）')
      let initial = null;
      for (let i=0;i<GROUPS.length;i++) {
        if (GROUPS[i].label === "食料（合計）") { initial = GROUPS[i].items[0]; break; }
      }
      if (!initial && GROUPS.length>0 && GROUPS[0].items.length>0) initial = GROUPS[0].items[0];
      if (initial) select.value = initial;
      recolor(select.value);
      select.addEventListener("change", function(e) { recolor(e.target.value); });
    })();
  </script>
